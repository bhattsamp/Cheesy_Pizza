name: Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'index.html', 'img/**', 'server/seed-data.js', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['mobile/**', 'index.html', 'img/**', 'server/seed-data.js', '.github/workflows/android-apk.yml']
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Cheesy Pizza server address the app opens. Blank uses the CHEESY_SERVER_URL repository variable, or builds the offline app if that is not set either.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Capacitor
        run: npm ci

      - name: Build the app and copy it into the Android project
        env:
          CHEESY_SERVER_URL: ${{ inputs.server_url || vars.CHEESY_SERVER_URL }}
        run: |
          if [ -z "$CHEESY_SERVER_URL" ]; then
            echo "No server address set: building the offline app (data stays on the phone)"
          else
            echo "App will open $CHEESY_SERVER_URL"
          fi
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cheesy-pizza-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Builds from main and manual runs are also published as a release, so the APK
      # has a plain link a phone can download from without signing in to GitHub:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/cheesy-pizza.apk
      - name: Publish APK to the android-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ inputs.server_url || vars.CHEESY_SERVER_URL }}
        working-directory: .
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk cheesy-pizza.apk
          if [ -n "$SERVER_URL" ]; then mode="Opens $SERVER_URL"; else mode="Offline: runs on the phone, data stays on that phone"; fi
          notes="Latest Cheesy Pizza Android app (build ${{ github.run_number }} from ${{ github.ref_name }}). $mode. Download cheesy-pizza.apk on the phone and open it to install."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --title "Cheesy Pizza Android app" --notes "$notes"
          else
            gh release create android-latest --target "$GITHUB_SHA" --title "Cheesy Pizza Android app" --notes "$notes"
          fi
          gh release upload android-latest cheesy-pizza.apk --clobber
