name: Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'index.html', 'img/**', 'server/seed-data.js', '.github/workflows/android-*.yml']
  pull_request:
    paths: ['mobile/**', 'index.html', 'img/**', 'server/seed-data.js', '.github/workflows/android-*.yml']
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Cheesy Pizza server address the app opens. Blank uses the CHEESY_SERVER_URL repository variable, else the Render server https://cheesy-pizza.onrender.com. Type offline for the offline app.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Capacitor
        run: npm ci

      # Firebase config for the Admin app's new-order alerts (both apps registered in the
      # Firebase project). Without the GOOGLE_SERVICES_JSON secret the apps build without alerts.
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase set up: both apps can get notifications while closed"
          elif [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json android/app/google-services.json
            echo "Firebase set up from firebase/google-services.json: both apps can get notifications while closed"
          else
            echo "::warning::No Firebase config (GOOGLE_SERVICES_JSON secret or mobile/firebase/google-services.json), so these apps are built without notifications"
          fi

      - name: Build the app and copy it into the Android project
        env:
          CHEESY_SERVER_URL: ${{ inputs.server_url || vars.CHEESY_SERVER_URL || 'https://cheesy-pizza.onrender.com' }}
        run: |
          if [ "$CHEESY_SERVER_URL" = offline ]; then export CHEESY_SERVER_URL=; fi
          if [ -z "$CHEESY_SERVER_URL" ]; then
            echo "No server address set: building the offline app (data stays on the phone)"
          else
            echo "App will open $CHEESY_SERVER_URL"
          fi
          npm run build
          npx cap sync android
          node scripts/admin-config.js

      - name: Build debug APKs (Cheesy Pizza and Cheesy Pizza Admin)
        working-directory: mobile/android
        run: |
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --no-daemon
          cp app/build/outputs/apk/customer/debug/app-customer-debug.apk ../../cheesy-pizza.apk
          cp app/build/outputs/apk/admin/debug/app-admin-debug.apk ../../cheesy-pizza-admin.apk

      - name: Check each app knows which one it is
        working-directory: .
        run: |
          unzip -p cheesy-pizza.apk assets/capacitor.config.json | grep -q 'CheesyApp/customer'
          unzip -p cheesy-pizza-admin.apk assets/capacitor.config.json | grep -q 'CheesyApp/admin'
          echo "Customer and Admin apps are set up correctly"

      # Checks the Play Store release build and its signing still work, with a throwaway key
      - name: Check the Play Store bundle builds
        if: github.event_name == 'pull_request'
        working-directory: mobile/android
        run: |
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/check.jks" UPLOAD_KEY_PASSWORD=checkonly
          keytool -genkeypair -keystore "$UPLOAD_KEYSTORE_FILE" -storepass checkonly -keypass checkonly -alias upload -keyalg RSA -keysize 2048 -validity 1 -dname "CN=check" >/dev/null
          ./gradlew bundleRelease --no-daemon
          ls -la app/build/outputs/bundle/*/

      - uses: actions/upload-artifact@v4
        with:
          name: cheesy-pizza-debug-apks
          path: |
            cheesy-pizza.apk
            cheesy-pizza-admin.apk
          if-no-files-found: error

      # Builds from main and manual runs are also published as a release, so the APK
      # has a plain link a phone can download from without signing in to GitHub:
      # https://github.com/<owner>/<repo>/releases/download/android-latest/cheesy-pizza.apk
      # https://github.com/<owner>/<repo>/releases/download/android-latest/cheesy-pizza-admin.apk
      - name: Publish APK to the android-latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ inputs.server_url || vars.CHEESY_SERVER_URL || 'https://cheesy-pizza.onrender.com' }}
        working-directory: .
        run: |
          if [ "$SERVER_URL" = offline ]; then SERVER_URL=; fi
          if [ -n "$SERVER_URL" ]; then mode="Opens $SERVER_URL"; else mode="Offline: runs on the phone, data stays on that phone"; fi
          notes="Latest Cheesy Pizza Android app (build ${{ github.run_number }} from ${{ github.ref_name }}). $mode. cheesy-pizza.apk is the customer app (Cheesy Pizza); cheesy-pizza-admin.apk is the owner's POS app (Cheesy Pizza Admin). Download one on the phone and open it to install."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --title "Cheesy Pizza Android app" --notes "$notes"
          else
            gh release create android-latest --target "$GITHUB_SHA" --title "Cheesy Pizza Android app" --notes "$notes"
          fi
          gh release upload android-latest cheesy-pizza.apk cheesy-pizza-admin.apk --clobber
