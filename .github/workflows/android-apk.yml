name: Android APK

on:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Cheesy Pizza server address the app opens (blank uses the CHEESY_SERVER_URL repository variable)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Capacitor
        run: npm ci

      - name: Copy app config into the Android project
        env:
          CHEESY_SERVER_URL: ${{ inputs.server_url || vars.CHEESY_SERVER_URL }}
        run: |
          if [ -z "$CHEESY_SERVER_URL" ]; then
            echo "::warning::No server address set. The APK will open a page saying so. Set the CHEESY_SERVER_URL repository variable or the server_url input."
          else
            echo "App will open $CHEESY_SERVER_URL"
          fi
          npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug -PversionCode=${{ github.run_number }} --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cheesy-pizza-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
