name: Keep server awake

# Render's free plan puts the server to sleep after 15 minutes without visits, and a sleeping
# server sometimes fails to wake up at all (it happened on 8 Nov 2026 until a manual restart).
# The server now visits itself every 10 minutes so it should not sleep. This job is the backup:
# it checks the site and, if it does not answer, restarts it through Render's deploy hook.
#
# One-time setup for the automatic restart: in Render open the service > Settings > Deploy Hook,
# copy the URL, and add it in GitHub > Settings > Secrets and variables > Actions as a secret
# named RENDER_DEPLOY_HOOK. Without the secret the job still checks and warns.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Visit the server, restart it if it does not answer
        env:
          SERVER: ${{ vars.CHEESY_SERVER_URL || 'https://cheesypizza.online' }}
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 75 "$SERVER/api/version") || true
            [ "$code" = 200 ] && { echo "Server awake ($code)"; exit 0; }
            echo "Try $i got ${code:-no answer}, retrying"; sleep 10
          done
          if [ -n "$HOOK" ]; then
            echo "::warning::Server did not answer, restarting it on Render"
            curl -s -X POST --max-time 30 "$HOOK" -o /dev/null -w 'Deploy hook answered %{http_code}\n'
          else
            echo "::warning::Server did not answer. Add the RENDER_DEPLOY_HOOK secret to restart it automatically."
          fi
