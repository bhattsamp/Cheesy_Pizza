name: Play Store bundle

# Builds the signed .aab that is uploaded to Google Play Console. Run it from
# Actions > Play Store bundle > Run workflow. Needs two repository secrets:
#   ANDROID_UPLOAD_KEYSTORE  the upload key, base64 encoded
#   UPLOAD_KEY_PASSWORD      its password
# The two bundles (customer app and Admin app) are attached to the play-latest release for download.

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Cheesy Pizza server address the app opens. Blank uses the CHEESY_SERVER_URL repository variable, else the Render server https://cheesy-pizza.onrender.com. Type offline for the offline app.'
        required: false
        default: ''

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check the upload key is set
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          PW: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Add the ANDROID_UPLOAD_KEYSTORE and UPLOAD_KEY_PASSWORD repository secrets (Settings > Secrets and variables > Actions) first."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install Capacitor
        run: npm ci

      # Firebase config for the Admin app's new-order alerts (both apps registered in the
      # Firebase project). Without the GOOGLE_SERVICES_JSON secret the apps build without alerts.
      - name: Add Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase set up: both apps can get notifications while closed"
          elif [ -f firebase/google-services.json ]; then
            cp firebase/google-services.json android/app/google-services.json
            echo "Firebase set up from firebase/google-services.json: both apps can get notifications while closed"
          else
            echo "::warning::No Firebase config (GOOGLE_SERVICES_JSON secret or mobile/firebase/google-services.json), so these apps are built without notifications"
          fi

      - name: Build the app and copy it into the Android project
        env:
          CHEESY_SERVER_URL: ${{ inputs.server_url || vars.CHEESY_SERVER_URL || 'https://cheesy-pizza.onrender.com' }}
        run: |
          if [ "$CHEESY_SERVER_URL" = offline ]; then export CHEESY_SERVER_URL=; fi
          if [ -z "$CHEESY_SERVER_URL" ]; then
            echo "::warning::No server address set: this bundle is the offline app, so orders stay on each phone."
          else
            echo "App will open $CHEESY_SERVER_URL"
          fi
          npm run build
          npx cap sync android
          node scripts/admin-config.js

      - name: Build signed bundle
        working-directory: mobile/android
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          echo "$KS" | base64 -d > "$UPLOAD_KEYSTORE_FILE"
          # Play needs each upload to have a higher version code than the last
          ./gradlew bundleRelease -PversionCode=$((100 + ${{ github.run_number }})) --no-daemon
          rm -f "$UPLOAD_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: cheesy-pizza-play-bundles
          path: |
            mobile/android/app/build/outputs/bundle/customerRelease/app-customer-release.aab
            mobile/android/app/build/outputs/bundle/adminRelease/app-admin-release.aab
          if-no-files-found: error

      - name: Attach the bundle to the play-latest release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/bundle/customerRelease/app-customer-release.aab cheesy-pizza.aab
          cp mobile/android/app/build/outputs/bundle/adminRelease/app-admin-release.aab cheesy-pizza-admin.aab
          notes="Play Store bundle, version code $((100 + ${{ github.run_number }})) from ${{ github.ref_name }}. cheesy-pizza.aab is the customer app (com.cheesypizza.app); cheesy-pizza-admin.aab is Cheesy Pizza Admin (com.cheesypizza.admin), a separate app in Play Console."
          if gh release view play-latest >/dev/null 2>&1; then
            gh release edit play-latest --title "Cheesy Pizza Play Store bundle" --notes "$notes" --prerelease
          else
            gh release create play-latest --target "$GITHUB_SHA" --title "Cheesy Pizza Play Store bundle" --notes "$notes" --prerelease
          fi
          gh release upload play-latest cheesy-pizza.aab cheesy-pizza-admin.aab --clobber
