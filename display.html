<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b3a43">
<title>Cheesy Pizza Shop Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Baloo+Bhai+2:wght@500;600;700;800&family=Courgette&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js" defer></script>
<!--
  Shop TV slideshow. Open /display on the TV and tap once for full screen.
  It plays every section of the site in turn and reads the menu, prices,
  offers, hours and the home page picks from the admin, refreshing every
  10 minutes. Options: ?outlet=o2 picks a branch, ?sec=1.5 slows it down,
  arrow keys step, space pauses.
-->
<style>
:root{--teal:#0b3a43;--teal2:#0f4a55;--sea:#1a93a8;--gold:#F2B632;--gold2:#ffd76a;--cream:#fff8e8;--ink:#0f2e36;--red:#d23f35}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#061e23;overflow:hidden;color:#fff;font-family:'Baloo Bhai 2',system-ui,sans-serif}
body.idle{cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;translate:-50% -50%;overflow:hidden;background:var(--teal);transform-origin:50% 50%}
.deck{position:absolute;inset:0;perspective:2600px;perspective-origin:50% 45%}
.sl{position:absolute;inset:0;overflow:hidden;visibility:hidden;backface-visibility:hidden;transform-style:preserve-3d}
.sl.on,.sl.out{visibility:visible}
.sl.on{z-index:2}.sl.on.out{z-index:1}
.sl.out{will-change:transform,opacity}
.anton{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.01em;text-transform:uppercase;line-height:.9}
.script{font-family:Courgette,cursive}

/* chrome that stays on every slide */
.brand{position:absolute;left:50px;top:26px;z-index:20;height:120px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.brand img{height:100%}
.clock{position:absolute;right:56px;top:46px;z-index:20;display:flex;align-items:center;gap:16px;font-weight:700;font-size:30px}
.clock b{font-size:40px;letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:10px;padding:6px 20px 4px;border-radius:99px;background:#1f8a4c;font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.pill::before{content:"";width:12px;height:12px;border-radius:50%;background:#bff5d2;animation:blink 1.2s infinite}
.pill.shut{background:var(--red)}.pill.shut::before{background:#ffd0cc}
@keyframes blink{50%{opacity:.25}}
.ticker{position:absolute;left:0;right:0;bottom:0;height:70px;z-index:20;background:var(--gold);color:#3a2800;overflow:hidden;display:flex;align-items:center;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.ticker .tk{display:flex;gap:0;white-space:nowrap;animation:tick var(--tkd,60s) linear infinite;font-size:30px;font-weight:800}
.ticker .tk span{padding:0 34px;display:inline-flex;align-items:center;gap:14px}
.ticker .tk span::after{content:"";width:16px;height:16px;border-radius:50%;background:#3a2800;margin-left:34px;opacity:.5}
.ticker .tk em{font-style:normal;background:#3a2800;color:var(--gold);padding:0 12px;border-radius:8px}
@keyframes tick{to{translate:-50% 0}}
.bar{position:absolute;left:0;bottom:70px;height:8px;z-index:21;background:var(--sea);width:0}
.dots{position:absolute;right:56px;bottom:96px;z-index:21;display:flex;gap:10px}
.dots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.3);transition:.4s}
.dots i.on{background:var(--gold);width:40px;border-radius:8px}
.tapme{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:40;background:rgba(0,0,0,.65);padding:22px 40px;border-radius:20px;font-size:32px;font-weight:700;pointer-events:none;transition:opacity .6s}

/* shared bits */
.glow{position:absolute;border-radius:50%;opacity:.55;pointer-events:none;-webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent);mask-image:radial-gradient(closest-side,#000 30%,transparent)}
.bigword{position:absolute;white-space:nowrap;font-size:360px;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.12);pointer-events:none}
.on .bigword{animation:drift 19s linear both}
@keyframes drift{from{translate:6% 0}to{translate:-14% 0}}
.kick{font-size:34px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.h1{font-size:150px;text-shadow:0 1px 0 #0a2c33,0 2px 0 #0a2c33,0 3px 0 #0a2c33,0 4px 0 #0a2c33,0 5px 0 #0a2c33,0 6px 0 #0a2c33,0 7px 0 #0a2c33,0 8px 0 #0a2c33,0 22px 30px rgba(0,0,0,.4)}
.h1 span{display:inline-block;transform-origin:50% 100%}
.on .h1 span{animation:flipin .9s calc(.25s + var(--i) * .06s) cubic-bezier(.3,1.6,.5,1) both}
@keyframes flipin{from{opacity:0;transform:perspective(800px) rotateX(-100deg) translateY(40px)}}
.rise{opacity:0}
.on .rise{animation:rise .9s var(--d,.6s) cubic-bezier(.2,.9,.3,1.2) both}
@keyframes rise{from{opacity:0;transform:translateY(60px) rotateX(30deg)}to{opacity:1;transform:none}}
.price{display:inline-flex;gap:10px;align-items:baseline;font-weight:800}
.price s{text-decoration:none;font-size:.6em;opacity:.75}

/* 1 hero */
.s-hero{background:radial-gradient(circle at 70% 50%,#14606e 0,#0b3a43 55%,#082a31 100%)}
.s-hero .copy{position:absolute;left:120px;top:250px;width:860px}
.s-hero .h1{font-size:260px;color:var(--gold)}
.s-hero .sub{font-size:58px;color:#fff;margin-top:24px}
.s-hero .tags{display:flex;gap:18px;margin-top:40px}
.s-hero .tags b{font-size:30px;padding:10px 28px 6px;border:3px solid rgba(255,255,255,.4);border-radius:99px}
.s-hero .pzw{position:absolute;right:120px;top:150px;width:800px;height:800px;perspective:1400px}
.s-hero .pz3{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(52deg)}
.on.s-hero .pz3{animation:tilt 15s ease-in-out both}
@keyframes tilt{0%{transform:rotateX(80deg) scale(.4) translateZ(-400px)}18%{transform:rotateX(48deg) scale(1)}60%{transform:rotateX(30deg) rotateY(-12deg)}100%{transform:rotateX(55deg) rotateY(8deg)}}
.s-hero .pz3 .plate{position:absolute;inset:-2%;border-radius:50%;background:radial-gradient(circle,#5a3a22 0 58%,#3b2414 70%,#2a180c 100%);box-shadow:0 0 0 14px #6b4528,0 60px 80px rgba(0,0,0,.55);transform:translateZ(-30px)}
.s-hero .pz3 img{position:absolute;inset:0;width:100%;height:100%;animation:spin 24s linear infinite}
@keyframes spin{to{rotate:360deg}}
.orbit{position:absolute;inset:0;pointer-events:none}
.orbit img{position:absolute;left:0;top:0;width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(0,0,0,.35));will-change:transform}

/* 2 cheese pull */
.s-pull{background:radial-gradient(circle at 66% 55%,#ffe7a0 0,#f2b632 45%,#d48f12 100%);color:#3a2800}
.s-pull .copy{position:absolute;left:120px;top:300px;width:720px}
.s-pull .h1{font-size:180px;color:#fff;text-shadow:0 1px 0 #b77708,0 2px 0 #b77708,0 3px 0 #b77708,0 4px 0 #b77708,0 5px 0 #b77708,0 6px 0 #b77708,0 7px 0 #b77708,0 8px 0 #b77708,0 22px 30px rgba(120,60,0,.4)}
.s-pull .sub{font-size:52px;margin-top:30px}
.s-pull .bigword{top:40px;left:0;-webkit-text-stroke-color:rgba(120,60,0,.14)}
.pullw{position:absolute;right:140px;top:140px;width:820px;height:820px;perspective:1600px}
.pull-stage{position:absolute;inset:0;transform:rotateX(22deg);transform-style:preserve-3d;--lift:0;--snap:0}
.on .pull-stage{animation:pullsway 15s ease-in-out both}
@keyframes pullsway{0%{transform:rotateX(60deg) rotateZ(-30deg) scale(.6)}15%{transform:rotateX(22deg) rotateZ(0) scale(1)}100%{transform:rotateX(16deg) rotateZ(6deg) scale(1.04)}}
.pull-plate{position:absolute;inset:3%;border-radius:50%;background:radial-gradient(circle at 50% 45%,#5a3a22 0 40%,#3b2414 70%,#2a180c 100%);box-shadow:0 50px 70px rgba(80,40,10,.45),inset 0 0 0 10px #6b4528}
.pull-pz,.pull-sl img{position:absolute;inset:7%;width:86%;height:86%}
.pull-pz{-webkit-mask-image:conic-gradient(from -26deg at 50% 50%,transparent 0 52deg,#000 0);mask-image:conic-gradient(from -26deg at 50% 50%,transparent 0 52deg,#000 0)}
.pull-sl{position:absolute;inset:0;z-index:2;clip-path:polygon(50% 50%,28.5% 0,71.5% 0);translate:0 calc(var(--lift) * -36%);rotate:calc(var(--lift) * -7deg + var(--snap) * 4deg);filter:drop-shadow(0 calc(10px + var(--lift) * 30px) 24px rgba(80,40,0,.4))}
.pull-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1;filter:drop-shadow(0 2px 3px rgba(150,100,20,.35))}
.pull-tag{position:absolute;right:-20px;top:40px;z-index:3;background:var(--red);color:#fff;font-family:Courgette,cursive;font-size:46px;padding:10px 30px;border-radius:20px;rotate:8deg;opacity:0;scale:.4;transition:.5s cubic-bezier(.3,1.8,.5,1)}
.pull-stage.up .pull-tag{opacity:1;scale:1}

/* 3 ekdum cheesy carousel */
.s-ring{background:radial-gradient(circle at 50% 60%,#14606e 0,#0b3a43 60%,#072328 100%)}
.s-ring .bigword{top:110px;left:0}
.s-ring .head{position:absolute;left:0;right:0;top:150px;text-align:center}
.s-ring .head .h1{font-size:130px;color:var(--gold)}
.ringw{position:absolute;left:50%;top:575px;width:0;height:0;perspective:2200px}
.ring{position:absolute;transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(.65,0,.35,1)}
.card{position:absolute;left:-210px;top:-215px;width:420px;height:440px;border-radius:34px;background:#fff;color:var(--ink);overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.4);transition:filter .6s,opacity .6s;filter:brightness(.5)}
.card.front{filter:none}
.card .ph{height:270px;background:#f5ead3 center/cover}
.card .ph.png{background-size:80%;background-repeat:no-repeat}
.card .tx{padding:20px 28px}
.card h3{font-size:40px;line-height:1.05;font-weight:800}
.card .price{font-size:40px;color:var(--sea);margin-top:6px}
.card .badge{position:absolute;top:18px;left:18px;background:var(--gold);color:#3a2800;font-weight:800;font-size:22px;padding:4px 16px 0;border-radius:99px}
.s-ring .now{position:absolute;left:200px;right:200px;bottom:92px;font-size:38px!important;line-height:1.2;text-align:center;font-size:48px;font-weight:700;color:#fff;min-height:70px}
.s-ring .now .price{color:var(--gold)}
.s-ring .nw{display:inline-block;animation:nw .8s .3s cubic-bezier(.3,1,.4,1) both}
@keyframes nw{from{opacity:0;transform:translateY(24px)}}

/* 4 and 5 build */
.s-build{background:linear-gradient(115deg,#0b3a43 0 48%,#f2b632 48%)}
.s-build.gb{background:linear-gradient(115deg,#0b3a43 0 48%,#1a93a8 48%)}
.s-build .copy{position:absolute;left:120px;top:190px;width:760px}
.s-build .h1{font-size:120px;color:#fff}
.steps{list-style:none;margin-top:46px;display:grid;gap:18px}
.steps li{display:flex;align-items:center;gap:26px;font-size:46px;font-weight:700;opacity:.35;transform:translateX(-10px);transition:.5s}
.steps li b{flex:none;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);font-size:36px;font-family:Anton,sans-serif;font-weight:400;transition:.5s}
.steps li.on{opacity:1;transform:none}
.steps li.on b{background:var(--gold);color:#3a2800;transform:scale(1.15) rotate(-8deg)}
.bw{position:absolute;right:130px;top:120px;width:840px;height:840px;perspective:1500px}
.b3{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(48deg) rotateZ(-10deg)}
.on .b3{animation:b3 15s ease-in-out both}
@keyframes b3{0%{transform:rotateX(70deg) rotateZ(-50deg) scale(.7)}12%{transform:rotateX(50deg) rotateZ(-10deg)}86%{transform:rotateX(40deg) rotateZ(20deg)}100%{transform:rotateX(14deg) rotateZ(30deg) scale(1.06)}}
.b3 .plate{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#5a3a22 0 58%,#3b2414 70%,#2a180c 100%);box-shadow:0 0 0 14px #6b4528,0 70px 80px rgba(0,0,0,.5)}
.b3 .ly{position:absolute;inset:6%;width:88%;height:88%;opacity:0}
.b3.gbw .plate{inset:12% -4%;border-radius:40px;background:linear-gradient(135deg,#3a4146,#22282c);box-shadow:0 0 0 12px #4b5358,0 70px 80px rgba(0,0,0,.5)}
.b3.gbw .ly{inset:auto;left:2%;top:24%;width:96%;height:auto}
.b3 .drop{position:absolute;left:50%;top:20%;opacity:0;translate:-50% 0;filter:drop-shadow(0 20px 18px rgba(0,0,0,.35))}
.ly.go{animation:ly .8s cubic-bezier(.3,1.3,.5,1) both}
@keyframes ly{from{opacity:0;transform:translateZ(500px) scale(1.25) rotate(-30deg)}to{opacity:1;transform:none}}
.ly.fade{animation:fade .9s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drop.go{animation:drop 1.1s cubic-bezier(.5,0,.7,.4) both}
@keyframes drop{0%{opacity:0;transform:translateZ(700px) translateY(-60%)}25%{opacity:1}75%{opacity:1;transform:translateZ(0) scale(1)}100%{opacity:0;transform:translateZ(0) scale(1.4,.3)}}
.steam{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1s}
.steam.go{opacity:1}
.steam i{position:absolute;bottom:55%;width:60px;height:180px;border-radius:50%;background:radial-gradient(rgba(255,255,255,.5),transparent 70%);animation:steam 2.4s linear infinite}
@keyframes steam{from{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.8}to{transform:translateY(-300px) scale(1.6);opacity:0}}
.s-build .done{position:absolute;z-index:6;right:130px;top:150px;font-size:70px;color:#3a2800;font-family:Courgette,cursive;opacity:0;scale:.5;rotate:-8deg;transition:.6s cubic-bezier(.3,1.8,.5,1)}
.s-build.gb .done{color:#fff}
.s-build .done.go{opacity:1;scale:1}

/* 6 best sellers */
.s-best{background:linear-gradient(160deg,#1a93a8,#0b3a43)}
.s-best .bigword{top:80px;left:0}
.s-best .head{position:absolute;left:120px;top:170px}
.s-best .head .h1{font-size:120px;color:#fff}
.grid{position:absolute;left:120px;right:120px;top:400px;display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:44px;perspective:1600px}
.bcard{background:#fff;color:var(--ink);border-radius:34px;overflow:hidden;box-shadow:0 30px 50px rgba(0,0,0,.35);transform-origin:50% 100%;opacity:0}
.on .bcard{animation:bflip 1s calc(.5s + var(--i) * .22s) cubic-bezier(.3,1.4,.5,1) both,bob 4s calc(1.6s + var(--i) * .3s) ease-in-out infinite alternate}
@keyframes bflip{from{opacity:0;transform:rotateY(-95deg) translateZ(-300px)}to{opacity:1;transform:none}}
@keyframes bob{from{transform:rotateY(-7deg) rotateX(4deg) translateY(0)}to{transform:rotateY(7deg) rotateX(-3deg) translateY(-24px)}}
.bcard .ph{height:300px;background:#f5ead3 center/cover;position:relative}
.bcard .ph.png{background-size:78%;background-repeat:no-repeat}
.bcard .rib{position:absolute;right:-50px;top:28px;rotate:40deg;background:var(--red);color:#fff;font-weight:800;font-size:22px;padding:6px 60px 2px;letter-spacing:.08em;text-transform:uppercase}
.bcard .tx{padding:22px 30px 30px}
.bcard h3{font-size:42px;line-height:1.05;font-weight:800}
.bcard p{font-size:24px;color:#56727a;line-height:1.3;margin-top:8px;height:62px;overflow:hidden}
.bcard .price{font-size:44px;color:var(--sea);margin-top:12px}

/* 7 offers */
.s-offers{background:radial-gradient(circle at 30% 30%,#e04a3f,#a5241b 70%)}
.s-offers .bigword{top:90px;left:0}
.s-offers .head{position:absolute;left:0;right:0;top:160px;text-align:center}
.s-offers .head .h1{font-size:130px;color:#fff}
.offs{position:absolute;left:120px;right:120px;top:500px;display:flex;justify-content:center;gap:50px;perspective:1600px}
.off{flex:0 1 520px;background:var(--cream);color:#3a1008;border-radius:36px;padding:44px 40px 40px;text-align:center;position:relative;box-shadow:0 30px 60px rgba(60,0,0,.35);opacity:0}
.on .off{animation:offin 1s calc(.5s + var(--i) * .25s) cubic-bezier(.3,1.5,.5,1) both}
@keyframes offin{from{opacity:0;transform:rotateX(90deg) translateY(-100px)}to{opacity:1;transform:none}}
.coin{width:210px;height:210px;margin:-130px auto 20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a3,#f2b632 55%,#c88a0e);display:grid;place-items:center;font-family:Anton,sans-serif;font-size:76px;color:#3a2800;box-shadow:0 0 0 10px #fff,0 20px 30px rgba(0,0,0,.3);line-height:.9}
.coin small{display:block;font-size:34px}
.on .coin{animation:coin 3.6s 1.2s ease-in-out infinite}
@keyframes coin{0%,60%{transform:rotateY(0)}80%,100%{transform:rotateY(360deg)}}
.offimg{position:absolute;right:-22px;top:-34px;width:104px;height:104px;border-radius:50%;object-fit:cover;border:8px solid #fff;box-shadow:0 14px 24px rgba(0,0,0,.3)}
.off h3{font-size:50px;font-weight:800;line-height:1.05}
.off p{font-size:30px;margin-top:10px;color:#7a3a2a}
.s-offers .codes{position:absolute;left:0;right:0;bottom:130px;text-align:center;font-size:36px;font-weight:700}
.s-offers .codes b{background:#fff;color:var(--red);padding:4px 18px 0;border-radius:12px;margin:0 6px;letter-spacing:.06em}

/* 8 combos */
.s-combos{background:linear-gradient(200deg,#0f4a55,#072328)}
.s-combos .bigword{top:90px;left:0}
.s-combos .head{position:absolute;left:120px;top:170px}
.s-combos .head .h1{font-size:120px;color:var(--gold)}
.combos{position:absolute;left:120px;right:120px;top:420px;display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:50px;perspective:1600px}
.cmb{background:rgba(255,255,255,.08);border:3px solid rgba(255,255,255,.18);border-radius:36px;padding:36px;opacity:0;position:relative}
.on .cmb{animation:cmbin 1s calc(.5s + var(--i) * .25s) cubic-bezier(.3,1.4,.5,1) both}
@keyframes cmbin{from{opacity:0;transform:translateZ(-800px) rotateY(40deg)}to{opacity:1;transform:none}}
.cmb .stk{display:flex;height:150px;margin-bottom:20px}
.cmb .stk img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:6px solid #fff;margin-right:-40px;box-shadow:0 10px 20px rgba(0,0,0,.3)}
.cmb h3{font-size:54px;font-weight:800;color:#fff}
.cmb p{font-size:28px;color:#bfe1e7;line-height:1.3;margin-top:6px;min-height:74px}
.cmb-save{position:absolute;right:-14px;top:-18px;background:var(--red);color:#fff;font-weight:800;font-size:26px;padding:8px 20px 4px;border-radius:99px;rotate:8deg;box-shadow:0 10px 20px rgba(0,0,0,.3)}
.on .cmb-save{animation:pop .6s calc(1.4s + var(--i) * .25s) cubic-bezier(.3,2,.5,1) both}
.cmb .price s{font-size:.5em;opacity:.6;margin-left:8px;text-decoration:line-through}
.cmb .price{font-size:64px;color:var(--gold);margin-top:16px;font-family:Anton,sans-serif;font-weight:400}

/* 9 hours */
.s-hours{background:#f2b632;color:#3a2800}
.s-hours .bigword{top:80px;left:0;-webkit-text-stroke-color:rgba(120,60,0,.14)}
.s-hours .copy{position:absolute;left:120px;top:250px;width:820px}
.s-hours .h1{font-size:200px;color:#fff;text-shadow:0 1px 0 #b77708,0 2px 0 #b77708,0 3px 0 #b77708,0 4px 0 #b77708,0 5px 0 #b77708,0 6px 0 #b77708,0 7px 0 #b77708,0 8px 0 #b77708,0 22px 30px rgba(120,60,0,.35)}
.s-hours .sub{font-size:56px;margin-top:30px;font-weight:700}
.s-hours .pill{margin-top:40px;font-size:30px;padding:10px 28px 6px}
.discw{position:absolute;right:220px;top:200px;width:640px;height:640px;perspective:1400px}
.disc{position:absolute;inset:0;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;text-align:center;box-shadow:0 0 0 18px #fff,0 40px 60px rgba(100,50,0,.35)}
.on .disc{animation:disc 15s cubic-bezier(.5,0,.3,1) both}
@keyframes disc{0%{transform:rotateY(-180deg) scale(.5)}20%{transform:rotateY(0) scale(1)}55%{transform:rotateY(0) rotateX(12deg)}70%{transform:rotateY(360deg)}100%{transform:rotateY(360deg) rotateX(-8deg)}}
.disc .anton{font-size:190px;color:var(--gold)}
.disc small{display:block;font-size:44px;font-weight:700;margin-top:10px;letter-spacing:.1em;text-transform:uppercase}
.fl{position:absolute;width:150px;filter:drop-shadow(0 14px 14px rgba(100,50,0,.3))}
.on .fl{animation:fl 4s var(--d,0s) ease-in-out infinite alternate}
@keyframes fl{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(-40px) rotate(14deg)}}

/* 10 order online */
.s-order{background:radial-gradient(circle at 70% 50%,#14606e,#0b3a43 60%)}
.s-order .copy{position:absolute;left:120px;top:230px;width:900px}
.s-order .h1{font-size:190px;color:#fff}
.s-order .h1 em{font-style:normal;color:var(--gold)}
.s-order .url{font-size:70px;font-weight:800;color:var(--gold);margin-top:30px}
.s-order .sub{font-size:42px;margin-top:16px;color:#cfe8ec}
.qrw{position:absolute;right:220px;top:200px;width:560px;height:640px;perspective:1400px}
.qr{position:absolute;inset:0;background:#fff;border-radius:44px;padding:50px;color:var(--ink);text-align:center;box-shadow:0 40px 70px rgba(0,0,0,.45)}
.on .qr{animation:qr 15s ease-in-out both}
@keyframes qr{0%{transform:rotateY(100deg) translateZ(-400px)}16%{transform:rotateY(-12deg) rotateX(6deg)}55%{transform:rotateY(10deg) rotateX(-4deg)}100%{transform:rotateY(-8deg) rotateX(5deg)}}
.qr .code{width:460px;height:460px;margin:0 auto;display:grid;place-items:center;font-size:30px;font-weight:700}
.qr .code img,.qr .code canvas{width:460px!important;height:460px!important;image-rendering:pixelated}
.qr p{font-size:40px;font-weight:800;margin-top:18px}
.scan{position:absolute;left:50px;right:50px;top:50px;height:6px;border-radius:3px;background:var(--red);box-shadow:0 0 20px var(--red);opacity:0}
.on .scan{animation:scan 2.4s 1.6s ease-in-out infinite alternate}
@keyframes scan{from{opacity:.8;transform:translateY(0)}to{opacity:.8;transform:translateY(454px)}}

/* 11 play zone (the footer of the site): food tumbles onto "Really cheesy" and keeps getting tossed */
.s-play{background:radial-gradient(70% 80% at 50% 100%,#14606e,#0b3a43 70%)}
.s-play .head{position:absolute;left:0;right:0;top:160px;text-align:center;z-index:2;pointer-events:none}
.s-play .pbig{position:absolute;left:0;right:0;top:430px;text-align:center;font-size:330px;color:#1a93a8;opacity:.95;white-space:nowrap}
.on .pbig span{animation:flipin .9s calc(.2s + var(--i) * .05s) cubic-bezier(.3,1.6,.5,1) both}
.s-play .pbig span{display:inline-block}
.pcv{position:absolute;left:0;top:0;width:1920px;height:1010px;z-index:1}
.s-play .hint{position:absolute;right:140px;top:330px;z-index:2;font-size:44px;color:var(--gold);rotate:-5deg}

/* moving light behind the food, and sparkles that twinkle on it */
.rays{position:absolute;left:var(--rx,50%);top:var(--ry,50%);width:3200px;height:3200px;margin:-1600px 0 0 -1600px;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,255,255,var(--ra,.09)) 0 5deg,transparent 5deg 15deg);
  -webkit-mask-image:radial-gradient(closest-side,#000 10%,transparent 75%);mask-image:radial-gradient(closest-side,#000 10%,transparent 75%);animation:spin 50s linear infinite}
.spk{position:absolute;width:var(--z,46px);height:var(--z,46px);background:#fff;pointer-events:none;z-index:4;
  clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 10px #fff6c8);animation:twinkle 1.8s var(--d,0s) ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(0) rotate(0)}50%{transform:scale(1) rotate(90deg)}}
.bokeh{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%);pointer-events:none;animation:bokeh var(--t,9s) var(--d,0s) ease-in-out infinite alternate}
@keyframes bokeh{to{transform:translate(var(--bx,80px),-120px) scale(1.4)}}
.shine{position:relative;display:inline-block}
.shine::after{content:"";position:absolute;inset:-10% -5%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%) no-repeat;background-size:250% 100%;mix-blend-mode:overlay;animation:shine 3.2s 1.4s ease-in-out infinite;pointer-events:none}
@keyframes shine{from{background-position:150% 0}60%,to{background-position:-60% 0}}

/* spotlight: one item fills the screen */
.s-spot{background:var(--bg)}
.s-spot .copy{position:absolute;left:120px;top:210px;width:860px;z-index:3}
.s-spot .h1{font-size:var(--fs,170px);color:#fff}
.s-spot .desc{font-size:40px;line-height:1.3;margin-top:26px;color:rgba(255,255,255,.9);max-width:760px}
.s-spot .cta{display:inline-flex;align-items:center;gap:14px;margin-top:40px;background:#fff;color:var(--ink);font-size:36px;font-weight:800;padding:14px 36px 8px;border-radius:99px;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.on .cta{animation:rise .9s 1.4s cubic-bezier(.2,.9,.3,1.2) both,pulse 1.6s 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.spotw{position:absolute;right:150px;top:120px;width:800px;height:800px;perspective:1600px;z-index:2}
.spot{position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:0 0 0 16px #fff,0 0 0 30px rgba(255,255,255,.25),0 60px 90px rgba(0,0,0,.45);background:#f5ead3}
.on .spot{animation:spotin 1.4s .2s cubic-bezier(.3,1.3,.5,1) both,spotsway 6s 1.6s ease-in-out infinite alternate}
@keyframes spotin{from{transform:rotateY(200deg) scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes spotsway{from{transform:rotateY(-10deg) rotateX(6deg)}to{transform:rotateY(10deg) rotateX(-5deg)}}
.spot img{width:100%;height:100%;object-fit:cover}
.spot img.png{object-fit:contain;padding:8%}
.on .spot img{animation:kb 15s ease-out both}
@keyframes kb{from{transform:scale(1.35) rotate(-6deg)}to{transform:scale(1.05) rotate(2deg)}}
.star{position:absolute;right:90px;top:640px;width:300px;height:300px;z-index:5;display:grid;place-items:center;color:#3a2800;text-align:center}
.star svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 16px 20px rgba(0,0,0,.35));animation:spin 14s linear infinite}
.star b{position:relative;font-family:Anton,sans-serif;font-weight:400;font-size:78px;line-height:.9}
.star small{display:block;font-size:26px;font-family:'Baloo Bhai 2',sans-serif;font-weight:800;letter-spacing:.08em}
.star{opacity:0}
.on .star{animation:pop .8s 1.5s cubic-bezier(.3,2,.5,1) both,wob 2.4s 2.3s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:scale(0) rotate(-90deg)}to{opacity:1;transform:none}}
@keyframes wob{50%{transform:rotate(-8deg) scale(1.06)}}
.s-spot .steam{opacity:1;z-index:3}
.s-spot .steam i{bottom:auto;top:60px}

/* the cheese curtain that drips down between some slides */
.drip{position:absolute;left:0;top:0;width:1920px;height:1400px;z-index:30;pointer-events:none;transform:translateY(-110%);display:grid;place-items:center}
.drip svg{position:absolute;inset:0;width:100%;height:100%}
.drip img{position:relative;width:340px;margin-top:-200px;filter:drop-shadow(0 20px 30px rgba(120,60,0,.4))}

/* 12 address: the drawn map from the home page, tilting in 3D, with the address and a QR for directions */
.s-address{background:radial-gradient(circle at 70% 50%,#14606e,#0b3a43 65%)}
.s-address .copy{position:absolute;left:110px;top:190px;width:760px;z-index:3}
.s-address .h1{font-size:150px;color:#fff}
.s-address .addr{font-size:46px;font-weight:700;line-height:1.25;margin-top:26px;color:#fff}
.s-address .ph{font-size:40px;font-weight:800;color:var(--gold);margin-top:14px}
.s-address .dir{display:flex;align-items:center;gap:24px;margin-top:34px}
.s-address .mq{width:170px;height:170px;background:#fff;border-radius:18px;padding:12px;display:grid;place-items:center;font-size:14px;color:var(--ink)}
.s-address .mq img,.s-address .mq canvas{width:146px!important;height:146px!important}
.s-address .dir b{font-size:34px;line-height:1.2}
.mapw{position:absolute;right:90px;top:150px;width:960px;height:672px;perspective:1800px;z-index:2}
.mapc{position:absolute;inset:0;border-radius:34px;overflow:hidden;border:14px solid rgba(255,248,236,.3);background:#FFF8EC;box-shadow:0 50px 80px rgba(0,0,0,.45)}
.on .mapc{animation:mapin 1.6s .2s cubic-bezier(.3,1.2,.5,1) both,mapsway 9s 1.8s ease-in-out infinite alternate}
@keyframes mapin{from{opacity:0;transform:rotateX(70deg) translateY(200px) scale(.7)}to{opacity:1;transform:rotateX(18deg)}}
@keyframes mapsway{from{transform:rotateX(18deg) rotateZ(-2deg)}to{transform:rotateX(8deg) rotateZ(2deg) rotateY(-6deg)}}
.mapc>svg{position:absolute;inset:0;width:100%;height:100%}
.mlab{position:absolute;translate:-50% -50%;display:inline-flex;align-items:center;gap:8px;background:#2B9FA8;color:#FFF8EC;font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase;padding:6px 18px 3px;border-radius:999px;white-space:nowrap;box-shadow:0 5px 0 rgba(8,42,49,.25)}
.mlab::before{content:"";width:12px;height:12px;border-radius:50%;background:#F2B632}
.on .mlab{animation:pop .6s calc(1.4s + var(--i) * .15s) cubic-bezier(.3,2,.5,1) both}
.mhere{position:absolute;left:27%;top:36%;rotate:-6deg;background:#F2B632;color:#3a2800;border-radius:16px;padding:8px 22px 10px;box-shadow:0 8px 0 rgba(8,42,49,.2);line-height:1;text-align:center}
.mhere b{display:block;font-family:Courgette,cursive;font-size:48px;font-weight:400}
.mhere small{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:18px}
.mpin{position:absolute;left:53.75%;top:53%;width:15%;translate:-50% -96%;filter:drop-shadow(0 10px 10px rgba(0,0,0,.3))}
.on .mpin{animation:pindrop 1s 1s cubic-bezier(.3,1.6,.5,1) both,pinb 1s 2s ease-in-out infinite alternate}
@keyframes pindrop{from{transform:translateY(-500px);opacity:0}to{transform:none;opacity:1}}
@keyframes pinb{to{transform:translateY(-22px)}}

/* confetti of ingredients that rains between slides */
.rain{position:absolute;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.rain img{position:absolute;top:-200px;width:120px;animation:rain 1.6s cubic-bezier(.4,0,.8,.6) both}
@keyframes rain{to{transform:translateY(1400px) rotate(var(--r,360deg))}}
@media (prefers-reduced-motion:reduce){.on *{animation-duration:.01s!important}}
</style>
</head>
<body>
<div id="stage">
  <div class="deck" id="deck"></div>
  <div class="rain" id="rain"></div>
  <div class="drip" id="drip"></div>
  <div class="brand"><img src="img/logo-stack-light.png" alt="Cheesy Pizza"></div>
  <div class="clock"><span class="pill" id="status">Open now</span><b id="time"></b></div>
  <div class="dots" id="dots"></div>
  <div class="bar" id="bar"></div>
  <div class="ticker"><div class="tk" id="tk"></div></div>
  <div class="tapme" id="tapme">Tap anywhere for full screen</div>
</div>
<script>
'use strict';
const Q=new URLSearchParams(location.search),SPEED=Math.max(.3,+Q.get('sec')||1);
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IMG=n=>/[\/:]/.test(n)?n:'img/'+n+'.jpg';
const ING=['basil','capsicum','corn','olive','onion','tomato-slice','slice-veggie','cheese','garlic-stick'].map(n=>'img/ing/'+n+'.webp');
const hr12=h=>h%12||12,hrText=h=>hr12(h)+' '+(h===12?'noon':h<12||h===24?'am':'pm');
const letters=t=>[...t].map((c,i)=>c===' '?' ':`<span style="--i:${i}">${esc(c)}</span>`).join('');

// Used until the shop's data loads, or if it cannot be reached
const FALLBACK={menu:[
  {id:'p1',cat:'pizza',name:'Margherita',prices:{'7':150,'10':280},img:'margherita',desc:'Tangy tomato sauce under a thick blanket of stretchy mozzarella.'},
  {id:'p2',cat:'pizza',name:'Double Cheese Margherita',prices:{'7':230,'10':380},img:'doublecheese',best:1,desc:'Twice the mozzarella, baked golden.'},
  {id:'p15',cat:'pizza',name:'5 Cheese',prices:{'7':320,'10':490},img:'fivecheese',desc:'Five times cheesy.'},
  {id:'p16',cat:'pizza',name:'Cheesy Special',prices:{'7':320,'10':490},img:'cheesyspecial',best:1,desc:'Masala paneer, olives, jalapeno, corn and three bell peppers.'},
  {id:'p14',cat:'pizza',name:'Kathiyavadi',prices:{'7':300,'10':470},img:'kathiyavadi',desc:'Our Gujarati special. Hot!'},
  {id:'b1',cat:'bread',name:'Cheesy Garlic Bread',price:160,img:'garlicbread',best:1,desc:'6 soft sticks with garlic butter, herbs and melted cheese.'},
  {id:'s1',cat:'pockets',name:'Classic Paneer Pockets',price:170,img:'paneerpockets',best:1,desc:'2 crispy baked pockets stuffed with spiced paneer.'},
  {id:'f1',cat:'fries',name:'Salted Fries',price:100,img:'fries',desc:'Golden crispy fries.'}],
  sizes:[{id:'7',label:'7"'},{id:'10',label:'10"'}],outlets:[],offers:[],combos:[],config:{openHour:12,closeHour:22}};
let D=FALLBACK;

const priceOf=m=>{if(m.prices){const sz=(D.sizes||[]).map(s=>s.id).filter(id=>m.prices[id]!=null);
  return sz.map(id=>`<span>₹${m.prices[id]}<s> ${esc(((D.sizes||[]).find(s=>s.id===id)||{}).label||id+'"')}</s></span>`).join(' ')}
  return m.price!=null?`<span>₹${m.price}</span>`:''};
// Only the photo saved with the item in Admin; an item without one shows the shop badge, never another item's picture
const photo=m=>m.img?IMG(m.img):'img/logo-badge.png';
const sizeLbl=id=>((D.sizes||[]).find(s=>s.id===id)||{}).label||(id+'"');
const isPng=m=>!m.img;
const outlet=()=>{const o=D.outlets||[];return o.find(x=>x.id===Q.get('outlet'))||o[0]||{}};
const hours=()=>{const o=outlet();return[+o.openHour||+D.config.openHour||12,+o.closeHour||+D.config.closeHour||22]};
const live=()=>(D.menu||[]).filter(m=>!m.off);
// The owner's settings from Admin → Shop display, kept on the outlet: timing, slide order and on/off,
// words on each slide, spotlight items, the ticker and their own slides
const CFG=()=>outlet().display||{};
const WORDS=t=>t.split('|').map(l=>l.trim().split(/\s+/).map(w=>`<span style="display:inline-block;white-space:nowrap">${letters(w)}</span>`).join(' ')).join('<br>');
const KK=(k,d)=>{const v=(((CFG().text||{})[k])||{}).kick;return v&&v.trim()?esc(v):d};
const TT=(k,d)=>{const v=(((CFG().text||{})[k])||{}).title;return v&&v.trim()?WORDS(v):d};

/* ---------- slides ---------- */
const SLIDES0=[
 {k:'hero',t:9,make(){return`<div class="rays" style="--rx:1440px;--ry:550px"></div>${bokeh(10)}<div class="glow" style="width:900px;height:900px;right:60px;top:90px;background:#f2b632;opacity:.25"></div>${sparkles(7,1000,1820,140,900)}
   <div class="copy"><div class="kick rise" style="--d:.1s">${KK('hero','Fresh from our oven')}</div><div class="h1 anton shine">${TT('hero',letters('Cheesy'))}</div>
   <div class="sub script rise" style="--d:.9s">Ekdum cheesy pizza!</div>
   <div class="tags rise" style="--d:1.2s"><b>Pizza</b><b>Garlic bread</b><b>Pockets</b><b>Fries</b></div></div>
   <div class="pzw"><div class="pz3"><div class="plate"></div><img src="img/hero-pizza.webp" alt=""></div><div class="orbit">${ING.slice(0,8).map(s=>`<img src="${s}" alt="">`).join('')}</div></div>`},
  tick(el,t){const imgs=el.querySelectorAll('.orbit img'),n=imgs.length,cx=400,cy=400;
   imgs.forEach((im,i)=>{const a=t*.45+i/n*Math.PI*2,x=Math.cos(a)*470,z=Math.sin(a),y=Math.sin(a)*170-40+Math.sin(t*1.3+i)*30,s=.7+(z+1)*.35;
    im.style.transform=`translate(${cx+x-75}px,${cy+y-75}px) scale(${s.toFixed(3)}) rotate(${(a*60+i*40)%360}deg)`;im.style.zIndex=z>0?3:0;im.style.opacity=Math.min(1,t*1.2)})}},
 {k:'pull',t:9,make(){return`<div class="rays" style="--rx:1370px;--ry:560px;--ra:.18"></div><div class="bigword anton">Stretch it</div>${sparkles(5,1100,1800,160,900)}
   <div class="copy"><div class="kick rise" style="--d:.1s;color:#7a4300">${KK('pull','The cheese pull')}</div><div class="h1 anton">${TT('pull',letters('Pull a')+'<br>'+letters('slice!'))}</div>
   <div class="sub script rise" style="--d:1s">Watch that cheese stretch.</div></div>
   <div class="pullw"><div class="pull-stage"><div class="pull-plate"></div><img class="pull-pz" src="img/hero-pizza.webp" alt="">
   <svg class="pull-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><defs><linearGradient id="pullg" x1="0" x2="1"><stop offset="0" stop-color="#e2a93a"/><stop offset=".35" stop-color="#fff0b0"/><stop offset=".65" stop-color="#f7d670"/><stop offset="1" stop-color="#d49a2c"/></linearGradient></defs><g fill="url(#pullg)"></g><g class="pull-hi" fill="none" stroke="#fffbe6" stroke-linecap="round"></g></svg>
   <div class="pull-sl"><img src="img/hero-pizza.webp" alt=""></div><span class="pull-tag">¡Stretchy!</span></div></div>`},
  tick(el,t){const st=el.querySelector('.pull-stage');
   // two pulls per slide: lift for 2.6s, hold, snap, settle
   const c=(t-1.2)%3.9,p=t<1.2?0:Math.min(1,c/3.2);st.style.setProperty('--lift',Math.min(1,Math.max(0,(p-.12)*1.6)).toFixed(3));
   st.style.setProperty('--snap',Math.min(1,Math.max(0,(p-.8)*8)).toFixed(3));st.classList.toggle('up',p>.35&&p<.85);pullDraw(st,p)}},
 {k:'ring',t:13,make(){const it=homeItems();this.items=it;const n=it.length,r=Math.max(520,n*105);this.r=r;
   return`<div class="bigword anton">Ekdum cheesy</div><div class="head"><div class="kick rise" style="--d:.1s">${KK('ring','Our signature six')}</div><div class="h1 anton">${TT('ring',letters('Ekdum cheesy'))}</div></div>
   <div class="ringw"><div class="ring">${it.map((m,i)=>`<div class="card" style="transform:rotateY(${i*360/n}deg) translateZ(${r}px)">${m.best?'<span class="badge">Best seller</span>':''}<div class="ph${isPng(m)?' png':''}" style="background-image:url('${photo(m)}')"></div><div class="tx"><h3>${esc(m.name)}</h3><div class="price">${priceOf(m)}</div></div></div>`).join('')}</div></div>
   <div class="now"></div>`},
  enter(el){this.step=-1},
  tick(el,t){const n=this.items.length;if(!n)return;const s=Math.max(0,Math.floor((t-.8)/((SHOW-2)/n)));if(s===this.step)return;this.step=s;
   const ring=el.querySelector('.ring'),i=s%n;ring.style.transform=`translateZ(${-this.r}px) rotateX(-6deg) rotateY(${-s*360/n}deg)`;
   el.querySelectorAll('.card').forEach((c,j)=>c.classList.toggle('front',j===i));const m=this.items[i];
   el.querySelector('.now').innerHTML=`<span class="nw">${esc(m.desc||m.name)}</span>`}},
 {k:'pizza',t:11,make(){return build('pizza')},tick(el,t){buildTick(el,t,[1.5,3.8,6.1,8.4,10.7])}},
 {k:'garlic',t:11,make(){return build('garlic')},tick(el,t){buildTick(el,t,[1.5,3.8,6.1,8.4,10.7])}},
 {k:'best',t:10,ok:()=>bestItems().length,make(){const b=bestItems();return`<div class="bigword anton">Best sellers</div>
   <div class="head"><div class="kick rise" style="--d:.1s">${KK('best',"Everyone's favourites")}</div><div class="h1 anton">${TT('best',letters('Our best sellers'))}</div></div>
   <div class="grid" style="--n:${b.length}">${b.map((m,i)=>`<div class="bcard" style="--i:${i}"><div class="ph${isPng(m)?' png':''}" style="background-image:url('${photo(m)}')"><span class="rib">Best seller</span></div><div class="tx"><h3>${esc(m.name)}</h3><p>${esc(m.desc||'')}</p><div class="price">${priceOf(m)}</div></div></div>`).join('')}</div>`}},
 {k:'offers',t:10,ok:()=>todayOffers().length,make(){const o=todayOffers(),codes=(D.offers||[]).filter(x=>x.active!==false&&x.type==='code'&&!x.firstOnly&&!x.once).slice(0,2);
   return`<div class="bigword anton">Today only</div><div class="head"><div class="kick rise" style="--d:.1s;color:#ffd76a">${KK('offers',esc(new Date().toLocaleDateString('en-IN',{weekday:'long'}))+' deals')}</div><div class="h1 anton">${TT('offers',letters("Today's offers"))}</div></div>
   <div class="offs">${o.map((x,i)=>`<div class="off" style="--i:${i}"><div class="coin">${x.big}</div>${x.img?`<img class="offimg" src="${x.img}" alt="">`:''}<h3>${esc(x.name)}</h3><p>${esc(x.line)}</p></div>`).join('')}</div>
   ${codes.length?`<div class="codes rise" style="--d:1.6s">Use code ${codes.map(c=>`<b>${esc(c.code)}</b>`).join(' or ')} when you order online</div>`:''}`}},
 {k:'combos',t:10,ok:()=>combos().length,make(){const c=combos(),byId=id=>(D.menu||[]).find(m=>m.id===id)||{};

// The same drawn map as the home page's visit section (same seed, so the same streets)
let VISIT_MAP=null;
function visitMap(){
  if(VISIT_MAP)return VISIT_MAP;
  let seed=11;const rnd=()=>(seed=(seed*1103515245+12345)>>>0)/4294967296,f=n=>n.toFixed(1);
  const W=800,H=560,main=x=>352-x*.12+Math.sin(x/110)*14,canal=x=>178+Math.sin(x/150)*42+x*.05;
  const sides=[[120,-20,90,600],[300,-20,330,600],[520,-20,470,600],[660,120,760,600],[0,250,240,230],[560,470,800,430],[240,560,330,352]];
  const near=(x,y)=>Math.abs(y-main(x))<26||Math.abs(y-canal(x))<22||sides.some(([x1,y1,x2,y2])=>{const t=Math.max(0,Math.min(1,((x-x1)*(x2-x1)+(y-y1)*(y2-y1))/((x2-x1)**2+(y2-y1)**2)));return Math.hypot(x-(x1+t*(x2-x1)),y-(y1+t*(y2-y1)))<18});
  let blocks='';
  for(let y=14;y<H;y+=24)for(let x=10;x<W;x+=26){
    const bx=x+rnd()*8,by=y+rnd()*8,w=10+rnd()*12,h=8+rnd()*10;
    if(rnd()<.18||near(bx+w/2,by+h/2)||Math.hypot(bx-430,by-322)<46)continue;
    blocks+=`<rect x="${f(bx)}" y="${f(by)}" width="${f(w)}" height="${f(h)}" transform="rotate(${f((rnd()-.5)*24)} ${f(bx+w/2)} ${f(by+h/2)})"/>`;
  }
  const path=fn=>{let d='';for(let x=-10;x<=W+10;x+=10)d+=(d?'L':'M')+x+' '+f(fn(x));return d};
  return VISIT_MAP=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="${W}" height="${H}" fill="#FFF8EC"/>
    <path d="${path(canal)}" fill="none" stroke="#2BA3B5" stroke-width="10" stroke-linecap="round"/><path d="${path(canal)}" fill="none" stroke="#9ED8E0" stroke-width="3"/>
    <g fill="#FCE3A6" stroke="#B2533A" stroke-width="1.4">${blocks}</g>
    <g fill="none" stroke="#B2533A" stroke-linecap="round">${sides.map(([a,b,c,d])=>`<path d="M${a} ${b}L${c} ${d}" stroke-width="3"/>`).join('')}</g>
    <path d="${path(main)}" fill="none" stroke="#B2533A" stroke-width="9" stroke-linecap="round"/><path d="${path(main)}" fill="none" stroke="#F2B632" stroke-width="2.2" stroke-dasharray="10 9"/>
    <ellipse cx="430" cy="${f(main(430)+6)}" rx="46" ry="15" fill="none" stroke="#E2432A" stroke-width="3" opacity=".55"/>
  </svg>`;
}

const PULL=[[-1,2.6,.8],[-.82,1.6,1.1],[-.62,3,.7],[-.42,1.8,1.25],[-.22,3.4,.75],[-.04,2,1.1],[.16,3.6,.7],[.36,1.8,1.2],[.56,3,.8],[.74,1.6,1.1],[.9,2.6,.85],[1,1.8,1]];
function pullDraw(el,p){
  const g=el.querySelector('.pull-svg g'),hi=el.querySelector('.pull-hi');if(!g)return;
  const lift=Math.min(1,Math.max(0,(p-.12)*1.6)),snap=Math.min(1,Math.max(0,(p-.8)*8)),tip=50-lift*36,f=n=>n.toFixed(2);
  if(lift<.02){g.innerHTML='';hi.innerHTML='';return}
  let d='',h='';
  PULL.forEach(([u,w,k],i)=>{
    const bx=50+u*6.6,by=50.5-Math.abs(u)*13.5,tx=50+u*4.6,ty=tip-Math.abs(u)*9.5+1;if(by-ty<.5)return;
    const cut=snap*(.35+.3*((i*37)%10)/10),y1=ty+(by-ty)*cut*(i%2?1:0),y2=by-(by-ty)*cut*(i%2?0:1);
    const sw=Math.sin(i*1.7+p*9)*(1.2+lift*2.2),mx=(bx+tx)/2+sw,my=(y1+y2)/2+lift*2,wm=Math.max(.18,w*(1-lift*.82*k))*(1-snap*.5),we=w*1.1;
    const x1=tx+(bx-tx)*((y1-ty)/(by-ty)),x2=tx+(bx-tx)*((y2-ty)/(by-ty));
    d+=`M${f(x1-we/2)} ${f(y1)}Q${f(mx-wm)} ${f(my)} ${f(x2-we/2)} ${f(y2)}L${f(x2+we/2)} ${f(y2)}Q${f(mx+wm)} ${f(my)} ${f(x1+we/2)} ${f(y1)}Z`;
    h+=`<path d="M${f(x1-we*.15)} ${f(y1+.6)}Q${f(mx-wm*.3)} ${f(my)} ${f(x2-we*.15)} ${f(y2-.6)}" stroke-width="${f(Math.max(.08,wm*.35))}" opacity=".7"/>`;
  });
  g.innerHTML=`<path d="${d}" opacity="${f(1-snap*.6)}"/>`;hi.innerHTML=h;hi.style.opacity=1-snap;
}

/* the site's footer play zone, playing on its own: pieces drop in, pile up on "Really cheesy" and get tossed */
const PK={garlic:['garlic-stick',300,.45],slice:['slice-veggie',170,'slice'],slice2:['slice-veggie2',170,'slice'],tomato:['tomato-slice',112,'ball'],cheese:['cheese',96,.12],basil:['basil',90,.3],olive:['olive',58,'ball']};
const PSPR={};for(const[k,[f]]of Object.entries(PK)){const i=new Image();i.src='img/ing/'+f+'.webp';PSPR[k]=i}
const PL={eng:null,bodies:[],next:0,ctx:null};
function playReset(el){if(!window.Matter)return;const{Engine,Bodies,Composite}=Matter,W=1920,H=1010,T=400;
  PL.eng=Engine.create();PL.eng.gravity.y=1.1;PL.bodies=[];PL.next=0;PL.spawned=0;PL.ctx=el.querySelector('.pcv').getContext('2d');
  Composite.add(PL.eng.world,[Bodies.rectangle(W/2,H+T/2,W+2*T,T,{isStatic:true}),Bodies.rectangle(-T/2,H/2-600,T,H+1600,{isStatic:true}),Bodies.rectangle(W+T/2,H/2-600,T,H+1600,{isStatic:true})])}
function playSpawn(kind,x,y){const{Bodies,Composite,Body}=Matter,[,w,shape]=PK[kind],img=PSPR[kind],h=w*(img.naturalWidth?img.naturalHeight/img.naturalWidth:1),o={restitution:.35,friction:.5,frictionAir:.012,density:.0016};let b,dy=0;
  if(shape==='ball')b=Bodies.circle(x,y,Math.min(w,h)/2*.94,o);
  else if(shape==='slice'){b=Bodies.fromVertices(x,y,[[{x:0,y:-h/2},{x:w/2,y:h/2},{x:-w/2,y:h/2}]],o);dy=-h/6}
  else b=Bodies.rectangle(x,y,w*.94,h*.88,{...o,chamfer:{radius:Math.min(w,h)*shape}});
  b.plugin={k:kind,w,h,dy};Body.setAngle(b,Math.random()*6.28);Body.setAngularVelocity(b,(Math.random()-.5)*.2);Composite.add(PL.eng.world,b);PL.bodies.push(b)}
function playStep(el,t){if(!PL.eng||!window.Matter){if(window.Matter&&!PL.eng)playReset(el);return}
  const{Engine,Body}=Matter,kinds=['garlic','garlic','garlic','slice','slice2','tomato','tomato','cheese','basil','olive','olive'];
  // a first wave of 30 pieces, then every second one piece is tossed up and a new one drops in
  while(PL.spawned<30&&t>.6+PL.spawned*.09){playSpawn(kinds[PL.spawned%kinds.length],120+Math.random()*1680,-100-Math.random()*200);PL.spawned++}
  if(t>4&&t>PL.next){PL.next=t+.8+Math.random()*.6;const b=PL.bodies[Math.random()*PL.bodies.length|0];
    if(b){Body.setVelocity(b,{x:(Math.random()-.5)*16,y:-22-Math.random()*10});Body.setAngularVelocity(b,(Math.random()-.5)*.5)}
    if(PL.bodies.length<44)playSpawn(kinds[Math.random()*kinds.length|0],200+Math.random()*1520,-120)}
  Engine.update(PL.eng,1000/60);
  const x=PL.ctx;x.clearRect(0,0,1920,1010);
  PL.bodies.forEach(b=>{const s=PSPR[b.plugin.k];if(!s.naturalWidth)return;const{w,h,dy}=b.plugin;
    x.save();x.translate(b.position.x,b.position.y);x.rotate(b.angle);x.shadowColor='rgba(0,0,0,.4)';x.shadowBlur=18;x.shadowOffsetY=9;x.drawImage(s,-w/2,-h/2+dy,w,h);x.restore()})}

/* ---------- 3D transitions between slides ---------- */
const E='cubic-bezier(.65,0,.35,1)';let DUR=4000,SHOW=15; // set from the owner's settings in rebuild()
const FX=[
 // cube turning left
 [[{transformOrigin:'100% 50%',transform:'translateX(0) rotateY(0)'},{transformOrigin:'100% 50%',transform:'translateX(-100%) rotateY(-90deg)',filter:'brightness(.4)'}],
  [{transformOrigin:'0% 50%',transform:'translateX(100%) rotateY(90deg)',filter:'brightness(.4)'},{transformOrigin:'0% 50%',transform:'translateX(0) rotateY(0)',filter:'brightness(1)'}]],
 // zoom through
 [[{transform:'scale(1)',opacity:1},{transform:'scale(1.8) translateZ(400px)',opacity:0,filter:'blur(12px)'}],
  [{transform:'translateZ(-1800px) rotateX(25deg) rotateZ(-8deg)',opacity:0},{transform:'none',opacity:1}]],
 // cube rolling up
 [[{transformOrigin:'50% 0%',transform:'translateY(0) rotateX(0)'},{transformOrigin:'50% 0%',transform:'translateY(-100%) rotateX(90deg)',filter:'brightness(.4)'}],
  [{transformOrigin:'50% 100%',transform:'translateY(100%) rotateX(-90deg)',filter:'brightness(.4)'},{transformOrigin:'50% 100%',transform:'translateY(0) rotateX(0)',filter:'brightness(1)'}]],
 // door swing
 [[{transformOrigin:'0% 50%',transform:'rotateY(0)'},{transformOrigin:'0% 50%',transform:'rotateY(-100deg)',opacity:0}],
  [{transform:'translateZ(-900px) rotateY(50deg)',opacity:0},{transform:'none',opacity:1}]],
];

const deck=$('#deck'),bar=$('#bar'),dots=$('#dots');
let order=[],idx=-1,leaving=null,leaveAt=0,startAt=0,paused=false,timer=0,fxN=0,needsRebuild=true;

function rebuild(){needsRebuild=false;
  // the slide on screen stays until it has moved away, so a change from Admin never cuts the picture
  const keep=deck.querySelector('.sl.on');deck.innerHTML='';if(keep){deck.appendChild(keep);setTimeout(()=>keep.remove(),12000)}const c=CFG(),hide=c.hide||{},ord=c.order||[];
  SHOW=Math.min(120,Math.max(5,+c.show||15));DUR=Math.min(10,Math.max(.5,+c.change||4))*1000;
  const all=[...SLIDES.filter(s=>s.key!=='address'),...(c.custom||[]).map(customSlide),...SLIDES.filter(s=>s.key==='address')],pos=s=>{const i=ord.indexOf(s.key);return i<0?1000+all.indexOf(s):i};
  order=all.filter(s=>!hide[s.key]&&(!s.ok||s.ok())).sort((a,b)=>pos(a)-pos(b));
  if(!order.length)order=[SLIDES[0]];
  order.forEach(s=>{const el=document.createElement('section');el.className='sl s-'+s.k+(s.k==='pizza'||s.k==='garlic'?' s-build':'')+(s.k==='garlic'?' gb':'')+(s.k==='custom'?' s-spot':'');el.innerHTML=s.make();s.el=el;deck.appendChild(el)});
  document.querySelector('.ticker').style.display=c.ticker===false?'none':'';$('#bar').style.bottom=c.ticker===false?'0':'';
  dots.innerHTML=order.map(()=>'<i></i>').join('');
  const tk=live().map(m=>`<span>${esc(m.name)} <em>₹${m.prices?Math.min(...Object.values(m.prices)):m.price}</em></span>`).join('');
  const msg=c.tickerMsg&&c.tickerMsg.trim()?`<span>★ ${esc(c.tickerMsg.trim())} ★</span>`:'';
  $('#tk').innerHTML=msg+tk+msg+tk;$('#tk').style.setProperty('--tkd',Math.max(40,live().length*4.5)+'s')}

function rain(){const r=$('#rain');r.innerHTML=ING.map(()=>`<img src="${ING[Math.random()*ING.length|0]}" alt="" style="left:${Math.random()*1800}px;animation-delay:${(Math.random()*.4).toFixed(2)}s;--r:${(Math.random()*720-360)|0}deg;width:${80+Math.random()*90|0}px">`).join('');setTimeout(()=>r.innerHTML='',2200)}

function go(n){
  const prev=order[idx],pe=prev&&prev.el; // the element on screen now, even if a rebuild replaces it
  if(needsRebuild){rebuild();n=0;idx=-1}
  else if(n>=order.length||n<0)n=(n+order.length)%order.length;
  const next=order[n];if(!next)return;idx=n;
  const moving=pe&&pe.isConnected&&pe!==next.el;
  const curtain=fxN%3===2&&moving,fx=FX[fxN++%FX.length],opt={duration:DUR,easing:E,fill:'none'};
  if(curtain){ // cheese drips down over the screen, the slide changes behind it, and it slides away
    leaving=prev;leaveAt=startAt;drip();setTimeout(()=>{if(pe!==next.el)pe.classList.remove('on');if(leaving===prev)leaving=null;show(next,n,null)},DUR*.49);startAt=performance.now()+DUR*.49;return}
  if(moving){leaving=prev;leaveAt=startAt;pe.classList.add('out');
    pe.animate(fx[0],opt).onfinish=()=>{pe.classList.remove('out');if(order[idx].el!==pe)pe.classList.remove('on');if(leaving===prev)leaving=null}}
  show(next,n,fx[1])}
function show(next,n,fxIn){const opt={duration:DUR,easing:E,fill:'none'};
  const el=next.el;el._s=null;el.classList.remove('on');void el.offsetWidth;el.classList.add('on');
  // clear what the last pass built so it plays again from the start
  el.querySelectorAll('.go,.fade,.front').forEach(x=>x.classList.remove('go','fade','front'));
  if(fxIn)el.animate(fxIn,opt);if(next.enter)next.enter(el);
  if(fxN%3===0)rain();
  dots.querySelectorAll('i').forEach((d,i)=>d.classList.toggle('on',i===n));
  startAt=performance.now()}

function drip(){const d=$('#drip');
  if(!d.firstChild){let p='M0 0H1920V1080';for(let x=1920;x>0;){const w=60+Math.random()*120,l=40+Math.random()*(Math.random()<.3?260:90);p+=`C${x-w*.15} 1080 ${x-w*.2} ${1080+l} ${x-w/2} ${1080+l}C${x-w*.8} ${1080+l} ${x-w*.85} 1080 ${x-w} 1080`;x-=w}
    d.innerHTML=`<svg viewBox="0 0 1920 1400" preserveAspectRatio="none"><defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd76a"/><stop offset=".8" stop-color="#f2b632"/><stop offset="1" stop-color="#e09a18"/></linearGradient></defs><path d="${p}V0Z" fill="url(#dg)"/></svg><img src="img/logo-badge.png" alt="">`}
  const ez='cubic-bezier(.65,0,.35,1)';d.animate([{transform:'translateY(-110%)',easing:ez},{transform:'translateY(-14%)',offset:.42},{transform:'translateY(-14%)',offset:.56,easing:ez},{transform:'translateY(110%)'}],{duration:DUR})}

function loop(now){requestAnimationFrame(loop);const s=order[idx];if(!s)return;
  if(paused){startAt+=now-(loop.last||now)}loop.last=now;
  const t=(now-startAt)/1000/SPEED,dur=SHOW;
  bar.style.width=Math.min(100,t/dur*100).toFixed(2)+'%';
  if(s.tick)s.tick(s.el,t);
  // the slide that is leaving keeps moving until it is out of sight, so nothing freezes mid-turn
  if(leaving&&leaving!==s&&leaving.tick)leaving.tick(leaving.el,(now-leaveAt)/1000/SPEED);
  if(t>=dur&&!paused)go(idx+1)}

function clock(){const n=new Date();$('#time').textContent=n.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
  const s=openState(),p=$('#status');p.className='pill'+(s.open?'':' shut');p.textContent=s.open?'Open now':'Closed'}

function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('#stage').style.transform=`scale(${s})`}

async function load(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json(),st=j.state||j;
  if(st&&Array.isArray(st.menu)&&st.menu.length){const sig=JSON.stringify([st.menu,st.sizes,st.offers,st.combos,st.outlets,st.config]);
    if(sig!==load.sig){load.sig=sig;D={...FALLBACK,...st,config:{...FALLBACK.config,...(st.config||{})}};needsRebuild=true}}}catch(e){}}
async function poll(){try{const r=await fetch('/api/version',{cache:'no-store'});const v=(await r.json()).version;if(v!==poll.v){poll.v=v;await load()}}catch(e){}}

addEventListener('resize',fit);fit();
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(idx+1);else if(e.key==='ArrowLeft')go(idx-1);else if(e.key===' '){paused=!paused;e.preventDefault()}else if(e.key==='f')full()});
function full(){const d=document.documentElement;if(!document.fullscreenElement&&d.requestFullscreen)d.requestFullscreen().catch(()=>{});wake()}
addEventListener('click',()=>{full();$('#tapme').style.opacity=0});
setTimeout(()=>$('#tapme').style.opacity=0,6000);
let idleT;addEventListener('mousemove',()=>{document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),2500)});
async function wake(){try{if(navigator.wakeLock&&!wake.l)wake.l=await navigator.wakeLock.request('screen'),wake.l.addEventListener('release',()=>wake.l=null)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});

(async()=>{rebuild();clock();setInterval(clock,15000);await Promise.race([load(),new Promise(r=>setTimeout(r,2500))]);
  if(needsRebuild)rebuild();go(0);requestAnimationFrame(loop);wake();
  setInterval(poll,30000)})();
</script>
</body>
