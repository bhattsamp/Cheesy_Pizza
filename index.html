<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cheesy Pizza POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;600;700;800&family=Hind+Vadodara:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#eef6f7; --surface:#ffffff; --surface2:#e3f0f2; --ink:#0f2e36; --muted:#56727a; --line:#d3e4e7;
  --teal:#1a93a8; --teal-deep:#0f6f80; --teal-ink:#ffffff; --teal-soft:#d6eef2; --cheese:#f2b632; --cheese-soft:#fdf1d3; --cheese-ink:#5a3d00;
  --ok:#1f8a4c; --ok-soft:#dcf2e4; --warn:#b76a00; --warn-soft:#fdeccd; --bad:#d23f35; --bad-soft:#fbe0dd; --plum:#6b4fd0; --plum-soft:#e9e4fb;
  --map:#e8f1ee; --road:#ffffff; --shadow:0 1px 2px rgba(15,46,54,.06),0 8px 24px rgba(15,46,54,.08); --shadow-lg:0 18px 50px rgba(15,46,54,.18);
  --r:16px; --display:"Baloo Bhai 2","Trebuchet MS",system-ui,sans-serif; --body:"Hind Vadodara","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0a171b;--surface:#11242a;--surface2:#173038;--ink:#e2f0f2;--muted:#8fb0b7;--line:#234048;
  --teal:#3cbad0;--teal-deep:#1f8ea2;--teal-ink:#06262d;--teal-soft:#153e48;--cheese:#f5c24f;--cheese-soft:#3b2f12;--cheese-ink:#f9dd9b;
  --ok:#52c985;--ok-soft:#153a27;--warn:#f0a940;--warn-soft:#3d2d11;--bad:#f07a70;--bad-soft:#44201d;--plum:#a592f5;--plum-soft:#2a2350;
  --map:#15292d;--road:#23424a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);--shadow-lg:0 18px 50px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0a171b;--surface:#11242a;--surface2:#173038;--ink:#e2f0f2;--muted:#8fb0b7;--line:#234048;
  --teal:#3cbad0;--teal-deep:#1f8ea2;--teal-ink:#06262d;--teal-soft:#153e48;--cheese:#f5c24f;--cheese-soft:#3b2f12;--cheese-ink:#f9dd9b;
  --ok:#52c985;--ok-soft:#153a27;--warn:#f0a940;--warn-soft:#3d2d11;--bad:#f07a70;--bad-soft:#44201d;--plum:#a592f5;--plum-soft:#2a2350;
  --map:#15292d;--road:#23424a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);--shadow-lg:0 18px 50px rgba(0,0,0,.5);}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
s{color:var(--muted);font-weight:500}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.pin{width:34px;height:34px;flex:none}
.brand b{font-family:var(--display);font-weight:800;font-size:21px;color:var(--teal);letter-spacing:.02em;line-height:1}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink)}
select.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;max-width:220px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .1s}
.btn:hover{border-color:var(--teal)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.chz{background:var(--cheese);border-color:var(--cheese);color:#3a2800}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.bad{color:var(--bad);border-color:var(--bad-soft)}
.btn.bad.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.lg{padding:12px 20px;font-size:16px;border-radius:12px}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%}
.inp:focus{border-color:var(--teal);outline:none}
textarea.inp{resize:vertical}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.placed{background:var(--plum-soft);color:var(--plum)}
.chip.preparing{background:var(--warn-soft);color:var(--warn)}
.chip.ready{background:var(--ok-soft);color:var(--ok)}
.chip.out{background:var(--teal-soft);color:var(--teal)}
.chip.done{background:var(--surface2);color:var(--muted)}
.chip.cancelled{background:var(--bad-soft);color:var(--bad)}
.chip.t{background:var(--teal-soft);color:var(--teal)}
.chip.c{background:var(--cheese-soft);color:var(--cheese-ink)}
.chip.r{background:var(--bad-soft);color:var(--bad)}
.veg{width:14px;height:14px;border:1.5px solid var(--ok);border-radius:3px;display:inline-grid;place-items:center;flex:none}
.veg::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.jain{font-size:10px;font-weight:700;color:var(--ok);border:1px solid var(--ok);border-radius:4px;padding:0 4px;line-height:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.grp-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.ticker{background:var(--ink);color:var(--bg);overflow:hidden;white-space:nowrap;font-weight:600;font-size:13px}
.ticker .tk{display:inline-flex;gap:36px;padding:8px 0;animation:tick 40s linear infinite;padding-left:100%}
.ticker .tk span b{color:var(--cheese)}
@keyframes tick{to{transform:translateX(-100%)}}
.pub{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
.hero{position:relative;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;padding:36px 32px;margin-top:18px;border-radius:28px;overflow:hidden;
  background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--teal) 22%,transparent) 1.2px,transparent 1.4px) 0 0/18px 18px,linear-gradient(135deg,var(--teal-soft),var(--surface) 70%);border:1px solid var(--line)}
.hero h1{font-size:clamp(38px,6.4vw,66px);font-weight:800;letter-spacing:-.015em}
.hero h1 .sw{position:relative;color:var(--teal);white-space:nowrap}
.hero h1 .sw svg{position:absolute;left:0;right:0;bottom:-.08em;width:100%;height:.28em}
.hero p{max-width:50ch;color:var(--muted);margin:14px 0 0;font-size:16px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:var(--display);font-size:24px;font-weight:800;line-height:1}
.facts span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hero-art{position:relative;justify-self:center;width:min(400px,84vw);aspect-ratio:1;max-width:100%}
.hero-art .p1{position:absolute;left:0;top:0;border-radius:50%;object-fit:cover;width:92%;height:92%;box-shadow:var(--shadow-lg);border:8px solid var(--surface)}
.hero-art .p2{position:absolute;right:0;bottom:0;width:40%;height:40%;border-radius:50%;object-fit:cover;border:6px solid var(--surface);box-shadow:var(--shadow-lg)}
.sticker{position:absolute;left:-4%;bottom:14%;background:var(--cheese);color:#3a2800;border-radius:16px;padding:8px 14px;transform:rotate(-5deg);box-shadow:var(--shadow);max-width:60%}
.sticker b{font-family:var(--display);font-size:22px;font-weight:800;display:block;line-height:1}
.sticker small{font-size:12px;font-weight:600}
.outlet-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;margin-block:16px 8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 4px var(--ok-soft)}
.dot.off{background:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:30px 0 14px;flex-wrap:wrap}
.sec-h h2{font-size:30px;font-weight:800}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,320px);gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.hscroll>*{scroll-snap-align:start}
.coupon{position:relative;display:grid;grid-template-columns:96px 1fr;border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden;min-height:118px}
.coupon .stub{display:grid;place-items:center;text-align:center;color:#fff;font-family:var(--display);font-weight:800;font-size:28px;line-height:.95;padding:8px;border-right:2px dashed rgba(255,255,255,.55)}
.coupon .stub small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em}
.coupon.k-day .stub{background:var(--teal)} .coupon.k-bogo .stub{background:var(--bad)} .coupon.k-item .stub{background:var(--cheese);color:#3a2800;border-color:rgba(0,0,0,.2)} .coupon.k-combo .stub{background:var(--plum)}
.coupon .ct{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.coupon .ct b{font-family:var(--display);font-size:18px;line-height:1.15}
.coupon .ct span{font-size:13px;color:var(--muted)}
.coupon .when{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.coupon.off{opacity:.55}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);background:var(--bg);z-index:5;padding-block:10px}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:600;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.item{display:flex;flex-direction:column;overflow:hidden;transition:transform .18s,box-shadow .18s}
.item:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.item .ph{aspect-ratio:4/3;background:var(--surface2);position:relative;overflow:hidden}
.item .ph img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.item:hover .ph img{transform:scale(1.04)}
.pz{position:absolute;inset:14% 24%;border-radius:50%;background:radial-gradient(circle at 35% 40%,#e0452f 0 5%,transparent 6%),radial-gradient(circle at 62% 58%,#3f9b3a 0 5%,transparent 6%),radial-gradient(circle at 58% 30%,#f4c542 0 4%,transparent 5%),radial-gradient(circle at 38% 68%,#f4c542 0 4%,transparent 5%),radial-gradient(circle at 70% 38%,#7a3a1a 0 3%,transparent 4%),radial-gradient(circle,#f6d27a 0 68%,#d8913e 70% 100%);box-shadow:0 10px 24px rgba(0,0,0,.2)}
.pz.side{inset:24% 20%;border-radius:40% 40% 18px 18px;background:linear-gradient(160deg,#e8a24c,#c9722d)}
.pz.dessert{inset:24% 30%;border-radius:50% 50% 20px 20px;background:radial-gradient(circle at 50% 30%,#5a2b12 0 30%,#3a1a08 32% 100%)}
.pz.dip{inset:30% 32%;border-radius:10px 10px 40% 40%;background:linear-gradient(#f7d77a,#e9b44a)}
.ribbon{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.ribbon span{background:var(--bad);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 8px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ribbon span.o{background:var(--cheese);color:#3a2800}
.item .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.item h3{font-size:19px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .desc{font-size:13px;color:var(--muted);flex:1}
.item .ft{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:4px}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.sizes span{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:1px 7px;font-weight:600}
.sizes span b{font-family:var(--display);font-size:15px}
.price{font-family:var(--display);font-weight:800;font-size:19px}
.combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:16px}
.combo-card{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px;align-items:center}
.stack{display:flex}
.stack img,.stack .pzs{width:54px;height:54px;border-radius:50%;object-fit:cover;border:3px solid var(--surface);margin-left:-18px;box-shadow:var(--shadow);background:linear-gradient(160deg,#e8a24c,#c9722d);position:relative}
.stack>:first-child{margin-left:0}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.cartbar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.notice{background:var(--cheese-soft);color:var(--cheese-ink);border-radius:12px;padding:10px 14px;font-size:13px}
.savings{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}
.hint{background:var(--plum-soft);color:var(--plum);border-radius:12px;padding:8px 12px;font-weight:600;font-size:13px}

.track{display:flex;flex-direction:column;gap:14px}
.track-top{background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff;border-radius:18px;padding:16px 18px;display:flex;gap:12px;align-items:center}
.track-top h4{font-size:22px;font-weight:800}
.track-top .eta{margin-left:auto;text-align:center;background:rgba(255,255,255,.16);border-radius:14px;padding:6px 12px}
.track-top .eta b{display:block;font-family:var(--display);font-size:28px;line-height:1}
.map{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--map)}
.map svg{display:block;width:100%;height:auto}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding-bottom:14px;position:relative;color:var(--muted)}
.tl li::before{content:"";position:absolute;left:11px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-style:normal;font-size:12px;position:relative;z-index:1}
.tl li.on{color:var(--ink)}
.tl li.on i{background:var(--ok);border-color:var(--ok);color:#fff}
.tl li.on::before{background:var(--ok)}
.tl li.now i{box-shadow:0 0 0 5px var(--ok-soft);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px transparent}}
.tl li b{font-weight:700}
.rider{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface2)}
.rider .av{width:44px;height:44px;border-radius:50%;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}

.pos{display:grid;grid-template-columns:210px 1fr;max-width:1400px;margin:0 auto;min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.side button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted)}
.side button svg{width:18px;height:18px;flex:none}
.side button[aria-current="page"]{background:var(--teal-soft);color:var(--teal)}
.side .cnt,.mobnav .cnt{margin-left:auto;background:var(--warn);color:#fff;border-radius:999px;font-size:11px;padding:0 7px}
.main{padding:16px;min-width:0;padding-bottom:96px}
.ph1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph1 h2{font-size:28px;font-weight:800;margin-right:auto}
.neworder{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.neworder>*{min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:80px;position:relative}
.tile:hover{border-color:var(--teal)}
.tile b{font-weight:600;font-size:14px;line-height:1.25;padding-right:10px}
.tile .num{color:var(--muted);font-size:12px;margin-top:auto}
.tile .tg{position:absolute;right:8px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.tile:disabled{opacity:.4}
.ticket{position:sticky;top:76px;display:flex;flex-direction:column;max-height:calc(100vh - 96px)}
.ticket .hd{padding:14px;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.ticket .lines{overflow:auto;padding:6px 14px;flex:1;min-height:80px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .nm{font-weight:600}
.line .ad{font-size:12px;color:var(--muted);grid-column:1}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--surface2);width:28px;height:28px;font-weight:700}
.qty span{min-width:28px;text-align:center}
.lp{border:1px dashed transparent;background:transparent;font-weight:700;padding:2px 4px;border-radius:6px}
.lp:hover{border-color:var(--line)}
.lp-in{width:84px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;text-align:right;background:var(--surface)}
.lp-in:focus{border-color:var(--teal);outline:none}
.ticket .ft{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.bl{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bl.disc{color:var(--ok);font-weight:600}
.tot{display:flex;justify-content:space-between;font-family:var(--display);font-size:24px;font-weight:800}
.custbox{background:var(--teal-soft);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.custbox.due{background:var(--bad-soft)}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.types button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 2px;font-size:13px;font-weight:600}
.types button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}

<script>
const IMG=n=>'img/'+n+'.jpg';
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* Lookup lists and settings come from the database (see applyConfig) */
let CATS=[],GU={},TYPES={},PAY={},PAYCOL={},COOK=[],ORDER_CHIPS=[],SEGS=[];
let PREP_MIN=15,RIDE_MIN=20,COIN_RATE=0.05,OPEN_H=12,CLOSE_H=22;
function applyConfig(c){
  CATS=c.categories.map(x=>[x.id,x.label]);GU=Object.fromEntries(c.categories.map(x=>[x.id,x.labelGu||'']));
  TYPES=Object.fromEntries(c.orderTypes.map(x=>[x.id,x.label]));
  PAY=Object.fromEntries(c.payModes.map(x=>[x.id,x.label]));PAYCOL=Object.fromEntries(c.payModes.map(x=>[x.id,x.color]));
  COOK=c.cookNotes||[];ORDER_CHIPS=c.orderChips||[];SEGS=c.wheel||[];
  PREP_MIN=c.prepMin??15;RIDE_MIN=c.rideMin??20;COIN_RATE=c.coinRate??0.05;OPEN_H=c.openHour??12;CLOSE_H=c.closeHour??22;
}
const hr12=h=>((h+11)%12)+1;
const hoursText=()=>hr12(OPEN_H)+'–'+hr12(CLOSE_H);
const noteText=l=>[...(l.notes||[]),l.note].filter(Boolean).join(' · ');

/* ===== DATA: saved in the server's database ===== */
// Shared data lives on the server. This device only remembers its outlet,
// site mode and who is signed in.
const LKEY='cheesy_local_v1';
const LOCAL_KEYS=['cur','mode','me','staffId'];
const SYNCED=['sizes','outlets','menu','addons','offers','combos','users','customers','orders'];
const MAPS={addons:1,customers:1};
let S,VER=0,SNAP={},pendingFlush=null,inFlight=0,syncQ=Promise.resolve();
const today=(d=new Date())=>d.toLocaleDateString('en-CA');
function addDays(ds,n){const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return today(d)}
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function api(url,body){
  const r=await fetch(url,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:typeof body==='string'?body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'HTTP '+r.status);return j;
}
const entries=n=>{const c=S[n]||(MAPS[n]?{}:[]);return MAPS[n]?Object.entries(c):c.map(o=>[o.id,o])};
function snapshot(){SNAP={};SYNCED.forEach(n=>{SNAP[n]=new Map(entries(n).map(([k,o])=>[k,JSON.stringify(o)]))})}
function applyState(d){
  const local=Object.fromEntries(LOCAL_KEYS.map(k=>[k,S?S[k]:null]));
  S={...d.state,...local};VER=d.version;applyConfig(S.config);snapshot();
}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(Object.fromEntries(LOCAL_KEYS.map(k=>[k,S[k]]))))}catch(e){}}
// A new PIN is sent to the server once, which stores only its hash
function setPin(o,pin){o.pin=true;o._newPin=pin}
function save(){saveLocal();if(!pendingFlush)pendingFlush=setTimeout(flush,0)}
// Send only the records that changed since the last save
function diff(){
  const up={},del={};let any=false;
  SYNCED.forEach(n=>{
    const seen=new Set(),ch=[];
    entries(n).forEach(([k,o])=>{seen.add(k);const j=JSON.stringify(o);if(SNAP[n].get(k)!==j){ch.push([k,JSON.parse(j)]);if(o._newPin)delete o._newPin;SNAP[n].set(k,JSON.stringify(o))}});
    const gone=[...SNAP[n].keys()].filter(k=>!seen.has(k));gone.forEach(k=>SNAP[n].delete(k));
    if(ch.length){up[n]=MAPS[n]?Object.fromEntries(ch):ch.map(x=>x[1]);any=true}
    if(gone.length){del[n]=gone;any=true}
  });
  return any?{upsert:up,delete:del}:null;
}
function flush(){
  pendingFlush=null;const ch=diff();if(!ch)return syncQ;inFlight++;
  syncQ=syncQ.then(()=>api('/api/sync',ch)).then(onSynced,e=>{
    // Mark the records as unsaved so the next save sends them again
    console.error(e);Object.entries(ch.upsert).forEach(([n,v])=>(Array.isArray(v)?v.map(o=>o.id):Object.keys(v)).forEach(k=>SNAP[n].delete(k)));
    Object.entries(ch.delete).forEach(([n,ks])=>ks.forEach(k=>SNAP[n].set(k,'')));
    toast('Not saved: server unreachable. Retrying…');setTimeout(save,4000);
  }).finally(()=>inFlight--);
  return syncQ;
}
function onSynced(r){
  if(r.prev!==VER)VER=-1;else VER=r.version; // someone else saved too: refresh on the next poll
  S.seq=r.seq;
  const ren=Object.entries(r.renumbered||{});
  ren.forEach(([id,no])=>{const o=S.orders.find(x=>x.id===id);if(o){o.no=no;SNAP.orders.set(id,JSON.stringify(o))}});
  if(ren.length&&!mroot.innerHTML&&!isBusy())render();
}
// Pull other devices' changes; skipped while this device has unsaved edits
async function refresh(){
  if(pendingFlush||inFlight)return false;
  const v=await api('/api/version');if(v.version===VER)return false;
  const d=await api('/api/state');if(pendingFlush||inFlight)return false;
  applyState(d);migrate();return true;
}
// Demo orders for the last 3 days, made once when the database is new
function seedDemoOrders(){
  const s=S;
  const names=[['Ravi Patel','9825011111'],['Nidhi Shah','9898022222'],['Kunal Mehta','9909033333'],['Pooja Joshi','9727044444'],['Harsh Desai','9638055555'],['Meera Trivedi','9016066666']];
  const modes=['cash','cash','upi','upi','upi','card','zomato'];
  [[-2,8],[-1,11],[0,10]].forEach(([off,n])=>{
    const date=addDays(today(),off);
    ['o1','o2'].forEach((oid,oi)=>{
      const cnt=oi?Math.ceil(n/2):n;
      for(let i=0;i<cnt;i++){
        const c=names[(i+oi*2)%names.length];const mode=modes[(i*3+oi+off+7)%modes.length];
        const type=mode==='zomato'?'zomato':['takeaway','dine','delivery','takeaway'][i%4];
        const pz=s.menu.filter(m=>m.cat==='pizza')[(i*5+off+19)%16];
        const items=[mkLine(pz,i%2?'10':'7',i%3===0?['burst']:[],1)];
        if(i%2)items.push(mkLine(s.menu.find(m=>m.id===['b2','f2','s1','d1'][i%4]),null,[],1));
        const h=12+Math.floor(i*9/cnt);let ts=new Date(date+'T'+String(h).padStart(2,'0')+':'+String((i*17)%60).padStart(2,'0')+':00').getTime();if(ts>Date.now()-30*60e3)ts=Date.now()-(cnt-i+2)*9*60e3;
        const o=newOrder({outletId:oid,date,type,ts,customer:{name:c[0],phone:c[1]},items,source:i%4===1?'online':'pos'});
        o.pay={mode:i===5&&off===0&&oi===0?'due':mode,given:0,change:0};o.paid=o.pay.mode!=='due';
        let st='done';
        if(off===0&&oi===0){if(i===cnt-1)st='placed';else if(i>=cnt-3)st='preparing';else if(i===cnt-4)st='ready';else if(i===cnt-5){st='out';o.type='delivery';o.address='12, Shanti Nagar';o.rider=s.outlets[0].riders[0]}}
        if(st==='placed'){o.source='online';if(o.type==='zomato'){o.type='delivery';o.address='B-4, Green Park'}if(o.type==='delivery'&&!o.address)o.address='B-4, Green Park'}
        if(o.type==='delivery'&&!o.address)o.address='Near City Mall';if(o.type==='dine')o.table=String((i%8)+1);
        if(off===-1&&i===4)st='cancelled';
        o.status=st;o.times={placed:ts,preparing:ts+60e3};
        if(['ready','out','done'].includes(st))o.times.ready=ts+14*60e3;
        if(st==='out')o.times.out=Date.now()-6*60e3;
        if(st==='done'){o.times.done=ts+25*60e3;if(i%3)o.rating=[5,4,5,3,5][i%5]}
        if(off===0&&oi===0&&['preparing','placed','ready','out'].includes(st)){const N=Date.now();o.ts=st==='out'?N-26*60e3:st==='ready'?N-16*60e3:N-(cnt-i)*4*60e3;o.times.placed=o.ts;o.times.preparing=st==='placed'?undefined:o.ts+60e3;if(st==='ready')o.times.ready=N-60e3;if(st==='out'){o.times.ready=N-8*60e3;o.times.out=N-6*60e3}}
        commitOrder(o);
      }
    });
  });
  save();
}
function itemPrice(item,size){return item.cat==='pizza'?(+item.prices[size]||0):item.price}
function price(item,size,addons){let p=itemPrice(item,size);(addons||[]).forEach(a=>{p+=+(S.addons[a].prices[size]||0)});return p}
function mkLine(item,size,addons,qty){return {itemId:item.id,cat:item.cat,name:item.name,size:item.cat==='pizza'?size:null,addons:addons||[],qty:qty||1,unit:price(item,size,addons),custom:false}}
function newOrder(p){return Object.assign({id:uid('ord'),no:'',ts:Date.now(),date:today(),status:'preparing',source:'pos',type:'takeaway',table:'',address:'',pay:{mode:'cash',given:0,change:0},paid:true,times:{}},p)}
const sizeLabel=id=>(S.sizes.find(s=>s.id===id)||{label:id+'"'}).label;
const menuItem=id=>S.menu.find(m=>m.id===id);

/* ===== OFFERS ENGINE ===== */
function dayOK(o,dow){return !o.days||!o.days.length||o.days.includes(dow)}
function activeOffers(dow){return S.offers.filter(o=>o.active&&dayOK(o,dow))}
function computeBill(items,dateStr,extra){
  extra=extra||{};
  const dow=new Date((dateStr||today())+'T12:00:00').getDay();
  const act=activeOffers(dow);const L=items.map(l=>({l,base:l.unit*l.qty,flag:!!(l.combo||l.custom)}));
  const subtotal=L.reduce((s,x)=>s+x.base,0);const disc=[];
  act.filter(o=>o.type==='item').forEach(o=>{
    let amt=0;L.forEach(x=>{if(x.flag||x.l.itemId!==o.itemId)return;if(o.size!=='any'&&o.size!==x.l.size)return;
      const m=menuItem(o.itemId);if(!m)return;const pz=itemPrice(m,x.l.size);
      const cut=o.kind==='pct'?pz*o.value/100:Math.max(0,pz-o.value);amt+=cut*x.l.qty;x.flag=true});
    if(amt>0)disc.push({name:o.name,amt:Math.round(amt)});
  });
  const cands=[];let hint=null;
  act.filter(o=>o.type==='bogo').forEach(o=>{
    const units=[];L.forEach(x=>{if(x.flag||x.l.cat!=='pizza')return;if(o.size!=='any'&&o.size!==x.l.size)return;for(let i=0;i<x.l.qty;i++)units.push(x.l.unit)});
    units.sort((a,b)=>b-a);let amt=0;for(let i=1;i<units.length;i+=2)amt+=units[i];
    if(amt>0)cands.push({name:o.name,amt});
    else if(units.length===1)hint=hint||`Add one more ${o.size==='any'?'':sizeLabel(o.size)+' '}pizza and get it free (${o.name})`;
  });
  act.filter(o=>o.type==='day').forEach(o=>{
    const elig=L.filter(x=>!x.flag&&(o.scope==='all'||x.l.cat==='pizza')).reduce((s,x)=>s+x.base,0);
    if(subtotal>=(o.min||0)){if(elig>0)cands.push({name:o.name+' '+o.pct+'%',amt:Math.round(elig*o.pct/100)})}
    else if(subtotal>0)hint=hint||`Add ${rs(o.min-subtotal)} more to get ${o.pct}% off (${o.name})`;
  });
  if(cands.length){cands.sort((a,b)=>b.amt-a.amt);disc.push(cands[0])}
  let discount=disc.reduce((s,d)=>s+d.amt,0);
  let codeMsg=null,codeOk=false;
  const code=(extra.code||'').trim().toUpperCase();
  if(code){
    const cd=findCode(code,extra.phone);
    if(!cd||!cd.active)codeMsg='This code is not valid.';
    else if(codeBlock(cd,extra.phone))codeMsg=codeBlock(cd,extra.phone);
    else if(!dayOK(cd,dow))codeMsg=`${cd.code} works on ${daysText(cd.days)} only.`;
    else if(subtotal<(cd.min||0))codeMsg=`Add ${rs(cd.min-subtotal)} more to use ${cd.code}.`;
    else{const left=subtotal-discount;let a=cd.kind==='pct'?Math.round(left*cd.value/100):+cd.value;if(cd.kind==='pct'&&cd.cap)a=Math.min(a,cd.cap);a=Math.max(0,Math.min(a,left));
      if(a>0){disc.push({name:'Code '+cd.code,amt:a});discount+=a;codeOk=true;codeMsg=`${cd.code} applied · you save ${rs(a)}`}}
  }
  const coinsMax=Math.floor(Math.max(0,subtotal-discount)*0.2);let coinsUsed=0;
  if(extra.coins>0){coinsUsed=Math.min(Math.floor(extra.coins),coinsMax);if(coinsUsed>0){disc.push({name:`Cheese Coins (${coinsUsed})`,amt:coinsUsed});discount+=coinsUsed}}
  const comboSave=items.filter(l=>l.combo).reduce((s,l)=>s+Math.max(0,(l.worth||0)-l.unit)*l.qty,0);
  const total=Math.max(0,subtotal-discount);
  return {subtotal,discounts:disc,discount,total,hint,saved:discount+comboSave,codeMsg,codeOk,coinsUsed,coinsMax,earn:Math.floor(total*COIN_RATE)};
}
const coinsOf=ph=>Math.floor(S.customers[ph]?.coins||0);
function dripPath(){let d='M0 0H1200V16',x=1200,i=0;while(x>0){const w=38+((i*37)%46),dep=18+((i*53)%26);d+=` C${x-w*.2} 16 ${x-w*.22} ${dep} ${x-w/2} ${dep} S${x-w*.8} 16 ${x-w} 16`;x-=w;i++}return d+' V0Z'}
function pizzaViz(m,size,addons){
  const idx=Math.max(0,S.sizes.findIndex(s=>s.id===size)),n=S.sizes.length;
  const r=Math.round(60+(n>1?idx/(n-1):1)*32);const burst=addons.includes('burst'),ch=addons.includes('cheese'),veg=addons.includes('veg');
  const pcs=(S.sizes.find(s=>s.id===size)||{}).pcs||6;
  let dots='',chz='',sl='';
  if(ch)for(let i=0;i<14;i++){const a=i*2.1,rr=(r-14)*Math.sqrt(((i*41)%100)/100);chz+=`<ellipse cx="${(100+rr*Math.cos(a)).toFixed(1)}" cy="${(100+rr*Math.sin(a)).toFixed(1)}" rx="11" ry="7" fill="#fff4cc" opacity=".92" transform="rotate(${i*29} ${(100+rr*Math.cos(a)).toFixed(1)} ${(100+rr*Math.sin(a)).toFixed(1)})"/>`}
  if(veg)for(let i=0;i<22;i++){const a=i*2.4+1,rr=(r-14)*Math.sqrt(((i*37+11)%100)/100);dots+=`<rect x="${(97+rr*Math.cos(a)).toFixed(1)}" y="${(97+rr*Math.sin(a)).toFixed(1)}" width="7" height="5" rx="2" fill="${['#3f9b3a','#e0452f','#f4c542','#7a3a1a'][i%4]}" transform="rotate(${i*47} ${(100+rr*Math.cos(a)).toFixed(1)} ${(100+rr*Math.sin(a)).toFixed(1)})"/>`}
  for(let k=0;k<pcs;k++){const a=k*2*Math.PI/pcs;sl+=`<line x1="100" y1="100" x2="${(100+(r-6)*Math.cos(a)).toFixed(1)}" y2="${(100+(r-6)*Math.sin(a)).toFixed(1)}"/>`}
  return `<svg viewBox="0 0 200 200" class="viz" role="img" aria-label="Pizza preview">
   <defs><clipPath id="pzc"><circle cx="100" cy="100" r="${r-9}"/></clipPath></defs>
   <circle cx="100" cy="100" r="98" fill="var(--surface2)"/><circle cx="100" cy="100" r="98" fill="none" stroke="var(--line)" stroke-width="2"/>
   ${burst?`<circle cx="100" cy="100" r="${r+5}" fill="#f7cf57" opacity=".55"/>`:''}
   <circle cx="100" cy="100" r="${r}" fill="${burst?'#e9a83a':'#d18b3c'}"/>
   ${burst?`<circle cx="100" cy="100" r="${r-4}" fill="none" stroke="#fff1b8" stroke-width="3" stroke-dasharray="3 5"/>`:''}
   ${m.img?`<image href="${IMG(m.img)}" x="${100-r*1.3}" y="${100-r*1.3}" width="${r*2.6}" height="${r*2.6}" clip-path="url(#pzc)" preserveAspectRatio="xMidYMid slice"/>`:`<circle cx="100" cy="100" r="${r-9}" fill="#f4cc6e"/><circle cx="100" cy="100" r="${r-12}" fill="#e3563f" opacity=".25"/>`}
   <g clip-path="url(#pzc)">${chz}${dots}</g>
   <g stroke="rgba(60,30,0,.35)" stroke-width="1.3">${sl}</g>
  </svg>`;
}
function offerStub(o){
  if(o.type==='day')return `${o.pct}%<small>OFF</small>`;
  if(o.type==='bogo')return `1+1<small>BOGO</small>`;

/* ===== TRACKING ===== */
function trackInfo(o){
  const t=o.times||{};const now=Date.now();const del=o.type==='delivery';
  let head,eta=null,prog=0;
  const prepStart=t.preparing||t.placed||o.ts;
  if(o.status==='placed'){head='Waiting for the outlet to accept';eta=PREP_MIN+(del?RIDE_MIN:0)}
  else if(o.status==='preparing'){head='Your pizza is in the oven';eta=Math.max(2,PREP_MIN-Math.floor((now-prepStart)/60000))+(del?RIDE_MIN:0)}
  else if(o.status==='ready'){head=del?'Packed · rider is picking it up':o.type==='dine'?'Ready · serving to your table':'Ready at the counter';eta=del?RIDE_MIN:0}
  else if(o.status==='out'){const f=Math.min(.95,(now-(t.out||now))/(RIDE_MIN*60000));prog=Math.max(.05,f);head='On the way to you';eta=Math.max(1,Math.ceil(RIDE_MIN*(1-f)))}
  else if(o.status==='done'){head=doneLabel(o.type)+'. Enjoy your pizza!';prog=1}
  else head='Order cancelled by the outlet';
  return {head,eta,prog};
}

function openCharge(){

      ${b.discount?`<div class="savings num">${b.discounts.map(d=>esc(d.name)).join(' + ')} · −${rs(b.discount)}</div>`:''}

        <div><div class="grp-h">Return amount</div><div class="big num" style="color:${ch<0&&g?'var(--bad)':'var(--ok)'}" id="chg">${g?(ch<0?'Short '+rs(-ch):rs(ch)):'—'}</div></div>
        <div class="quick" style="grid-column:1/-1">${[t,...[100,200,500,1000,2000].filter(v=>v>t).slice(0,3)].map(v=>`<button data-act="gv" data-v="${v}" class="num">${v===t?'Exact':rs(v)}</button>`).join('')}</div>
      </div>`:''}
      ${st.mode==='upi'?`<div class="qr"><div data-qr="upi://pay?pa=${encodeURIComponent(cur().upi)}&pn=${encodeURIComponent('Cheesy Pizza')}&am=${t}&cu=INR"></div><b class="num">${rs(t)} · ${esc(cur().upi)}</b><span class="small">Customer scans this QR</span></div>`:''}
      ${st.mode==='card'?'<div class="notice">Swipe the card on the machine, then confirm here.</div>':''}
      ${st.mode==='wallet'?`<div class="notice">${rs(t)} will be paid from the customer's Cheesy Wallet (balance ${rs(walletOf(P.phone))}).</div>`:''}
      ${st.mode==='zomato'?'<div class="notice">Paid through Zomato. Counted under Zomato in the day sale.</div>':''}
      ${st.mode==='due'?(P.phone.length===10?`<div class="notice">${rs(t)} will be added to ${esc(P.name||'this customer')}'s baki (due) amount.</div>`:'<div class="notice" style="background:var(--bad-soft);color:var(--bad)">Add the customer mobile number to keep a baki amount.</div>'):''}

function pad(a,b,w=32){a=String(a);b=String(b);const sp=w-a.length-b.length;return sp>0?a+' '.repeat(sp)+b:a.slice(0,w-b.length-1)+' '+b}
function center(s,w=32){s=String(s);return ' '.repeat(Math.max(0,Math.floor((w-s.length)/2)))+s}
function billText(o){
  const out=outletOf(o);const L=[];const hr='-'.repeat(32);
  L.push(center('CHEESY PIZZA'),center('Really Cheesy...!'),center(out.name),center('Ph: '+fmtPhone(out.phone)),center('PURE VEG'),hr);
  L.push(pad('Bill: '+o.no,TYPES[o.type]),pad(fmtDate(o.date),fmtTime(o.ts)));
  if(o.customer.name||o.customer.phone)L.push('Cust: '+(o.customer.name||'')+' '+(o.customer.phone||''));
  if(o.table)L.push('Table: '+o.table);if(o.address)L.push('Addr: '+o.address.slice(0,26));
  L.push(hr,pad('Item','Amt'),hr);
  o.items.forEach(l=>{L.push(pad(l.qty+' x '+l.name.slice(0,20),String(l.unit*l.qty)));const a=addonText(l);if(a)L.push('   '+a.slice(0,29))});
  L.push(hr,pad('Item total','Rs '+o.subtotal));(o.discounts||[]).forEach(d=>L.push(pad(d.name.slice(0,22),'-'+d.amt)));
  L.push(pad('TOTAL','Rs '+o.total),pad('Paid by',PAY[o.pay.mode]));if(o.walletUsed&&o.pay.mode!=='wallet')L.push(pad('From wallet','Rs '+o.walletUsed));if(o.coinsEarned)L.push(pad('Cheese Coins earned','+'+o.coinsEarned));
  if(o.pay.mode==='cash'&&o.pay.given)L.push(pad('Given','Rs '+o.pay.given),pad('Return','Rs '+o.pay.change));
  if(o.status==='cancelled')L.push(hr,center('*** CANCELLED ***'));
  L.push(hr,center('Thank you! Visit again'),center('No Mayonnaise Products'));
  return L.join('\n');
}
function wrapTxt(t,w){const out=[];let line='';String(t).split(' ').forEach(x=>{if((line+' '+x).trim().length>w){if(line)out.push(line);line=x}else line=(line+' '+x).trim()});if(line)out.push(line);return out}
function kotText(o){
  const L=[];const hr='='.repeat(32);
  L.push(center('KOT'),hr,pad('Order '+o.no,TYPES[o.type]),pad(fmtTime(o.ts),o.table?'Table '+o.table:''),hr);
  o.items.forEach(l=>{L.push(l.qty+' x '+l.name);if(l.combo)(l.picks||[]).forEach(p=>L.push('    - '+p));if(l.size)L.push('    Size: '+sizeLabel(l.size));l.addons.forEach(a=>L.push('    + '+(S.addons[a]?.name||a)));if(noteText(l))wrapTxt(noteText(l),26).forEach((t,i)=>L.push((i?'       ':'    >> ')+t))});if(o.note){L.push('-'.repeat(32));wrapTxt('NOTE: '+o.note,32).forEach(t=>L.push(t))}
  L.push(hr);return L.join('\n');
}

function salesFor(date,scope){
  const list=S.orders.filter(o=>o.date===date&&o.status!=='cancelled'&&(scope==='all'||o.outletId===S.cur));
  const by={cash:0,upi:0,card:0,wallet:0,zomato:0,due:0};list.forEach(o=>{const w=o.walletUsed||0;by.wallet+=w;by[o.pay.mode]+=o.total-w});
  const tot=list.reduce((s,o)=>s+o.total,0);const disc=list.reduce((s,o)=>s+((o.subtotal||o.total)-o.total),0);
  const types={};list.forEach(o=>types[o.type]=(types[o.type]||0)+o.total);
  const items={};list.forEach(o=>o.items.forEach(l=>{items[l.name]=(items[l.name]||0)+l.qty}));
  const offers={};list.forEach(o=>(o.discounts||[]).forEach(d=>offers[d.name]=(offers[d.name]||0)+d.amt));
  const canc=S.orders.filter(o=>o.date===date&&o.status==='cancelled'&&(scope==='all'||o.outletId===S.cur)).length;
  const rated=list.filter(o=>o.rating);const rating=rated.length?rated.reduce((a,o)=>a+o.rating,0)/rated.length:0;
  const pt=list.filter(o=>o.times&&o.times.ready&&o.times.preparing&&o.times.ready>o.times.preparing).map(o=>(o.times.ready-o.times.preparing)/60000);const prep=pt.length?pt.reduce((a,b)=>a+b,0)/pt.length:0;
  const hours={};list.forEach(o=>{const h=new Date(o.ts).getHours();hours[h]=(hours[h]||0)+o.total});
  return {list,by,tot,types,items,canc,disc,offers,rating,ratedN:rated.length,prep,hours};
}

      <div class="grp-h" style="margin:14px 0 6px">Top items</div>
      ${top.map(([n,q])=>`<div class="row" style="padding:4px 0"><span class="grow">${esc(n)}</span><span class="num muted">${q} sold</span></div>`).join('')||'<div class="muted small">No sales</div>'}

const mroot=document.getElementById('modalRoot');let mh={};

  mroot.querySelector('.modal').scrollTop=sc;

  if(prev){const el=document.getElementById(prev);if(el&&mroot.contains(el)){el.focus();if(el.setSelectionRange&&el.type!=='number'&&el.tagName!=='SELECT')try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}

document.addEventListener('click',e=>{

function wheelSVG(){
  const cx=110,r=104;let g='';
  SEGS.forEach((s,i)=>{const a0=(i*45-112.5)*Math.PI/180,a1=((i+1)*45-112.5)*Math.PI/180;
    const x0=cx+r*Math.cos(a0),y0=cx+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cx+r*Math.sin(a1);const am=(i*45-90);
    g+=`<path d="M${cx} ${cx}L${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${s.c}"/>`;
    g+=`<text transform="rotate(${am+90} ${cx} ${cx})" x="${cx}" y="${cx-62}" text-anchor="middle" font-size="12" font-weight="800" fill="${s.c==='#f2b632'?'#3a2800':'#fff'}" font-family="Baloo Bhai 2,sans-serif">${s.t}</text>`});
  return `<svg class="wheel" id="wheel" viewBox="0 0 220 220" style="transform:rotate(${U.spin.deg}deg)" role="img" aria-label="Prize wheel"><circle cx="110" cy="110" r="109" fill="#082a31"/>${g}<circle cx="110" cy="110" r="22" fill="#fff"/><text x="110" y="116" text-anchor="middle" font-size="16" font-weight="800" fill="#1a93a8" font-family="Baloo Bhai 2,sans-serif">C</text></svg>`;
}
function doSpin(){
  const c=me();if(!c||U.spin.busy)return;if(c.spinDate===today()){toast('You have already spun today. Come back tomorrow!');return}
  const idx=Math.floor(Math.random()*SEGS.length);
  U.spin.busy=true;U.spin.deg=U.spin.deg-(U.spin.deg%360)+360*6+(360-idx*45)%360;
  const w=document.getElementById('wheel');if(w)w.style.transform=`rotate(${U.spin.deg}deg)`;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{
    const s=SEGS[idx];c.spinDate=today();let msg;
    if(s.k==='coins'){coinAdd(c.phone,s.v,'Spin & win');msg=`You won ${s.v} Cheese Coins!`}
    else if(s.k==='none'){msg='So close! Try again tomorrow.'}

      msg=`You won ${s.t}! Your code ${code} is saved under My coupons.`}
    U.spin.busy=false;U.spin.result=msg;save();if(s.k!=='none')confetti();render();

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas');cv.className='confetti';document.body.appendChild(cv);
  const W=cv.width=innerWidth,H=cv.height=innerHeight,ctx=cv.getContext('2d');const cols=['#f2b632','#1a93a8','#d23f35','#1f8a4c','#6b4fd0','#ffffff'];
  const P=[...Array(140)].map(()=>({x:W/2+(Math.random()-.5)*120,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:4+Math.random()*6,c:cols[Math.random()*6|0],r:Math.random()*6}));
  let t=0;(function f(){ctx.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.4;p.x+=p.vx;p.y+=p.vy;p.r+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});if(++t<110)requestAnimationFrame(f);else cv.remove()})();
}

      <div class="card panel"><h3 style="font-size:22px">Cheese Coins</h3><div class="row"><div class="coin">C</div><div><b class="num" style="font-size:28px;font-family:var(--display)">${Math.floor(c.coins||0)}</b><div class="small muted">1 coin = ₹1 · use up to 20% of a bill</div></div></div>
        ${c.tx.filter(t=>t.kind==='coins').slice(0,6).map(t=>`<div class="tx"><span>${esc(t.note)}</span><span class="num ${t.amt>=0?'pos':'neg'}">${t.amt>=0?'+':''}${t.amt}</span></div>`).join('')}</div>
      <div class="card panel"><h3 style="font-size:22px">Invite friends</h3><div class="refcard"><div class="grow"><div class="small muted">Your referral code</div><div class="refcode">${esc(c.ref)}</div></div><button class="btn sm" data-act="copyref" data-t="${esc(refTxt)}">Copy</button><a class="btn sm pri" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(refTxt)}">Share on WhatsApp</a></div><div class="small muted">You and your friend each get 50 Cheese Coins when they sign up with your code.</div></div>
    </div>
    <div class="card panel"><h3 style="font-size:22px">Badges <span class="small muted">${bs.filter(b=>b.on).length} of ${bs.length} unlocked</span></h3><div class="badges">${bs.map(b=>`<div class="badge ${b.on?'':'lock'}"><div class="bi">${b.k}</div><b>${b.n}</b><small>${b.d}</small></div>`).join('')}</div></div>`;
  }
  if(tab==='profile'){
    body=`<div class="card panel" style="max-width:560px">
      <div class="field"><label for="pr-name">Name</label><input class="inp" id="pr-name" value="${esc(c.name)}"></div>
      <div class="row"><div class="field grow"><label>Mobile</label><input class="inp num" value="${fmtPhone(c.phone)}" disabled></div><div class="field grow"><label for="pr-bday">Birthday</label><input class="inp" id="pr-bday" type="date" value="${esc(c.bday||'')}"></div></div>
      <div class="field"><label for="pr-addr">Saved delivery address</label><textarea class="inp" id="pr-addr" rows="2">${esc(c.addr||'')}</textarea></div>
      <button class="btn pri" data-act="pr-save" style="align-self:flex-start">Save profile</button>
      <div class="grp-h" style="margin-top:8px">Change PIN</div>
      <div class="row"><input class="inp num grow" id="pr-old" type="password" inputmode="numeric" maxlength="4" placeholder="Current PIN" aria-label="Current PIN" style="width:auto"><input class="inp num grow" id="pr-new" type="password" inputmode="numeric" maxlength="4" placeholder="New PIN" aria-label="New PIN" style="width:auto"><button class="btn" data-act="pr-pin">Update PIN</button></div>
      <button class="btn bad" data-act="signout" style="align-self:flex-start;margin-top:8px">Sign out</button></div>`;
  }
  return `<main class="acc">
    <div class="row"><button class="btn sm" data-act="acc-back">← Back to menu</button></div>
    <section class="acc-hero"><div class="av" style="width:64px;height:64px;font-size:30px;position:relative;z-index:1">${esc(c.name[0]||'?')}</div>
      <div class="grow" style="position:relative;z-index:1"><h2>Hi, ${esc(c.name.split(' ')[0])}!</h2><p>Member since ${new Date(c.joined||Date.now()).toLocaleDateString('en-IN',{month:'long',year:'numeric'})} · ${badgesFor(c.phone).filter(b=>b.on).length} badges</p></div>
      <div class="kpis"><div class="kpi"><b class="num">${rs(c.wallet||0)}</b><span>Wallet</span></div><div class="kpi"><b class="num">${Math.floor(c.coins||0)}</b><span>Coins</span></div><div class="kpi"><b class="num">${ok.length}</b><span>Orders</span></div><div class="kpi"><b class="num">${rs(ok.reduce((s,o)=>s+(o.subtotal-o.total),0))}</b><span>Saved</span></div></div></section>
    ${bcode?`<div class="bday">Happy birthday, ${esc(c.name.split(' ')[0])}! Use code <span class="codechip">${bcode}</span> for 25% off this week.</div>`:''}

function openTopup(amt){
  const c=me();const bonus=amt>=1000?Math.round(amt*.05):0;
  showModal(`<div class="mh"><h3>Add ${rs(amt)} to wallet</h3><button class="x" data-act="close" aria-label="Close">×</button></div>
  <div class="mb"><div class="qr"><div data-qr="upi://pay?pa=${encodeURIComponent(cur().upi)}&pn=${encodeURIComponent('Cheesy Pizza Wallet')}&am=${amt}&cu=INR"></div><b class="num">${rs(amt)} to ${esc(cur().upi)}</b></div>
  ${bonus?`<div class="savings num">You get ${rs(bonus)} bonus · wallet gets ${rs(amt+bonus)}</div>`:''}
  <div class="demo">In the live version, money is added only after the payment is confirmed.</div>
  <button class="btn pri lg block" data-act="top-ok" data-v="${amt}">I have paid</button></div>`);
}

/* ----- scratch card ----- */
function initScratch(){
  document.querySelectorAll('canvas[data-scratch]').forEach(cv=>{
    if(cv.dataset.ready)return;cv.dataset.ready=1;const ctx=cv.getContext('2d');const W=cv.width,H=cv.height;
    const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#b9c6c9');g.addColorStop(.5,'#e3ecee');g.addColorStop(1,'#9fb0b4');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#46626a';ctx.font='700 20px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('Scratch here to win',W/2,H/2+7);
    let down=false,n=0;const scr=e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,18,0,7);ctx.fill();if(++n===45)revealScratch(cv.dataset.scratch)};
    cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);scr(e)});cv.addEventListener('pointermove',e=>{if(down)scr(e)});cv.addEventListener('pointerup',()=>down=false);
  });
}
function revealScratch(id){const o=S.orders.find(x=>x.id===id);if(!o||!o.scratch||o.scratch.done)return;o.scratch.done=true;coinAdd(o.customer.phone,o.scratch.coins,'Scratch card '+o.no);save();confetti();toast(o.scratch.coins+' Cheese Coins added!');setTimeout(()=>{if(U.trackId===id)openTrack()},700)}
function scratchBlock(o){
  if(!o.scratch)return '';
  if(o.scratch.done)return `<div class="savings num" style="text-align:center">You won ${o.scratch.coins} Cheese Coins from your scratch card</div>`;
  return `<div style="text-align:center;display:flex;flex-direction:column;gap:6px"><b>You got a scratch card!</b><div class="scratch"><div class="prize"><div class="coin">C</div><span class="num" style="font-size:20px">${o.scratch.coins} Cheese Coins</span></div><canvas width="300" height="120" data-scratch="${o.id}" aria-label="Scratch card"></canvas></div><button class="btn sm" style="align-self:center" data-act="scratch-reveal" data-id="${o.id}">Reveal</button></div>`;
}

/* ----- staff login + staff screen ----- */
const L={uid:null,buf:'',err:''};
function renderLogin(){
  return `<div class="login"><div class="card ${L.err?'shake':''}"><h2 style="font-size:28px">Outlet login</h2><div class="small muted">Choose your name, then enter your 4-digit PIN.</div>
    <div class="users">${S.users.map(u=>`<button data-act="lg-user" data-v="${u.id}" aria-pressed="${L.uid===u.id}"><span class="av">${esc(u.name[0])}</span>${esc(u.name)}<small>${ROLES[u.role]}</small></button>`).join('')}</div>
    <div class="dots" aria-label="PIN entered">${[0,1,2,3].map(i=>`<i class="${L.buf.length>i?'on':''}"></i>`).join('')}</div>
    ${L.err?`<div class="msg-bad" style="text-align:center">${esc(L.err)}</div>`:''}
    <div class="keypad">${['1','2','3','4','5','6','7','8','9','C','0','←'].map(k=>`<button data-act="lg-key" data-v="${k}" aria-label="${k==='C'?'Clear':k==='←'?'Delete':k}">${k}</button>`).join('')}</div>
    <div class="demo">Demo PINs · Owner 1234 · Cashier 1111 · Kitchen 2222. Owners can change staff and PINs in the Staff screen.</div></div></div>`;
}
function lgKey(k){
  if(!L.uid){L.err='Choose your name first.';render();return}
  if(L.busy)return;if(k==='C')L.buf='';else if(k==='←')L.buf=L.buf.slice(0,-1);else if(L.buf.length<4)L.buf+=k;L.err='';
  if(L.buf.length===4&&!L.busy){const u=S.users.find(x=>x.id===L.uid);L.busy=true;
    api('/api/auth/staff',{id:L.uid,pin:L.buf}).then(r=>{if(r.ok&&u){S.staffId=u.id;L.uid=null;saveLocal();U.pos.tab=ROLE_TABS[u.role][0];toast('Welcome, '+u.name)}else L.err='Wrong PIN. Try again.'},()=>{L.err='Could not reach the server.'}).finally(()=>{L.buf='';L.busy=false;render()})}
  render();
}
function vStaff(){
  const meU=staff();
  return `<div class="ph1"><h2>Staff & logins</h2><span class="muted small">Owners see everything. Cashiers: orders, counter, customers. Kitchen: kitchen and counter.</span></div>
  <div class="card tw"><table><thead><tr><th>Name</th><th>Role</th><th>New PIN</th><th></th></tr></thead><tbody>
  ${S.users.map(u=>`<tr><td><input class="inp" data-us="${u.id}" data-f="name" value="${esc(u.name)}" aria-label="Name" style="min-width:140px"></td>
    <td><select class="inp" data-us="${u.id}" data-f="role" aria-label="Role" ${u.id===meU.id?'disabled':''}>${Object.entries(ROLES).map(([k,n])=>`<option value="${k}" ${u.role===k?'selected':''}>${n}</option>`).join('')}</select></td>
    <td><input class="inp num" data-us="${u.id}" data-f="pin" type="password" inputmode="numeric" maxlength="4" placeholder="4 digits" aria-label="New PIN" style="max-width:120px"></td>
    <td>${u.id===meU.id?'<span class="chip ready">You</span>':`<button class="btn sm bad" data-act="del-user" data-id="${u.id}">Remove</button>`}</td></tr>`).join('')}
  </tbody></table></div>
  <button class="btn pri" style="margin-top:12px" data-act="add-user">+ Add staff</button>
  <p class="small muted">A new PIN is saved when you leave the box. New staff start with PIN 0000.</p>`;
}

/* ----- extra events ----- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;
  
  switch(act){
    case 'auth':openAuth(el.dataset.v,el.dataset.next);break;
    case 'au-mode':U.au.m=el.dataset.v;U.au.err='';render();break;
    case 'au-go':authGo();break;
    case 'pn':{const v=el.dataset.v;closeModal();
      if(v==='menu'||v==='offers'){U.pubView='menu';render();document.getElementById(v)?.scrollIntoView({behavior:'smooth'});if(v==='menu'&&!document.getElementById(v))window.scrollTo(0,0)}
      else if(v==='track'){openTrackFind()}
      else if(v==='orders'||v==='wallet'){if(me()){U.pubView='account';U.accTab=v;render();window.scrollTo(0,0)}else openAuth('in',v)}
      else if(v==='account'){U.pubView='account';U.accTab='rewards';render();window.scrollTo(0,0)}
      else openAuth(v==='signup'?'up':'in');break}
    case 'pf-chip':{const t=el.dataset.v;pubForm.note=(pubForm.note?pubForm.note.replace(/[ ,.]*$/,'')+', ':'')+t;openPubCart();break}
    case 'pos-chip':{const t=el.dataset.v;U.pos.note=(U.pos.note?U.pos.note.replace(/[ ,.]*$/,'')+', ':'')+t;render();break}
    case 'account':U.pubView='account';U.accTab=U.accTab||'orders';closeModal();render();window.scrollTo(0,0);break;
    case 'acc-back':U.pubView='menu';render();window.scrollTo(0,0);break;
    case 'acc-tab':U.accTab=el.dataset.v;U.spin.result=null;render();break;
    case 'signout':S.me=null;save();U.pubView='menu';Object.assign(pubForm,{name:'',phone:'',address:'',useWallet:false});toast('Signed out');render();break;
    case 'pr-save':{const c=me();c.name=document.getElementById('pr-name').value.trim()||c.name;c.bday=document.getElementById('pr-bday').value;c.addr=document.getElementById('pr-addr').value.trim();save();toast('Profile saved');render();break}
    case 'pr-pin':{const c=me();const o=document.getElementById('pr-old').value,n=document.getElementById('pr-new').value;if(!/^\d{4}$/.test(n)){toast('New PIN must be 4 digits');break}
      api('/api/auth/customer',{phone:c.phone,pin:o}).then(r=>{if(!r.ok){toast('Current PIN is wrong');return}setPin(c,n);save();toast('PIN updated');render()},()=>toast('Could not reach the server'));break}
    case 'topamt':U.topup=+el.dataset.v;render();break;
    case 'topup':{const v=Math.round(+document.getElementById('top-amt').value||0);if(v<50){toast('Minimum ₹50');break}U.topup=v;openTopup(v);break}
    case 'top-ok':{const v=+el.dataset.v;const c=me();walletAdd(c.phone,v,'Added money via UPI');if(v>=1000)walletAdd(c.phone,Math.round(v*.05),'Top-up bonus 5%');save();closeModal();confetti();toast(rs(v)+' added to wallet');render();break}
    case 'spin':doSpin();break;
    case 'copyref':{const t=el.dataset.t;try{navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Copy blocked — code: '+me().ref))}catch(_){toast('Code: '+me().ref)}break}
    case 'scratch-reveal':revealScratch(el.dataset.id);break;
    case 'lock':S.staffId=null;save();render();break;
    case 'lg-user':L.uid=el.dataset.v;L.buf='';L.err='';render();break;
    case 'lg-key':lgKey(el.dataset.v);break;
    case 'add-user':{const u={id:uid('u'),name:'New staff',role:'cashier'};setPin(u,'0000');S.users.push(u)}save();render();break;
    case 'del-user':S.users=S.users.filter(u=>u.id!==el.dataset.id);save();render();break;
    case 'topup-pos':{const ph=el.dataset.ph;const v=Math.round(+document.getElementById('tw-amt').value||0);if(v<=0){toast('Enter an amount');break}walletAdd(ph,v,'Cash top-up at '+cur().name);save();toast(rs(v)+' added to wallet');render();break}
    case 'reset-pin':{const c=S.customers[el.dataset.ph];delete c.pin;delete c._newPin;if(S.me===c.phone)S.me=null;save();toast('PIN reset. Customer can sign up again with the same number.');render();break}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset.us)return;const u=S.users.find(x=>x.id===t.dataset.us);if(!u)return;
  if(t.dataset.f==='pin'){if(/^\d{4}$/.test(t.value)){setPin(u,t.value);t.value='';toast('PIN updated for '+u.name)}else toast('PIN must be 4 digits')}
  else u[t.dataset.f]=t.value;
  save();if(t.dataset.f!=='name')render();
});
document.addEventListener('input',e=>{const id=e.target.id||'';if(!id.startsWith('au-')||!U.au||mroot.contains(e.target))return;const k=id.slice(3);U.au[k]=k==='phone'||k==='pin'||k==='pin2'?e.target.value.replace(/\D/g,''):e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='au-bday'&&U.au)U.au.bday=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id||'').startsWith('au-')&&U.au){e.preventDefault();authGo()}});
document.addEventListener('keydown',e=>{if(S.mode==='pos'&&!staff()&&!mroot.innerHTML&&/^[0-9]$/.test(e.key))lgKey(e.key);else if(S.mode==='pos'&&!staff()&&e.key==='Backspace')lgKey('←')});

(async function boot(){
  let loc={};try{loc=JSON.parse(localStorage.getItem(LKEY))||{}}catch(_){}
  let d;try{d=await api('/api/state')}catch(_){
    app.innerHTML='<div class="card" style="max-width:480px;margin:60px auto;padding:20px"><h2>Can\'t reach the Cheesy Pizza server</h2><p class="muted">Start it with <code>npm start</code>, then open <b>http://localhost:3000</b>.</p></div>';return}
  S={cur:'o1',mode:'public',me:null,staffId:null,...loc};applyState(d);
  if(d.demoPending)try{if((await api('/api/demo/claim',{})).ok)seedDemoOrders()}catch(_){}
  migrate();
  if(location.hash==='#pos'||location.hash==='#public')S.mode=location.hash.slice(1);
  render();startPolling();
})();
</script>
