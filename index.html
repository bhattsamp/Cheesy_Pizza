.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .nm{font-weight:600}
.line .ad{font-size:12px;color:var(--muted);grid-column:1}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--surface2);width:28px;height:28px;font-weight:700}
.qty span{min-width:28px;text-align:center}
.lp{border:1px dashed transparent;background:transparent;font-weight:700;padding:2px 4px;border-radius:6px}
.lp:hover{border-color:var(--line)}
.lp-in{width:84px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;text-align:right;background:var(--surface)}
.lp-in:focus{border-color:var(--teal);outline:none}
.ticket .ft{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.bl{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bl.disc{color:var(--ok);font-weight:600}
.tot{display:flex;justify-content:space-between;font-family:var(--display);font-size:24px;font-weight:800}
.custbox{background:var(--teal-soft);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.custbox.due{background:var(--bad-soft)}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.types button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 2px;font-size:13px;font-weight:600}
.types button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.kt{border-radius:14px;border:2px solid var(--warn);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer;transition:transform .12s}
.kt:active{transform:scale(.98)}
.kt.placed{border-color:var(--plum);border-style:dashed;cursor:default}
.kt.late{border-color:var(--bad)}
.kt .no{font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.kt ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.kt li{font-size:15px;font-weight:600}
.kt li small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.kt li .q{display:inline-block;min-width:26px;background:var(--ink);color:var(--bg);border-radius:6px;text-align:center;margin-right:6px}
.kcol-h{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.kcol-h h3{font-size:19px}
.counter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.lane-h{display:flex;align-items:center;gap:8px}
.lane-h h3{font-size:19px;flex:1}
.lane-h .n{font-family:var(--display);font-weight:800;font-size:20px;background:var(--surface2);border-radius:10px;padding:0 10px}
.ctk{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.ctk .no{font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.ctk.ready{border-left:5px solid var(--ok)}
.ctk.prep{border-left:5px solid var(--warn)}
.ctk.out{border-left:5px solid var(--teal)}
.board{position:fixed;inset:0;z-index:70;background:#082a31;color:#fff;display:grid;grid-template-rows:auto 1fr;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.board h2{font-size:clamp(26px,4vw,48px)}
.board .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:18px;min-height:0}
.board .col{background:rgba(255,255,255,.06);border-radius:24px;padding:20px;overflow:auto}
.board .col h3{font-size:clamp(22px,3vw,36px);margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}
.board .nums{display:flex;flex-wrap:wrap;gap:14px}
.board .nums span{font-family:var(--display);font-weight:800;font-size:clamp(34px,5vw,64px);line-height:1;padding:10px 18px;border-radius:16px;background:rgba(255,255,255,.08)}
.board .col.rd h3{color:#7ee2a2}
.board .col.rd .nums span{background:#1f8a4c;animation:glow 2s infinite}
@keyframes glow{50%{background:#27a45c}}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.cx td{opacity:.55}
tr.cx td.st{opacity:1}
td.r,th.r{text-align:right}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{padding:14px}
.stat .k{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.stat .v{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1;margin-top:4px}
.stat .d{font-size:12px}
.stat.hero{grid-column:span 2;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat.hero .k{color:inherit;opacity:.7}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding:10px 4px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bar i{display:block;width:100%;max-width:46px;background:var(--teal);border-radius:6px 6px 2px 2px;min-height:2px}
.bar.cur i{background:var(--cheese)}
.bar span{font-size:11px;color:var(--muted);white-space:nowrap}
.bar b{font-size:11px;font-weight:600}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2)}
.split i{display:block;height:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.switch{position:relative;width:42px;height:24px;flex:none;display:inline-block}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--teal);outline-offset:2px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600;cursor:pointer;position:relative}
.days label:has(input:checked){background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.days input{position:absolute;opacity:0;pointer-events:none}
.sizechips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sizechips .chip{font-size:13px;padding:4px 6px 4px 12px;background:var(--surface2);color:var(--ink)}
.sizechips .chip button{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:0 4px}
.desc-in{min-height:38px;font-size:13px}

/* The page behind an open pop-up stays still */
html:has(#modalRoot:not(:empty)),html:has(#boardRoot:not(:empty)),html:has(#chooser){overflow:hidden}
.modal{overscroll-behavior:contain}
.scrim{position:fixed;inset:0;background:rgba(6,20,24,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:20px;width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow-lg)}
.modal .mh{padding:16px 18px 10px;display:flex;align-items:flex-start;gap:12px;position:sticky;top:0;background:var(--surface);z-index:2}
.modal .mh h3{font-size:23px;font-weight:800;flex:1}
.modal .mb{padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px}
.x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.opt input{accent-color:var(--teal);width:18px;height:18px}
.opt .p{margin-left:auto;font-weight:600}
.paymodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.paymodes button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;font-weight:700}
.paymodes button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--surface2);border-radius:14px;padding:14px}
.calc .big{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-weight:600}
.qr{display:grid;place-items:center;gap:8px;word-break:break-all;text-align:center;background:#fff;color:#0f2e36;border-radius:14px;padding:16px}
.qr img,.qr canvas{width:180px!important;height:180px!important}
.receipt{background:#fffef8;color:#1a1a1a;font-family:"Courier New",ui-monospace,monospace;font-size:13px;line-height:1.35;padding:16px 14px;border-radius:6px;box-shadow:inset 0 0 0 1px #e8e2c8;white-space:pre;overflow-x:auto;width:100%;max-width:340px;margin:0 auto}
.bignum{font-family:var(--display);font-size:54px;font-weight:800;color:var(--teal);line-height:1;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:80;box-shadow:var(--shadow)}

.mobnav{display:none}
/* ===== v3 public look ===== */
.hero3{position:relative;margin-top:18px;border-radius:32px;overflow:hidden;background:radial-gradient(120% 90% at 85% 40%,#1c8fa3 0,#0d4f5c 45%,#082a31 100%);color:#fff;display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:center;padding:64px 40px 48px}
.hero3 .drip{position:absolute;left:0;top:0;width:100%;height:46px}
.h-copy{position:relative;z-index:1}
.hero3 h1{font-size:clamp(40px,6.6vw,74px);font-weight:800;color:#fff;letter-spacing:-.015em}
.hero3 h1 .sw{color:#ffd166;position:relative;white-space:nowrap;display:inline-block}
.hero3 h1 .sw svg{position:absolute;left:0;bottom:-.02em;width:100%;height:.3em;overflow:visible}
.hero3 p{color:rgba(255,255,255,.82);max-width:48ch;font-size:16px;margin:16px 0 0}
.eyebrow{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#52c985;box-shadow:0 0 0 3px rgba(82,201,133,.3)}
.hero3 .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.btn.ghost:hover{border-color:#fff}
.hero3 .facts b{color:#fff}.hero3 .facts span{color:rgba(255,255,255,.65)}
.plate{position:relative;width:min(420px,76vw);aspect-ratio:1;margin:0 auto;max-width:100%}
.plate::before{content:"";position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(255,209,102,.38),transparent 65%)}
.plate img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 10px rgba(255,255,255,.07),0 0 0 24px rgba(255,255,255,.035);animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{position:absolute;z-index:2;background:#fff;color:#0f2e36;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:6px;align-items:center;animation:bob 3.2s ease-in-out infinite alternate;white-space:nowrap}
.fl i{width:9px;height:9px;border-radius:50%;display:inline-block}
.fl.f1{left:-8%;top:10%}.fl.f2{right:-6%;top:44%;animation-delay:-1.1s}.fl.f3{left:-2%;bottom:10%;animation-delay:-2.2s}
@keyframes bob{to{transform:translateY(-10px)}}
.plate .sticker{left:auto;right:-4%;bottom:-2%;transform:rotate(6deg);z-index:2}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.how>div{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.how b{grid-row:span 2;width:42px;height:42px;border-radius:12px;background:var(--cheese);color:#3a2800;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:800}
.how h3{font-size:18px}.how p{margin:0;font-size:13px;color:var(--muted)}
.gu{font-family:var(--body);color:var(--teal);font-weight:600;font-size:17px}
.coins-band{margin-top:26px;border-radius:22px;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,var(--cheese-soft),var(--surface) 80%);border:1px solid var(--line)}
.coins-band h3{font-size:22px}
.coin{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7a3,#f2b632 55%,#c98a12);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:#5a3d00;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 6px 14px rgba(201,138,18,.35);flex:none}
.coin.sm{width:24px;height:24px;font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .inp{max-width:240px;border-radius:999px;padding:7px 14px}
.filters button{border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{border-style:solid;border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.foot{margin-top:44px;background:#082a31;color:#d8eef1;border-radius:28px;padding:28px 24px;display:grid;grid-template-columns:1fr 2fr;gap:24px}
.foot h3{color:#fff;font-size:26px}.foot .ol{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.foot .ol>div{background:rgba(255,255,255,.06);border-radius:14px;padding:12px}
.foot .ol b{color:#fff}.foot small,.foot p{color:rgba(216,238,241,.75)}
.codechip{align-self:flex-start;font-family:ui-monospace,"Courier New",monospace;font-weight:700;font-size:13px;border:1.5px dashed var(--ink);border-radius:6px;padding:0 8px;letter-spacing:.06em}
.coupon.k-code .stub{background:#0b3a43}
.viz{width:min(220px,62vw);height:auto;display:block;margin:0 auto}
@media (max-width:600px){.modal .vizwrap .viz{width:min(190px,50vw)}}
.pub .item .ph{cursor:zoom-in}
.zoom{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:0 auto;border-radius:50%;overflow:visible;touch-action:none;cursor:zoom-in;user-select:none;-webkit-user-select:none}
.zoom>img,.zoom>svg{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;box-shadow:var(--shadow-lg);pointer-events:none;-webkit-user-drag:none}
.zoom>.pz{position:absolute}
.zoom .lens{position:absolute;display:none;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 2px var(--teal);background:var(--surface);pointer-events:none;z-index:3}
.zoom .lens>*{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;border-radius:50%;box-shadow:none}
.modal .vizwrap{position:sticky;top:58px;z-index:1;background:var(--surface);padding-bottom:4px}
.viz .tp{transform-box:fill-box;transform-origin:center}
.viz .tp.new{animation:topDrop .55s cubic-bezier(.3,1.4,.5,1) both}
.viz.bump{animation:vizBump .6s .25s ease}
@keyframes topDrop{from{opacity:0;transform:translateY(-70px) scale(1.8) rotate(-40deg)}70%{opacity:1}to{opacity:1;transform:none}}
@keyframes vizBump{40%{transform:scale(1.04)}}
.viz circle{transition:r .35s ease}
.vizcap{text-align:center;font-weight:600;font-size:13px;color:var(--muted);margin-top:-6px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.tables button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;font-weight:700;font-size:13px}
.tables button.busy{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-soft)}
.tables button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pbar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}.pbar i{display:block;height:100%;background:var(--warn)}
.kt.late .pbar i{background:var(--bad)}
.rate{background:var(--cheese-soft);color:var(--cheese-ink);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.stars{display:flex;gap:2px}.stars button{border:0;background:transparent;font-size:32px;color:var(--cheese);line-height:1;padding:2px 4px}
.stars:hover button{color:var(--cheese)}.stars button:hover~button{color:var(--line)}
.msg-ok{color:var(--ok);font-weight:600;font-size:13px}.msg-bad{color:var(--bad);font-weight:600;font-size:13px}
.codes{display:flex;gap:6px;flex-wrap:wrap}
.codes button{border:1.5px dashed var(--teal);background:var(--teal-soft);color:var(--teal);border-radius:8px;padding:2px 10px;font-family:ui-monospace,"Courier New",monospace;font-weight:700;font-size:12px}
/* ===== v4 accounts, wallet, fun ===== */
.acct{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:3px 12px 3px 3px;font-weight:700}
.av{width:30px;height:30px;border-radius:50%;background:var(--cheese);color:#3a2800;display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.acc{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:flex;flex-direction:column;gap:16px}
.acc-hero{border-radius:28px;padding:24px;color:#fff;background:radial-gradient(120% 120% at 90% 0,#1c8fa3,#0d4f5c 50%,#082a31);display:flex;gap:16px;flex-wrap:wrap;align-items:center;position:relative;overflow:hidden}
.acc-hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(242,182,50,.35),transparent 70%)}
.acc-hero h2{font-size:clamp(26px,4vw,36px);color:#fff}
.acc-hero p{margin:4px 0 0;color:rgba(255,255,255,.75);font-size:14px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.kpi{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:10px 14px;min-width:104px}
.kpi b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.kpi span{font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{padding:16px;display:flex;flex-direction:column;gap:12px}
.wgrid{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:16px;align-items:start}
.wcard{aspect-ratio:1.6;width:100%;border-radius:22px;padding:20px;color:#fff;background:linear-gradient(135deg,#0b3a43,#1a93a8 60%,#f2b632 150%);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.wcard::after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.09)}
.wcard .bal{font-family:var(--display);font-size:40px;font-weight:800;line-height:1}

body.drawer-open{overflow:hidden}

/* buttons */
.pubmode .btn{border-radius:999px;padding:9px 18px;font-weight:700;letter-spacing:.01em}
.pubmode .btn.sm{padding:5px 12px}
.pubmode .btn.lg{padding:14px 26px;font-size:16px;border-radius:999px}
.pubmode .btn.pri:hover,.pubmode .btn.chz:hover{filter:brightness(1.07);box-shadow:0 10px 24px rgba(15,127,145,.28)}
.pubmode .btn.chz{background:var(--gold);border-color:var(--gold);color:#3a2800}
.pubmode .btn.ghost{color:var(--warm);border-color:rgba(255,255,255,.4)}
.pubmode .btn.ghost:hover{border-color:var(--warm);background:rgba(255,255,255,.06)}
.btn.glow{position:relative;overflow:hidden;isolation:isolate}
.btn.glow::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--ease)}
.btn.glow:hover::after{transform:translateX(120%)}
.btn .arr{display:inline-block;transition:transform .25s var(--ease)}
.btn:hover .arr{transform:translateX(4px)}

/* header */
.brand-pub,#pubLinks,#cartBtn,#menuBtn,.hdr-order{display:none}
.pubmode .top{background:color-mix(in srgb,var(--char) 90%,transparent);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);color:var(--cream);transition:box-shadow .3s,background .3s}
.pubmode.scrolled .top{box-shadow:0 10px 30px rgba(0,0,0,.28);background:color-mix(in srgb,var(--char) 96%,transparent)}
.pubmode .top-in{max-width:1320px;gap:10px 14px;padding:10px 24px;flex-wrap:nowrap}
.pubmode .top .brand,.pubmode .top .seg{display:none}
.pubmode .brand-pub{display:flex;align-items:center;gap:10px;margin-right:auto;border:0;background:none;color:var(--cream);padding:2px;cursor:pointer;flex:none}
.bp-mark{width:38px;height:38px;flex:none;transition:transform .6s var(--ease)}
.brand-pub:hover .bp-mark{transform:rotate(-24deg)}
.bp-word{display:flex;flex-direction:column;line-height:.9;text-align:left}
.bp-word i{font-family:var(--display);font-style:italic;font-weight:600;font-size:25px;letter-spacing:-.01em}
.bp-word b{font-size:10.5px;letter-spacing:.42em;color:var(--gold);font-weight:700;margin-top:3px}
.pubmode #pubLinks{display:flex;gap:2px;margin:0 auto}
#pubLinks button{border:0;background:none;color:rgba(255,255,255,.78);font-weight:600;font-size:15px;padding:8px 14px;border-radius:999px;position:relative;transition:color .2s}
#pubLinks button::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
#pubLinks button:hover,#pubLinks button[aria-current="page"]{color:var(--warm)}
#pubLinks button:hover::after,#pubLinks button[aria-current="page"]::after{transform:scaleX(1)}
.pubmode #outletSel{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16);color:var(--cream);max-width:170px}
.pubmode #outletSel option{color:#3a2800;background:#fff}
.pubmode #acct .btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:var(--cream)}
.pubmode #acct .btn.pri{background:transparent}
.pubmode #cartBtn{display:grid;place-items:center;position:relative;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--cream);flex:none;transition:background .2s,transform .2s}
#cartBtn:hover{background:rgba(255,255,255,.14)}
#cartBtn svg{width:21px;height:21px}
.cartn{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;border:2px solid var(--char)}
.cartn:empty{display:none}
#cartBtn.bump{animation:bump .5s}
.pubmode .hdr-order{display:inline-flex;flex:none;background:var(--red);border-color:var(--red);color:#fff}
.pubmode #menuBtn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--cream);width:44px;height:44px;border-radius:50%;flex:none;place-items:center;padding:0}
#menuBtn span{display:block;width:18px;height:2px;border-radius:2px;background:currentColor;margin:3px auto;transition:transform .3s var(--ease)}
#pubLinks{order:1}.pubmode #outletSel{order:2}.pubmode #acct{order:3}#cartBtn{order:4}.hdr-order{order:5}#menuBtn{order:6}
@media (max-width:1100px){.pubmode #pubLinks button{padding:8px 9px;font-size:14px}.pubmode #outletSel{display:none}}
@media (max-width:900px){
  .pubmode #pubLinks,.pubmode #acct{display:none}
  .pubmode #menuBtn{display:grid}
}
@media (max-width:720px){
  .pubmode .top-in{padding:8px 12px!important;gap:8px!important}
  .bp-mark{width:32px;height:32px}.bp-word i{font-size:21px}.bp-word b{font-size:9px}
  .pubmode .hdr-order{padding:9px 14px;font-size:14px}
}
@media (max-width:359px){.pubmode .hdr-order{display:none}}

/* drawer (phones and tablets) */
.drw-scrim{position:fixed;inset:0;z-index:58;background:rgba(6,20,24,.55);animation:fadein .25s ease both}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:59;width:min(400px,100%);background:var(--char);color:var(--cream);display:flex;flex-direction:column;gap:22px;padding:calc(14px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto;box-shadow:-30px 0 60px rgba(0,0,0,.4);animation:drwIn .4s var(--ease) both}
@keyframes drwIn{from{transform:translateX(100%)}to{transform:none}}
.drw-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.drw-x{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:none;color:var(--cream);font-size:22px}
.drw-nav{display:flex;flex-direction:column}
.drw-nav button{border:0;border-bottom:1px solid rgba(255,255,255,.09);background:none;color:var(--cream);text-align:left;font-family:var(--display);font-size:27px;font-weight:600;padding:12px 2px;display:flex;justify-content:space-between;align-items:center;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*40ms + 80ms)}
.drw-nav button small{font-family:var(--body);font-size:13px;color:rgba(255,255,255,.55);font-weight:600}
.drw-nav button[aria-current="page"]{color:var(--gold)}
.drw-sec h3{font-family:var(--body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:700;margin-bottom:10px}
.drw-outs{display:grid;gap:8px}
.drw-outs button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:var(--cream);border-radius:14px;padding:12px 14px;text-align:left;font-weight:600}
.drw-outs button[aria-pressed="true"]{border-color:var(--gold);background:rgba(242,182,50,.1)}
.drw-outs small{color:rgba(255,255,255,.6);font-weight:500}
.drw-row{display:flex;gap:8px;flex-wrap:wrap}
.drw-row .btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);color:var(--cream)}
.drw-foot{margin-top:auto;display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.drw-foot a,.drw-foot button{color:rgba(255,255,255,.65);background:none;border:0;padding:4px 0;text-decoration:underline;text-underline-offset:3px;font-size:13px}

/* mobile bottom tabs and cart bar, recoloured */
@media (max-width:720px){
  .pubnav{background:color-mix(in srgb,var(--char) 94%,transparent)!important;border-top-color:rgba(255,255,255,.08)!important;box-shadow:0 -10px 30px rgba(0,0,0,.25)!important}
  .pubnav button{color:rgba(255,255,255,.6)!important}
  .pubnav button[aria-current="page"]{color:var(--gold)!important}
  .pubnav button[aria-current="page"]::after{background:var(--gold)!important}
  .pubmode .cartbar{background:var(--red)!important;box-shadow:0 14px 34px rgba(15,127,145,.45)!important}
  .pubmode .cartbar .btn.chz{background:var(--char);border-color:var(--char);color:var(--cream)}
  .pubmode .cartbar .chip{background:rgba(255,255,255,.18);color:#fff}
}
@media (min-width:721px){.pubmode .pubnav{display:none}}
.pubmode .cartbar{background:color-mix(in srgb,var(--char) 96%,transparent);color:var(--cream);border-top:0;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pubmode .cartbar .muted{color:rgba(255,255,255,.7)}
.pubmode .cartbar .btn.chz{background:var(--red);border-color:var(--red);color:#fff}
.pubmode .cartbar .chip.ready{background:rgba(184,207,157,.18);color:var(--olive)}

/* shared section scaffolding */
.sx{position:relative;padding:clamp(64px,9vw,128px) 0}
.sx-in{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,4vw,32px)}
.sx.dark{background:var(--char);color:var(--cream)}
.sx.dark .muted{color:rgba(255,255,255,.66)}
.kick{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--teal)}
.kick::before{content:"";width:28px;height:1.5px;background:currentColor}
.sx.dark .kick,.hx .kick{color:var(--gold)}
.sx-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px 40px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,48px)}
.sx-h h2{font-size:clamp(36px,5.6vw,72px);line-height:.98;margin-top:14px;max-width:16ch}
.sx-h h2 em{color:var(--teal)}
.sx.dark .sx-h h2 em{color:var(--gold)}
.sx-h p{max-width:42ch;margin:0;color:var(--muted);font-size:16.5px}
.pubmode .gu{color:var(--teal)}

/* ===== HERO ===== */
.hx{--mx:0;--my:0;--sp:0;position:relative;overflow:hidden;isolation:isolate;background:var(--char);color:var(--cream);min-height:min(900px,calc(100svh - var(--toph,64px)));display:grid;align-items:center}
.hx::before{content:"";position:absolute;inset:0;z-index:-2;background:
  radial-gradient(55% 60% at 74% 52%,rgba(255,138,61,.30),transparent 70%),
  radial-gradient(40% 40% at 78% 60%,rgba(15,127,145,.20),transparent 70%),
  radial-gradient(70% 90% at 0% 100%,rgba(242,182,50,.10),transparent 60%),
  linear-gradient(180deg,#120D0B,#1B1310 60%,#3a2800)}
.hx::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.07;pointer-events:none;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.hx-in{max-width:1320px;width:100%;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(16px,4vw,32px) clamp(40px,6vw,72px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:clamp(16px,3vw,48px);align-items:center}
.hx-copy{position:relative;z-index:2;transform:translateY(calc(var(--sp)*-60px));opacity:calc(1 - var(--sp)*1.1)}
.hx-copy .kick i{width:8px;height:8px;border-radius:50%;background:#7BD88F;box-shadow:0 0 0 4px rgba(123,216,143,.18);flex:none}
.hx-copy .kick.closed i{background:#F07A70;box-shadow:0 0 0 4px rgba(240,122,112,.18)}
.hx-copy .kick::before{display:none}
.hx h1{font-size:clamp(46px,7.4vw,112px);line-height:.92;letter-spacing:-.025em;margin:22px 0 0;font-weight:700}
.hx h1 .ln{display:block;overflow:hidden;padding-bottom:.06em;margin-bottom:-.06em}
.hx h1 .ln>span{display:block}
.hx h1 em{color:var(--gold);font-weight:500;padding-right:.04em}
.hx-sub{font-size:clamp(16px,1.35vw,19px);line-height:1.6;color:rgba(255,255,255,.74);max-width:44ch;margin:24px 0 0}
.hx-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.hx-cta .btn.pri{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 12px 34px rgba(15,127,145,.35)}
.hx-facts{display:flex;gap:clamp(18px,3vw,40px);flex-wrap:wrap;margin-top:44px;padding-top:24px;border-top:1px solid rgba(255,255,255,.12)}
.hx-facts div{display:flex;flex-direction:column;gap:2px}
.hx-facts b{font-family:var(--display);font-size:clamp(22px,2.2vw,30px);font-weight:600;line-height:1}
.hx-facts span{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:600}
/* the 3D stage: a tilted plane holding the pizza, with ingredients floating at different depths */
.hx-stage{position:relative;aspect-ratio:1;width:100%;max-width:720px;justify-self:center;perspective:1500px;perspective-origin:50% 30%;transform:translateY(calc(var(--sp)*90px)) scale(calc(1 - var(--sp)*.08))}
.hx-tilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(calc(54deg - var(--my)*6deg)) rotateZ(calc(var(--mx)*-6deg));transition:transform .2s linear}
.hx-glow{position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle,rgba(255,170,90,.38),transparent 62%);transform:translateZ(-70px);filter:blur(10px)}
.hx-plate{position:absolute;inset:5%;border-radius:50%;transform:translateZ(-14px);background:radial-gradient(circle at 50% 42%,#0b3a43 0 56%,#0f4a55 70%,#120C0A 100%);box-shadow:0 0 0 2px rgba(255,255,255,.06),0 60px 80px rgba(0,0,0,.55)}
.hx-pz{position:absolute;inset:8%;transform:translateZ(0)}
.hx-spin{width:100%;height:100%;animation:hxSpin 140s linear infinite;will-change:transform}
.hx-spin svg{width:100%;height:100%;display:block;overflow:visible;transform:rotate(calc(var(--sp)*70deg));transition:transform .2s linear}
@keyframes hxSpin{to{transform:rotate(360deg)}}
.hp-lift{animation:hpLift 4.5s ease-in-out infinite alternate}
@keyframes hpLift{from{transform:translate(0,0)}to{transform:translate(4px,6px)}}
.hx-f{position:absolute;left:var(--x);top:var(--y);width:var(--w);transform-style:preserve-3d;transform:translateZ(var(--z)) rotateX(-54deg)}
.hx-f>div{transform:translate(calc(var(--mx)*var(--d)*1px),calc(var(--my)*var(--d)*1px));transition:transform .2s linear}
.hx-f svg{display:block;width:100%;height:auto;animation:hxBob var(--t,6s) ease-in-out infinite alternate;animation-delay:var(--dl,0s);filter:drop-shadow(0 18px 18px rgba(0,0,0,.45))}
@keyframes hxBob{from{transform:translateY(-6px) rotate(var(--r0,0deg))}to{transform:translateY(8px) rotate(var(--r1,8deg))}}
.hx-steam{position:absolute;left:46%;top:18%;width:8%;height:30%;transform:translateZ(80px) rotateX(-54deg);pointer-events:none}
.hx-steam i{position:absolute;bottom:0;left:var(--l);width:28px;height:110px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,250,243,.28),transparent);filter:blur(8px);animation:hxSteam 5s ease-in infinite;animation-delay:var(--dl)}
@keyframes hxSteam{0%{opacity:0;transform:translateY(20px) scaleY(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-110px) scaleY(1.3) translateX(14px)}}
.hx-card{position:absolute;right:2%;bottom:6%;z-index:3;display:flex;align-items:center;gap:12px;background:rgba(36,24,21,.82);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px;padding:10px 12px 10px 10px;box-shadow:0 20px 50px rgba(0,0,0,.45);max-width:min(330px,80%);transform:translate(calc(var(--mx)*-10px),calc(var(--my)*-8px))}
.hx-card img{width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none}
.hx-card small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hx-card b{display:block;font-family:var(--display);font-size:19px;font-weight:600;line-height:1.15}
.hx-card span{font-size:13px;color:rgba(255,255,255,.7)}
.hx-card .btn{margin-left:auto;padding:8px 14px;font-size:14px}
.hx-badge{position:absolute;left:3%;top:8%;z-index:3;width:clamp(96px,11vw,128px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;background:var(--gold);color:#3a2800;box-shadow:0 18px 40px rgba(0,0,0,.4);transform:rotate(-10deg) translate(calc(var(--mx)*12px),calc(var(--my)*10px))}
.hx-badge b{font-family:var(--display);font-size:clamp(22px,2.6vw,30px);line-height:.95;font-weight:700;display:block}
.hx-badge small{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.hx-scroll{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5);border:0;background:none;opacity:calc(1 - var(--sp)*3)}
.hx-scroll i{width:1.5px;height:34px;background:linear-gradient(var(--gold),transparent);animation:hxCue 1.8s ease-in-out infinite}
@keyframes hxCue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
/* entrance: only when the page is opened, not when it re-renders */
.hx.enter h1 .ln>span{animation:hxUp 1s var(--ease) both;animation-delay:calc(var(--i)*110ms + 150ms)}
.hx.enter .hx-copy .kick,.hx.enter .hx-sub,.hx.enter .hx-cta,.hx.enter .hx-facts{animation:rise .9s var(--ease) both}
.hx.enter .hx-copy .kick{animation-delay:.05s}.hx.enter .hx-sub{animation-delay:.5s}.hx.enter .hx-cta{animation-delay:.62s}.hx.enter .hx-facts{animation-delay:.76s}
.hx.enter .hx-pz{animation:hxPz 1.6s var(--ease) both .1s}
.hx.enter .hx-plate,.hx.enter .hx-glow{animation:fadein 1.2s ease both}
.hx.enter .hx-f>div{animation:hxPop .9s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--k,0)*90ms + .8s)}
.hx.enter .hx-card,.hx.enter .hx-badge{animation:fadein .8s ease both 1.2s}
@keyframes hxUp{from{transform:translateY(105%)}to{transform:none}}
@keyframes hxPz{from{opacity:0;transform:translateZ(-260px) rotate(-70deg) scale(.7)}to{opacity:1;transform:none}}
@keyframes hxPop{from{opacity:0;scale:.3}to{opacity:1;scale:1}}
@media (max-width:900px){
  .hx{min-height:0}
  .hx-in{grid-template-columns:1fr;padding-top:36px;gap:0}
  .hx-copy{opacity:1;transform:none}
  .hx-stage{max-width:560px;width:min(100%,560px);margin-top:clamp(48px,12vw,72px)}
  .hx-facts{margin-top:30px}
  .hx-scroll{display:none}
}
@media (max-width:520px){
  .hx h1{font-size:clamp(42px,12.4vw,60px)}
  .hx-cta .btn{flex:1 1 auto}
  .hx-card{left:50%;right:auto;bottom:0;transform:translateX(-50%);width:max-content;max-width:94%}
  .hx-card img{width:52px;height:52px}.hx-card b{font-size:17px}
  .hx-badge{left:0;top:4%}
  .hx-f.m-hide{display:none}
}

/* ticker band below the hero */
.pubmode .ticker{background:var(--gold);color:#3a2800;font-size:13.5px;letter-spacing:.02em}
.pubmode .ticker .tk{gap:44px;padding:11px 0}
.pubmode .ticker .tk span b{color:var(--teal-deep);letter-spacing:.08em}
.pubmode .ticker .tk span::after{content:"✦";margin-left:44px;color:rgba(23,17,15,.4)}

/* ===== signature pizzas ===== */
.sig-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2vw,28px)}
.sig{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px 22px 20px;overflow:hidden;isolation:isolate;transition:transform .5s var(--ease),box-shadow .5s var(--ease)}
.sig::before{content:"";position:absolute;inset:0 0 auto;height:62%;z-index:-1;background:radial-gradient(70% 80% at 50% 70%,color-mix(in srgb,var(--gold) 26%,transparent),transparent 70%)}
.sig-ph{position:relative;width:78%;aspect-ratio:1;margin:6px auto 18px;border-radius:50%;cursor:zoom-in}
.sig-ph img,.sig-ph .pzart{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;box-shadow:0 26px 40px -12px rgba(15,46,54,.45),0 0 0 6px var(--surface);transition:transform .8s var(--ease)}
.sig-ph .pzart{box-shadow:none}
.sig-no{position:absolute;left:22px;top:18px;font-family:var(--display);font-style:italic;font-size:15px;color:var(--muted)}
.sig .ribbon{left:auto;right:16px;top:16px}
.sig h3{font-size:clamp(23px,2vw,28px);line-height:1.1}
.sig p{margin:8px 0 0;color:var(--muted);font-size:14.5px;line-height:1.55;flex:1}
.sig-ft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.sig-ft .from{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.sig-ft .from b{display:block;font-family:var(--display);font-size:24px;color:var(--ink);letter-spacing:0;text-transform:none;font-weight:700;line-height:1.05}
@media (hover:hover){.sig:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg)}.sig:hover .sig-ph img,.sig:hover .sig-ph .pzart{transform:rotate(18deg) scale(1.06)}}
@media (max-width:960px){.sig-grid{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:min(78vw,340px);overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 18px;margin:0 -16px;scrollbar-width:none}.sig{scroll-snap-align:center}}
.hint-swipe{display:none;font-size:13px;color:var(--muted);margin-top:4px}
@media (max-width:960px){.hint-swipe{display:block}}

/* ===== story ===== */
.story{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,96px);align-items:center}
.st-art{position:relative;padding:0 8% 12% 0}
.st-main{position:relative;aspect-ratio:4/5;border-radius:999px 999px 32px 32px;overflow:hidden;box-shadow:var(--shadow-lg)}
.st-main img{width:100%;height:100%;object-fit:cover;transform:scale(1.15);transition:transform 1.6s var(--ease)}
.st-main.in img,.st-main:not(.rv) img{transform:scale(1.02)}
.st-sub{position:absolute;right:0;bottom:0;width:46%;aspect-ratio:1;border-radius:28px;overflow:hidden;border:8px solid var(--bg);box-shadow:var(--shadow-lg)}
.st-sub img{width:100%;height:100%;object-fit:cover}
.st-seal{position:absolute;left:-4%;top:6%;width:clamp(110px,12vw,150px);aspect-ratio:1;border-radius:50%;background:var(--char);color:var(--cream);display:grid;place-items:center;box-shadow:var(--shadow-lg)}
.st-seal svg{position:absolute;inset:0;width:100%;height:100%;animation:hxSpin 30s linear infinite}
.st-seal b{font-family:var(--display);font-style:italic;font-size:clamp(20px,2vw,26px);font-weight:600;color:var(--gold)}
.st-copy h2{font-size:clamp(38px,5.2vw,68px);line-height:1;margin-top:16px}
.st-copy h2 em{color:var(--teal)}
.st-copy p{font-size:17px;line-height:1.7;color:var(--muted);margin:22px 0 0;max-width:52ch}
.st-copy p strong{color:var(--ink)}
.craft{list-style:none;padding:0;margin:30px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.craft li{display:flex;gap:12px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line);font-weight:600}
.craft li span{font-family:var(--display);font-style:italic;color:var(--teal);font-size:15px;min-width:26px}
.st-stats{display:flex;gap:clamp(20px,4vw,48px);flex-wrap:wrap;margin-top:34px}
.st-stats b{display:block;font-family:var(--display);font-size:clamp(30px,3.4vw,44px);font-weight:600;line-height:1}
.st-stats span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,24px);margin-top:clamp(56px,8vw,104px)}
.steps>div{position:relative;padding:26px 24px 24px;border-radius:24px;background:var(--surface);border:1px solid var(--line)}
.steps b{font-family:var(--display);font-style:italic;font-weight:500;font-size:54px;line-height:1;color:var(--teal);display:block;margin-bottom:14px}
.steps h3{font-size:24px}.steps p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
@media (max-width:900px){.story{grid-template-columns:1fr}.st-art{max-width:520px;width:100%;margin:0 auto}.steps{grid-template-columns:1fr}.craft{grid-template-columns:1fr}}
.clipr.rv{opacity:1;transform:none;clip-path:inset(22% 8% 0 8% round 999px 999px 32px 32px);transition:clip-path 1.3s var(--ease)}
.clipr.rv.in{clip-path:inset(0 0 0 0 round 999px 999px 32px 32px)}

/* ===== offers (dark) ===== */
.offers-band .hscroll{grid-auto-columns:minmax(290px,340px);gap:16px;padding-bottom:12px;scrollbar-width:none}
.pubmode .coupon{border-radius:22px;min-height:132px;border-color:var(--line)}
.offers-band .coupon{background:var(--char2);border-color:rgba(255,255,255,.1);color:var(--cream)}
.offers-band .coupon .ct span{color:rgba(255,255,255,.68)}
.offers-band .codechip{border-color:var(--gold);color:var(--gold)}
.offers-band .coupon .ct .chip.ready{background:rgba(184,207,157,.16);color:var(--olive)}
.offers-band .coupon .ct .chip.t{background:rgba(255,255,255,.08);color:rgba(255,255,255,.82)}
.offers-band .coupon .ct .chip.c{background:rgba(242,182,50,.16);color:var(--gold)}
.pubmode .coupon .stub{font-family:var(--display);font-weight:700;border-right-style:dashed}
.pubmode .coupon.k-bogo .stub{background:var(--bad)}
.pubmode .coupon.k-item .stub{background:var(--gold);color:#3a2800}
.pubmode .coupon.k-code .stub{background:#0b3a43;color:var(--gold)}
.pubmode .coupon.k-combo .stub{background:var(--plum)}
.pubmode .coupon .ct b{font-family:var(--display);font-weight:600;font-size:19px}
.combo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;margin-top:clamp(40px,5vw,64px)}
.cmb{position:relative;border-radius:28px;padding:24px;background:linear-gradient(160deg,#0f4a55,#0b3a43);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:12px;overflow:hidden;transition:transform .45s var(--ease),border-color .3s}
.cmb:hover{transform:translateY(-6px);border-color:rgba(242,182,50,.45)}
.cmb .stack{margin-bottom:6px}
.cmb .stack img,.cmb .stack .pzs{width:64px;height:64px;border-color:#0f4a55}
.cmb h3{font-size:26px}
.cmb p{margin:0;color:rgba(255,255,255,.66);font-size:14.5px;flex:1}
.cmb-ft{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cmb-ft .price{font-family:var(--display);font-size:32px;color:var(--gold);font-weight:700}
.cmb-ft s{color:rgba(255,255,255,.45)}
.cmb-ft .btn{margin-left:auto}
.cmb .save{position:absolute;right:18px;top:18px;background:rgba(184,207,157,.14);color:var(--olive);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.coins-x{margin-top:clamp(40px,5vw,64px);border-radius:28px;padding:clamp(20px,3vw,32px);display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:linear-gradient(110deg,rgba(242,182,50,.16),rgba(242,182,50,.03) 60%);border:1px solid rgba(242,182,50,.25)}
.coins-x h3{font-size:clamp(24px,2.6vw,32px)}
.coins-x .coin{width:64px;height:64px;font-size:26px;animation:pop 3s ease-in-out infinite}
.coins-x .btn{background:transparent;border-color:rgba(255,255,255,.3);color:var(--cream)}

/* ===== favourites and categories ===== */
.fav{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.fav-i{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;padding:12px;border-radius:22px;background:var(--surface);border:1px solid var(--line);transition:transform .35s var(--ease),box-shadow .35s}
.fav-i:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.fav-i .ph{position:relative;width:84px;height:84px;border-radius:16px;overflow:hidden;background:var(--surface2);cursor:zoom-in}
.fav-i .ph img{width:100%;height:100%;object-fit:cover}
.fav-i h3{font-size:19px;line-height:1.15}
.fav-i .price{font-size:17px;color:var(--teal);font-family:var(--display)}
.cats-x{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(46%,190px),1fr));gap:14px}
.cat-t{position:relative;overflow:hidden;border-radius:24px;border:0;padding:0;aspect-ratio:4/5;background:var(--char2);color:var(--cream);text-align:left;cursor:pointer;isolation:isolate}
.cat-t img,.cat-t .pzart,.cat-t .pz{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform .9s var(--ease)}
.cat-t .pzart,.cat-t .pz{inset:12%;width:76%;height:66%}
.cat-t::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 35%,rgba(6,20,24,.9))}
.cat-t .cl{position:absolute;left:18px;right:18px;bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.cat-t b{font-family:var(--display);font-size:clamp(20px,2vw,26px);font-weight:600;line-height:1.05}
.cat-t small{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap}
.cat-t .gu{display:block;font-size:13px;color:var(--gold);font-weight:600}
.cat-t:hover img,.cat-t:hover .pzart{transform:scale(1.07)}

/* ===== counter classics (the shop poster's list) ===== */
.counter-x{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.cx{border-radius:24px;padding:22px;background:var(--surface);border:1px solid var(--line)}
.cx h3{font-size:21px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.cx h3 b{font-size:28px;color:var(--teal);font-weight:700}
.cx h3 b small{font-size:13px;font-family:var(--body);color:var(--muted);margin-left:2px}
.cx p{margin:6px 0 0;color:var(--muted);font-size:14px}
.cx ul{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.cx li{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.cx.bev li{display:flex;gap:8px}
.phone-steps{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center;font-weight:600;color:var(--muted);font-size:14px}
.phone-steps span{background:var(--surface2);border-radius:999px;padding:6px 14px;color:var(--ink)}

/* ===== final CTA ===== */
.cta-x{text-align:center;overflow:hidden}
.cta-x h2{font-size:clamp(52px,10vw,150px);line-height:.88;letter-spacing:-.035em}
.cta-x h2 em{color:var(--gold)}
.cta-x p{max-width:52ch;margin:24px auto 0;color:rgba(255,255,255,.7);font-size:17px}
.cta-x .hx-cta{justify-content:center}
.cta-x .btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.cta-x .ring{position:absolute;left:50%;top:50%;width:min(1100px,150vw);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.06);z-index:0;pointer-events:none}
.cta-x .ring.r2{width:min(760px,110vw)}
.cta-x .sx-in{position:relative;z-index:1}
.avail{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:34px}
.avail span{border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 14px;font-size:13px;color:rgba(255,255,255,.8);font-weight:600}

/* ===== footer ===== */
.sfoot{background:#082a31;color:var(--cream);padding:clamp(56px,7vw,88px) 0 calc(28px + env(safe-area-inset-bottom,0px))}
.ft-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:clamp(24px,4vw,56px)}
.sfoot h3{font-family:var(--body);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:700;margin-bottom:14px}
.sfoot p,.sfoot li{color:rgba(255,255,255,.72);font-size:14.5px;line-height:1.65}
.sfoot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.sfoot a,.ft-link{color:var(--cream);text-decoration:none;background:none;border:0;padding:3px 0;font:inherit;text-align:left;cursor:pointer;opacity:.85;transition:opacity .2s,color .2s}
.sfoot a:hover,.ft-link:hover{opacity:1;color:var(--gold)}
.ft-brand .bp-word i{font-size:40px}.ft-brand .bp-word b{font-size:12px}
.ft-brand p{max-width:34ch;margin-top:14px}
.ft-out{padding:12px 0;border-top:1px solid rgba(255,255,255,.08)}
.ft-out b{display:block;color:var(--cream)}
.ft-out .btn{margin-top:8px;color:var(--cream);border-color:rgba(255,255,255,.25);background:transparent}
.ft-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:clamp(40px,5vw,64px);padding-top:22px;border-top:1px solid rgba(255,255,255,.08);font-size:13px;color:rgba(255,255,255,.5)}
.ft-big{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(64px,17vw,250px);line-height:.8;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.12);text-align:center;margin-top:clamp(40px,6vw,72px);user-select:none;white-space:nowrap;overflow:hidden}
@media (max-width:900px){.ft-grid{grid-template-columns:1fr 1fr}.ft-brand{grid-column:1/-1}}
@media (max-width:520px){.ft-grid{grid-template-columns:1fr}}
@media (max-width:720px){.pubmode .sfoot{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}}

/* ===== menu page ===== */
.mhead{background:var(--char);color:var(--cream);position:relative;overflow:hidden;isolation:isolate}
.mhead::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(50% 120% at 90% 0,rgba(60,186,208,.35),transparent 70%),radial-gradient(40% 90% at 0 100%,rgba(242,182,50,.14),transparent 70%)}
.mhead .sx-in{padding-top:clamp(40px,6vw,80px);padding-bottom:clamp(36px,5vw,64px);display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.mhead h1{font-size:clamp(52px,9vw,128px);line-height:.88;letter-spacing:-.03em;margin-top:14px}
.mhead h1 em{color:var(--gold)}
.mhead p{margin:16px 0 0;color:rgba(255,255,255,.7);max-width:46ch;font-size:16.5px}
.mhead .pz-spin{width:clamp(150px,19vw,250px);aspect-ratio:1;margin-left:auto;animation:hxSpin 120s linear infinite;flex:none;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.mhead .pz-spin svg{width:100%;height:100%;display:block}
.mhead .hx-badge{flex:none}
.pubmode main.pub{max-width:1240px;padding-inline:clamp(16px,4vw,32px)}
.pubmode .pub .sec-h{margin:clamp(40px,5vw,64px) 0 18px;align-items:baseline}
.pubmode .pub .sec-h h2{font-size:clamp(32px,4vw,48px);font-weight:700}
.pubmode .outlet-bar{border-radius:20px;margin-top:24px}
.pubmode .coins-band{border-radius:24px;background:linear-gradient(120deg,var(--cheese-soft),var(--surface) 80%)}
.pubmode .filters .inp{border-radius:999px;padding:10px 18px;max-width:300px;background:var(--surface)}
.pubmode .filters button{padding:8px 14px}
.pubmode .filters button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.pubmode .cats{top:var(--toph,64px);padding-block:12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pubmode .cats button{padding:9px 18px;font-weight:700;transition:background .2s,color .2s}
.pubmode .pub .grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.pubmode .pub .item{border-radius:24px;border-color:var(--line);background:var(--surface);box-shadow:none}
.pubmode .pub .item .ph{aspect-ratio:5/4;background:radial-gradient(circle at 50% 55%,var(--surface) 0 38%,var(--surface2) 78%)}
.pubmode .pub .item .ph img{transition:transform .9s var(--ease)}
.pubmode .pub .item h3{font-size:21px;font-weight:600}
.pubmode .pub .item .bd{padding:16px 18px 18px;gap:8px}
.pubmode .pub .item .desc{font-size:14px;line-height:1.5}
.pubmode .sizes span{border-radius:999px;padding:2px 10px;background:var(--surface2);border-color:transparent}
.pubmode .sizes span b{font-family:var(--display);font-weight:700}
.pubmode .price{font-weight:700}
.pubmode .ribbon span{border-radius:999px;background:var(--char);color:var(--gold);letter-spacing:.08em;padding:3px 10px;box-shadow:none}
.pubmode .ribbon span.o{background:var(--red);color:#fff}
@media (hover:hover){.pubmode .pub .item:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}.pubmode .pub .item:hover .ph img{transform:scale(1.08) rotate(2deg)}}
.pubmode .combo-card{border-radius:24px}
.pubmode .pub .how{display:none}
@media (max-width:720px){
  .pubmode .pub .item{flex-direction:row}
  .pubmode .pub .item .ph{aspect-ratio:auto}
  .pubmode .pub .item h3{font-size:18px}
  .mhead .pz-spin{display:none}
}

/* ===== modals, account and sign-in, recoloured ===== */
.pubmode .scrim{background:rgba(6,20,24,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.pubmode .modal{border-radius:28px}
.pubmode .modal .mh h3{font-weight:700;font-size:26px}
.pubmode .modal:focus{outline:none}
.pubmode .opt,.pubmode .paymodes button,.pubmode .types button,.pubmode .vt button{border-radius:14px}
.pubmode .qty{border-radius:999px}
.pubmode .qty button{width:34px;height:34px}
.pubmode .tot{font-weight:700}
.pubmode .inp{border-radius:12px}
/* Header, hero and phone tabs in the shop's light blue and white */
.pubmode .top{background:color-mix(in srgb,var(--surface) 92%,transparent);color:var(--ink);border-bottom:1px solid var(--line)}
.pubmode.scrolled .top{background:color-mix(in srgb,var(--surface) 97%,transparent);box-shadow:0 8px 24px rgba(15,46,54,.08)}
.pubmode .brand-pub{color:var(--teal-deep)}
.pubmode .bp-word b{color:var(--teal)}
#pubLinks button{color:var(--muted)}
#pubLinks button:hover,#pubLinks button[aria-current="page"]{color:var(--teal-deep)}
#pubLinks button::after{background:var(--teal)}
.pubmode #outletSel,.pubmode #acct .btn,.pubmode #cartBtn,.pubmode #menuBtn{background:var(--surface2);border-color:var(--line);color:var(--ink)}
.pubmode #acct .btn.pri{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
#cartBtn:hover{background:var(--teal-soft)}
.cartn{background:var(--bad);border-color:var(--surface)}
.pubmode .hdr-order{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}
.hx{background:var(--bg);color:var(--ink)}
.hx::before{background:radial-gradient(50% 55% at 72% 50%,rgba(242,182,50,.30),transparent 70%),radial-gradient(70% 80% at 80% 30%,color-mix(in srgb,var(--teal) 24%,transparent),transparent 70%),linear-gradient(180deg,var(--teal-soft),var(--bg) 75%)}
.hx::after{display:none}
.hx .kick,.hx-copy .kick{color:var(--teal-deep)}
.hx h1 em{color:var(--teal)}
.hx-sub{color:var(--muted)}
.hx-facts{border-top-color:var(--line)}.hx-facts span{color:var(--muted)}
.hx .btn.ghost{color:var(--ink);border-color:var(--line);background:var(--surface)}
.hx .btn.ghost:hover{border-color:var(--teal)}
.hx-cta .btn.pri{background:var(--teal-deep);border-color:var(--teal-deep)}
.hx-glow{background:radial-gradient(circle,rgba(242,182,50,.4),transparent 62%)}
.hx-plate{background:radial-gradient(circle at 50% 42%,#ffffff 0 58%,#e3f0f2 74%,#c9e2e7 100%);box-shadow:0 0 0 1px rgba(15,46,54,.06),0 50px 70px rgba(15,46,54,.22)}
.hx-f svg{filter:drop-shadow(0 14px 14px rgba(15,46,54,.22))}
.hx-steam{display:none}
.hx-card{background:color-mix(in srgb,var(--surface) 92%,transparent);border-color:var(--line);color:var(--ink);box-shadow:var(--shadow-lg)}
.hx-card span{color:var(--muted)}.hx-card small{color:var(--teal-deep)}
.hx-scroll{color:var(--muted)}.hx-scroll i{background:linear-gradient(var(--teal),transparent)}
@media (max-width:720px){
  .pubnav{background:color-mix(in srgb,var(--surface) 94%,transparent)!important;border-top-color:var(--line)!important;box-shadow:0 -8px 24px rgba(15,46,54,.08)!important}
  .pubnav button{color:var(--muted)!important}
  .pubnav button[aria-current="page"]{color:var(--teal)!important}
  .pubnav button[aria-current="page"]::after{background:var(--teal)!important}
  .pubmode .cartbar{background:var(--teal-deep)!important}
}

/* ===== Home page only: background effects and scroll scenes =====
   JS sets --p (0→1 as a section passes through the screen) on [data-sx] elements, --sp on the hero
   and --sy (page scroll) on the background layer; the rules below turn those into motion.
   Individual translate/rotate/scale properties are used so they never fight hover transforms. */
.home{position:relative;isolation:isolate}
.home-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' fill='none' stroke='%231a93a8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' opacity='.09'><path d='M30 40l36-12-8 40z'/><circle cx='46' cy='38' r='3'/><circle cx='54' cy='50' r='2.5'/><path d='M150 30c14 8 14 28 0 38c-14-10-14-30 0-38z'/><path d='M150 34v30'/><circle cx='70' cy='160' r='14'/><circle cx='70' cy='160' r='5'/><path d='M160 150q14-14 28 0'/><circle cx='120' cy='110' r='6'/></svg>");
  background-size:220px 220px;background-position:0 calc(var(--sy,0) * -0.12px)}
.home-bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:blob 26s ease-in-out infinite alternate}
.home-bg .b1{width:46vw;height:46vw;left:-12vw;top:20vh;background:color-mix(in srgb,var(--teal) 30%,transparent)}
.home-bg .b2{width:38vw;height:38vw;right:-10vw;top:50vh;background:rgba(242,182,50,.32);animation-duration:32s;animation-delay:-9s}
.home-bg .b3{width:30vw;height:30vw;left:35vw;bottom:-12vh;background:color-mix(in srgb,var(--teal) 18%,transparent);animation-duration:38s;animation-delay:-18s}
@keyframes blob{0%{translate:0 0;scale:1}50%{translate:6vw -8vh;scale:1.15}100%{translate:-5vw 6vh;scale:.92}}

/* hero: giant brand word behind the pizza, letters drift apart on scroll */
.hx-word{position:absolute;left:0;right:0;top:54%;translate:0 -50%;z-index:0;display:flex;justify-content:center;pointer-events:none;font-family:var(--display);font-weight:800;font-size:clamp(120px,27vw,430px);line-height:.8;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--teal) 34%,transparent)}
.hx-word span{display:inline-block;translate:0 calc(var(--sp,0) * var(--k) * 1px);rotate:calc(var(--sp,0) * var(--r) * 1deg)}
.hx-word span:nth-child(odd){color:color-mix(in srgb,var(--teal) 11%,transparent)}
.hx.enter .hx-word span{animation:wordIn 1.2s var(--ease) both;animation-delay:calc(var(--j) * 70ms + .2s)}
@keyframes wordIn{from{opacity:0;transform:translateY(40%) scale(.8)}to{opacity:1;transform:none}}
.hx-in{position:relative;z-index:1}
@media (max-width:900px){.hx-word{top:auto;bottom:24%;translate:none}}

/* crossing marquee ribbons: they drift on their own and slide further with the scroll */
.ribbons{position:relative;height:clamp(150px,16vw,210px);overflow:hidden;margin:-30px 0;z-index:2;pointer-events:none}
.rb{position:absolute;left:-10%;right:-10%;top:50%;pointer-events:auto}
.rb.a{rotate:-3.5deg;translate:0 -70%}
.rb.b{rotate:3deg;translate:0 -10%}
.rb.a .ticker{box-shadow:0 12px 30px rgba(15,46,54,.16)}
.rb.b .ticker{background:var(--teal-deep);color:#fff;box-shadow:0 12px 30px rgba(15,46,54,.2)}
.rb .ticker .tk{translate:var(--mq,0) 0;animation-name:tickQ;padding:16px 0;padding-left:0;font-size:clamp(14px,1.4vw,18px);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.rb.b .tk{animation-direction:reverse}
.rb.b .tk span::after{color:rgba(255,255,255,.5)!important}
.rb.b .tk b{color:var(--gold)!important}

/* moving wavy edges on the deep teal bands */
.home .offers-band,.home .cta-x{overflow-x:clip;overflow-y:visible}
.home .offers-band::before,.home .offers-band::after,.home .cta-x::before{content:"";position:absolute;left:0;right:0;height:34px;background:var(--char);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='34'><path d='M0 34V17C27 3 53 3 80 17S133 31 160 17V34z'/></svg>") 0 0/160px 34px repeat-x;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='34'><path d='M0 34V17C27 3 53 3 80 17S133 31 160 17V34z'/></svg>") 0 0/160px 34px repeat-x;animation:wave 9s linear infinite}
.home .offers-band::before,.home .cta-x::before{top:-33px}
.home .offers-band::after{bottom:-33px;rotate:180deg;animation-direction:reverse}
@keyframes tickQ{to{transform:translateX(-25%)}}
@keyframes wave{to{-webkit-mask-position:160px 0;mask-position:160px 0}}

/* headings: words slide up out of a mask when the section arrives */
.home .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.home .w>span{display:inline-block;transition:transform 1s var(--ease);transition-delay:calc(var(--i) * 70ms)}
.home .rv:not(.in) .w>span,.home h2.rv:not(.in) .w>span{transform:translateY(110%)}

/* story: paragraphs fill in word by word, photos drift at different speeds */
.fw{opacity:clamp(.18,calc(var(--p,1) * var(--n) * 1.7 - var(--i)),1);transition:opacity .2s}
.home .st-art .st-main{translate:0 calc((var(--p,.5) - .5) * -50px)}
.home .st-art .st-sub{translate:0 calc((var(--p,.5) - .5) * -140px)}
.home .st-art .st-seal{rotate:calc(var(--p,.5) * 220deg)}
.home .st-seal svg{animation:none}

/* signature cards fan in, then settle */
.sig-grid .sig{translate:0 calc((1 - min(1,var(--p,1) * 2.2)) * var(--ty,0px));rotate:calc((1 - min(1,var(--p,1) * 2.2)) * var(--rt,0deg))}
.sig-grid .sig:nth-child(3n+1){--rt:-7deg;--ty:60px}.sig-grid .sig:nth-child(3n+2){--ty:110px}.sig-grid .sig:nth-child(3n){--rt:7deg;--ty:60px}
@media (max-width:960px){.sig-grid .sig{--rt:0deg!important;--ty:0px!important}}
.cat-t.rv{rotate:5deg;transition:opacity .6s ease var(--d,0ms),transform .7s var(--ease) var(--d,0ms),rotate .9s var(--ease) var(--d,0ms)}
.cat-t.rv.in{rotate:0deg}
.home .cmb.rv{rotate:-3deg;transition:opacity .6s ease var(--d,0ms),transform .7s var(--ease) var(--d,0ms),rotate .9s var(--ease) var(--d,0ms)}
.home .cmb.rv.in{rotate:0deg}
.sfoot .ft-big{translate:calc((var(--p,.5) - .5) * -40%) 0}

/* pinned scene: the pizza is built, baked and sent out as you scroll through the three steps */
.bx{position:relative;height:780vh}
.bx-pin{position:sticky;top:var(--toph,64px);height:calc(100vh - var(--toph,64px));display:grid;align-items:center;overflow:hidden}
.bx-in{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,5vw,72px);align-items:center;width:100%}
.bx-copy h2{font-size:clamp(34px,4.6vw,60px);line-height:1;margin:14px 0 26px}
.bx-copy h2 em{color:var(--teal)}
.bx-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.bx-steps li{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line);opacity:.35;transition:opacity .4s,translate .5s var(--ease);translate:0 0}
.bx-steps li b{font-family:var(--display);font-style:italic;font-size:clamp(30px,3vw,42px);color:var(--teal);line-height:1;font-weight:500}
.bx-steps li h3{font-size:clamp(22px,2.2vw,30px)}
.bx-steps li p{margin:4px 0 0;color:var(--muted);max-height:0;overflow:hidden;transition:max-height .5s var(--ease)}
.bx[data-step="0"] li[data-i="0"],.bx[data-step="1"] li[data-i="1"],.bx[data-step="2"] li[data-i="2"],.bx[data-step="3"] li[data-i="3"],.bx[data-step="4"] li[data-i="4"],.bx[data-step="5"] li[data-i="5"],.bx[data-step="6"] li[data-i="6"],.bx[data-step="7"] li[data-i="7"],.bx[data-step="8"] li[data-i="8"],.bx[data-step="9"] li[data-i="9"]{opacity:1;translate:12px 0}
.bx[data-step="0"] li[data-i="0"] p,.bx[data-step="1"] li[data-i="1"] p,.bx[data-step="2"] li[data-i="2"] p,.bx[data-step="3"] li[data-i="3"] p,.bx[data-step="4"] li[data-i="4"] p,.bx[data-step="5"] li[data-i="5"] p,.bx[data-step="6"] li[data-i="6"] p,.bx[data-step="7"] li[data-i="7"] p,.bx[data-step="8"] li[data-i="8"] p,.bx[data-step="9"] li[data-i="9"] p{max-height:80px}
.bx-bar{height:3px;border-radius:3px;background:var(--line);margin-top:22px;overflow:hidden}
.bx-bar i{display:block;height:100%;background:var(--teal);transform-origin:left;scale:var(--p,0) 1}
.bx-stage{position:relative;aspect-ratio:1;width:min(100%,560px);justify-self:center}
.bx-plate{position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle at 50% 42%,#fff 0 58%,#e3f0f2 74%,#c9e2e7 100%);box-shadow:0 40px 60px rgba(15,46,54,.18);opacity:calc(1 - var(--sl,0));scale:calc(1 - var(--sl,0) * .3)}
.bx-pz{position:absolute;inset:8%;z-index:2;translate:calc(var(--sl,0) * -40% + var(--d,0) * 70%) calc(var(--sl,0) * -40% - var(--d,0) * 6%);scale:calc(1 - var(--sl,0) * .64 - var(--d,0) * .1);rotate:calc(var(--q,0) * 120deg);filter:drop-shadow(0 calc(var(--sl,0) * 18px) calc(var(--sl,0) * 20px) rgba(0,0,0,.35))}
.bx-pz>div{position:absolute;border-radius:50%}
/* real build: photo layers that arrive one by one as the page scrolls */
.bx-l{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}
.bx-dough{scale:calc(.4 + clamp(0,var(--q,0) * 9,1) * .6);opacity:clamp(0,var(--q,0) * 9,1)}
.bx-sauce{scale:calc(.25 + clamp(0,(var(--q,0) - .15) * 9,1) * .75);opacity:clamp(0,(var(--q,0) - .15) * 12,1);rotate:calc(clamp(0,(var(--q,0) - .15) * 9,1) * 160deg)}
.bx-cheese{opacity:clamp(0,(var(--q,0) - .31) * 9,1);scale:calc(1.25 - clamp(0,(var(--q,0) - .31) * 9,1) * .25);filter:drop-shadow(0 2px 2px rgba(80,40,0,.25))}
.bx-toppings{-webkit-mask-image:conic-gradient(#000 calc(clamp(0,(var(--q,0) - .47) * 6.5,1) * 360deg),transparent 0);mask-image:conic-gradient(#000 calc(clamp(0,(var(--q,0) - .47) * 6.5,1) * 360deg),transparent 0);filter:saturate(.85) brightness(1.06)}
.bx-baked{opacity:clamp(0,(var(--q,0) - .66) * 7,1);border-radius:50%}
.bx-heat{position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,rgba(242,140,40,.45),transparent 65%);opacity:calc(clamp(0,(var(--q,0) - .63) * 6,1) - clamp(0,(var(--q,0) - .84) * 8,1) - var(--sl,0));animation:heat 1.4s ease-in-out infinite alternate}
@keyframes heat{to{scale:1.08}}
/* the garlic bread: a slate board slides in, then butter, herbs and the oven arrive as the page scrolls */
.bx-gb{position:absolute;inset:20% 0 14%;z-index:1;translate:calc((1 - clamp(0,var(--g,0) * 7,1)) * 115% + var(--d,0) * 30%) calc(var(--d,0) * -30%);scale:calc(1 - var(--d,0) * .5);opacity:clamp(0,var(--g,0) * 7,1)}
.bx-board{position:absolute;inset:0 0;border-radius:22px;background:linear-gradient(160deg,#4a4a48,#262624 60%,#1b1b1a);box-shadow:0 40px 60px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.12);rotate:-5deg}
.bx-g{position:absolute;left:7%;top:50%;width:86%;height:auto;translate:0 -50%;rotate:-5deg;user-select:none;filter:drop-shadow(0 10px 10px rgba(0,0,0,.35))}
/* like a burger build: the dough drops onto the board, then the butter and the cheese fall onto it, land and melt in */
.bx-g-dough{translate:0 calc(-50% - (1 - clamp(0,(var(--g,0) - .06) * 9,1)) * 160%);opacity:clamp(0,(var(--g,0) - .06) * 12,1)}
.bx-g-butter{-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 calc(clamp(0,(var(--g,0) - .3) * 7,1) * 72%),transparent calc(clamp(0,(var(--g,0) - .3) * 7,1) * 72% + 8%));mask-image:radial-gradient(ellipse at 50% 50%,#000 calc(clamp(0,(var(--g,0) - .3) * 7,1) * 72%),transparent calc(clamp(0,(var(--g,0) - .3) * 7,1) * 72% + 8%))}
.bx-g-cheese{opacity:clamp(0,(var(--g,0) - .56) * 9,1);scale:calc(1.05 - clamp(0,(var(--g,0) - .56) * 9,1) * .05)}
.bx-drop{position:absolute;left:50%;top:22%;height:auto;z-index:2;user-select:none;filter:drop-shadow(0 16px 14px rgba(0,0,0,.35))}
.bx-drop-butter{width:46%;translate:-50% calc((1 - clamp(0,(var(--g,0) - .16) * 7,1)) * -320%);opacity:calc(clamp(0,(var(--g,0) - .14) * 14,1) - clamp(0,(var(--g,0) - .32) * 9,1));scale:calc(1 - clamp(0,(var(--g,0) - .3) * 9,1) * .4) calc(1 - clamp(0,(var(--g,0) - .3) * 9,1) * .7)}
.bx-drop-cheese{width:54%;top:8%;translate:-50% calc((1 - clamp(0,(var(--g,0) - .42) * 7,1)) * -300%);opacity:calc(clamp(0,(var(--g,0) - .4) * 14,1) - clamp(0,(var(--g,0) - .58) * 9,1));scale:calc(1 + clamp(0,(var(--g,0) - .56) * 9,1) * .9) calc(1 - clamp(0,(var(--g,0) - .56) * 9,1) * .6)}
.bx-g-baked{opacity:clamp(0,(var(--g,0) - .7) * 6,1)}
.bx-heat2{position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(242,140,40,.5),transparent 62%);opacity:calc(clamp(0,(var(--g,0) - .62) * 6,1) - clamp(0,(var(--g,0) - .86) * 8,1));animation:heat 1.4s ease-in-out infinite alternate}
.bx-lists{display:grid}
.bx-list{grid-area:1/1;transition:opacity .5s,translate .6s var(--ease)}
.bx-list.b{opacity:0;translate:0 40px;pointer-events:none}
.bx[data-ph="1"] .bx-list.a{opacity:0;translate:0 -40px;pointer-events:none}
.bx[data-ph="1"] .bx-list.b{opacity:1;translate:0 0;pointer-events:auto}
.bx-sub{display:inline-block;font-family:"Courgette",cursive;font-size:clamp(22px,2vw,28px);color:var(--gold,#F2B632);rotate:-3deg;margin-bottom:6px}
.bx-steam{position:absolute;left:44%;top:6%;width:12%;height:34%;z-index:3;opacity:calc(clamp(0,(var(--q,0) - .7) * 6,1) - var(--sl,0) + clamp(0,(var(--g,0) - .75) * 6,1) - var(--d,0) * 3)}
.bx-steam i{position:absolute;bottom:0;left:var(--l);width:26px;height:110px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.95),transparent);filter:blur(6px);animation:hxSteam 3.6s ease-in infinite;animation-delay:var(--dl)}
.bx-route{position:absolute;inset:0;z-index:3;opacity:clamp(0,var(--d,0) * 3,1)}
.bx-route svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.bx-route path{stroke-dasharray:8 10;stroke-dashoffset:calc(var(--d,0) * -400)}
.bx-pin-ic{position:absolute;right:2%;top:8%;font-size:clamp(34px,4vw,52px);animation:pinB 1s ease-in-out infinite alternate}
@keyframes pinB{to{translate:0 -10px}}
@media (max-width:900px){
  .bx{height:720vh}
  .bx-steps li h3{font-size:19px}.bx-steps{gap:0}
  .bx-in{grid-template-columns:1fr;gap:12px}
  .bx-stage{order:-1;width:min(78vw,46vh)}
  .bx-copy h2{margin:8px 0 10px}
  .bx-steps li{padding:8px 0}
  .bx-steps li p{font-size:14px}
}
@media (prefers-reduced-motion:reduce){
  .home-bg i{animation:none}
  .bx{height:auto}.bx-pin{position:static;height:auto;padding:64px 0}
  .bx-drop{display:none}
  .bx{--p:.6;--q:1;--sl:1;--g:1;--d:0}.bx-steps li{opacity:1;translate:none}.bx-steps li p{max-height:none}
  .bx-list{grid-area:auto}.bx-list.b,.bx-list.a{opacity:1;translate:none}
  .home .rv:not(.in) .w>span{transform:none}
  .fw{opacity:1}
}

/* ===== Home page, part 2: smooth scroll, horizontal gallery, colour scenes, names wall, cursor ===== */
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}

/* Signature pizzas: the section pins and the cards slide sideways as you scroll down */
.hg{padding:0}
.hg-pin{position:relative;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,2.6vh,30px);padding:clamp(64px,9vw,128px) 0;overflow:hidden}
.hg.on .hg-pin{position:sticky;top:var(--toph,64px);height:calc(100vh - var(--toph,64px));padding:0}
.hg .sx-h{margin-bottom:0;position:relative;z-index:1}
.hg-track{position:relative;z-index:1}
.hg .sig-grid{display:flex;grid-template-columns:none;width:max-content;max-width:none;gap:clamp(16px,2vw,28px);padding:12px clamp(16px,4vw,32px) 30px;margin:0;overflow:visible}
.hg.on .sig-grid{translate:calc(var(--p,0) * var(--dist,0px) * -1) 0}
.hg:not(.on) .hg-track{overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory}
.hg:not(.on) .sig{scroll-snap-align:center}
.hg .sig-grid .sig{width:clamp(270px,25vw,350px);flex:none;translate:none;rotate:var(--tilt,0deg);transition:rotate .5s var(--ease),transform .5s var(--ease),box-shadow .5s var(--ease)}
.hg .sig-grid .sig:nth-child(odd){--tilt:-2.5deg}
.hg .sig-grid .sig:nth-child(even){--tilt:2deg;margin-top:22px}
.hg .sig-grid .sig:hover{rotate:0deg}
.hg .sig{padding:16px 18px 16px}
.hg .sig-ph{width:50%;margin:4px auto 10px}
.hg .sig h3{font-size:clamp(20px,1.7vw,24px)}
.hg .sig-ft{margin-top:12px;padding-top:12px}
.hg .sig p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:none}
.hg .sig-no{z-index:2;font-size:clamp(24px,2.2vw,34px);font-style:italic;color:var(--teal);top:10px;font-weight:600}
.hg-word{position:absolute;left:0;top:56%;z-index:0;white-space:nowrap;pointer-events:none;font-family:var(--display);font-weight:800;font-style:italic;font-size:clamp(110px,21vw,330px);line-height:.8;letter-spacing:-.03em;color:transparent;-webkit-text-stroke:2px color-mix(in srgb,var(--teal) 22%,transparent);translate:calc(var(--p,0) * 40vw - 20vw) -50%}
.hg-foot{display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:relative;z-index:1}
.hg-prog{flex:1;max-width:340px;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.hg-prog i{display:block;height:100%;background:var(--teal);transform-origin:left;scale:var(--p,0) 1}
.hg:not(.on) .hg-prog{display:none}
.hg.on .hint-swipe{display:none}

/* Bold colour scenes in the shop palette, with moving wavy tops */
.home .bx{background:var(--teal-deep);color:#fff;--wc:var(--teal-deep)}
.home .bx .kick{color:var(--gold)}
.home .bx-copy h2 em{color:var(--gold)}
.home .bx-steps li{border-top-color:rgba(255,255,255,.18)}
.home .bx-steps li b{color:var(--gold)}
.home .bx-steps li p{color:rgba(255,255,255,.78)}
.home .bx-bar{background:rgba(255,255,255,.2)}.home .bx-bar i{background:var(--gold)}
.home .bx-plate{box-shadow:0 40px 70px rgba(0,0,0,.3)}
.home .bx-route path{stroke:#fff}
.home #counter{background:var(--cheese);color:#3a2800;--wc:var(--cheese)}
.home #counter .kick,.home #counter .sx-h p,.home #counter .small,.home #counter .phone-steps{color:#5a3d00}
.home #counter .sx-h h2 em{color:var(--teal-deep)}
.home #counter .phone-steps span{background:rgba(255,255,255,.6)}
.home #counter .cx{border-color:transparent;box-shadow:0 10px 30px rgba(90,61,0,.15)}
.home .bx::before,.home #counter::before{content:"";position:absolute;left:0;right:0;top:-33px;height:34px;z-index:2;background:var(--wc);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='34'><path d='M0 34V17C27 3 53 3 80 17S133 31 160 17V34z'/></svg>") 0 0/160px 34px repeat-x;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='34'><path d='M0 34V17C27 3 53 3 80 17S133 31 160 17V34z'/></svg>") 0 0/160px 34px repeat-x;animation:wave 9s linear infinite}
.home #counter{position:relative}

/* Names wall: the pizza names slide past in rows behind "Hungry yet?" */
.names{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,2vw,24px);pointer-events:none;opacity:.2}
.nr{display:flex;gap:clamp(24px,3vw,48px);white-space:nowrap;width:max-content;font-family:var(--display);font-weight:800;font-size:clamp(44px,7.5vw,118px);line-height:1;letter-spacing:-.02em;color:#fff;translate:var(--mq,0) 0}
.nr:nth-child(1){rotate:-4deg}
.nr:nth-child(2){rotate:2deg;font-style:italic;color:transparent;-webkit-text-stroke:1.5px #fff}
.nr:nth-child(3){rotate:-2deg;color:var(--gold)}

// Letters of the name rise one by one; in the apps the intro stays about 6 s, then fades out
// once the app has loaded (introDone), or after 10 s at most. A tap skips it.
// On the website it is only a loading screen: it goes as soon as the shop has loaded.
(function(){
  const el=document.getElementById('intro'),h=el.querySelector('h1'),t0=Date.now();let gone=false;
  const web=!/CheesyApp\//.test(navigator.userAgent);
  if(web){el.classList.add('web');el.insertAdjacentHTML('afterbegin','<div class="stripes" aria-hidden="true">'+['#082a31','#0f6f80','#1a93a8','#5cc3d3','#f2b632'].map((c,k)=>'<i style="--c:'+c+';--k:'+k+'"></i>').join('')+'</div>');

  [...'CHEESY PIZZA'].forEach((c,i)=>{const s=document.createElement('span');if(c===' ')s.className='sp';else s.textContent=c;if(i>6)s.classList.add('in-pz');s.style.animationDelay=((web?.15:3.3)+i*.05)+'s';h.appendChild(s)});
  const hide=()=>{if(gone)return;gone=true;el.classList.add('out');setTimeout(()=>el.remove(),web?1300:600)};
  window.introDone=()=>setTimeout(hide,Math.max(0,(web?1500:6000)-(Date.now()-t0)));
  el.addEventListener('click',()=>{if(Date.now()-t0>800)hide()});
  setTimeout(hide,10000);
})();
</script>

<script>

const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* Lookup lists and settings come from the database (see applyConfig) */

let PREP_MIN=15,RIDE_MIN=20,COIN_RATE=0.05,OPEN_H=12,CLOSE_H=22;
function applyConfig(c){

  COOK=c.cookNotes||[];ORDER_CHIPS=c.orderChips||[];SEGS=c.wheel||[];

  // Older databases don't have these yet

let WAITS=[15,20,30,40];
const COUNTER_MODES=['cash','upi','card','bank'];
// Extra choices for non-pizza items (owners can change them per item on the Menu screen)
const ITEM_OPTS={pockets:['Spicy','No spicy','Less paneer','Less onion','Less capsicum'],bread:['Spicy','No spicy','Less onion','Extra crispy']};
const itemOpts=m=>m.options||ITEM_OPTS[m.cat]||[];
