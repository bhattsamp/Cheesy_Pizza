const extraMenus=m=>(S.extras||[]).filter(g=>g.active!==false&&(!Array.isArray(g.pizzas)||g.pizzas.includes(m.id)));
function exPrice(e,size){const g=(S.extras||[]).find(x=>x.id===e.g);if(!g)return 0;const it=g.items.find(i=>i.name===e.n)||(e.c?g.items.find(i=>+i.prices?.[size]):null);return +(it?.prices?.[size]||0)}
const exText=ex=>topsText((ex||[]).map(e=>e.n));
const SIZE_COLS=['#1a93a8','#0f2e36','#6b4fd0','#b76a00','#d23f35'];
const sizeColor=id=>{const i=S.sizes.findIndex(s=>s.id===id);return (S.sizes[i]||{}).color||SIZE_COLS[Math.max(0,i)%SIZE_COLS.length]};
const topsText=t=>{const c={};(t||[]).forEach(x=>c[x]=(c[x]||0)+1);return Object.entries(c).map(([n,q])=>n+(q>1?' ×'+q:''))};
const hr12=h=>((h+11)%12)+1;
const hoursText=()=>hr12(OPEN_H)+'–'+hr12(CLOSE_H);
const noteText=l=>[...(l.notes||[]),l.note].filter(Boolean).join(' · ');

/* ===== DATA: saved in the server's database ===== */
// Shared data lives on the server. This device only remembers its outlet,
// site mode and who is signed in.
// Where friends download the app, sent with referral codes. Switch to the Play Store page once it is live:
// https://play.google.com/store/apps/details?id=com.cheesypizza.app
const APP_LINK='https://github.com/bhattsamp/Cheesy_Pizza/releases/download/android-latest/cheesy-pizza.apk';
// The Android apps say which one they are: Cheesy Pizza (customer site only) or Cheesy Pizza Admin (POS only)
const APP_ROLE=(/CheesyApp\/(customer|admin)/.exec(navigator.userAgent)||[])[1]||null;
const LKEY='cheesy_local_v1';
const LOCAL_KEYS=['cur','mode','me','staffId'];
const SYNCED=['sizes','outlets','menu','addons','offers','combos','extras','users','customers','orders'];
const MAPS={addons:1,customers:1};
let S,VER=0,SNAP={},pendingFlush=null,inFlight=0,syncQ=Promise.resolve();
const today=(d=new Date())=>d.toLocaleDateString('en-CA');
function addDays(ds,n){const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return today(d)}
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function api(url,body){
  const r=await fetch(url,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:typeof body==='string'?body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'HTTP '+r.status);return j;
}
const entries=n=>{const c=S[n]||(MAPS[n]?{}:[]);return MAPS[n]?Object.entries(c):c.map(o=>[o.id,o])};
function snapshot(){SNAP={};SYNCED.forEach(n=>{SNAP[n]=new Map(entries(n).map(([k,o])=>[k,JSON.stringify(o)]))})}
function applyState(d){
  const local=Object.fromEntries(LOCAL_KEYS.map(k=>[k,S?S[k]:null]));
  S={...d.state,...local};VER=d.version;applyConfig(S.config);sortMenu();snapshot();
}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(Object.fromEntries(LOCAL_KEYS.map(k=>[k,S[k]]))))}catch(e){}}
// A new PIN is sent to the server once, which stores only its hash
function setPin(o,pin){o.pin=true;o._newPin=pin}
function save(){saveLocal();if(!pendingFlush)pendingFlush=setTimeout(flush,0)}
// Send only the records that changed since the last save
function diff(){
  const up={},del={};let any=false;
  SYNCED.forEach(n=>{
    const seen=new Set(),ch=[];
    entries(n).forEach(([k,o])=>{seen.add(k);const j=JSON.stringify(o);if(SNAP[n].get(k)!==j){ch.push([k,JSON.parse(j)]);if(o._newPin)delete o._newPin;SNAP[n].set(k,JSON.stringify(o))}});
    const gone=[...SNAP[n].keys()].filter(k=>!seen.has(k));gone.forEach(k=>SNAP[n].delete(k));
    if(ch.length){up[n]=MAPS[n]?Object.fromEntries(ch):ch.map(x=>x[1]);any=true}
    if(gone.length){del[n]=gone;any=true}
  });
  return any?{upsert:up,delete:del}:null;
}
function flush(){
  pendingFlush=null;const ch=diff();if(!ch)return syncQ;inFlight++;
  syncQ=syncQ.then(()=>api('/api/sync',ch)).then(onSynced,e=>{
    // Mark the records as unsaved so the next save sends them again
    console.error(e);Object.entries(ch.upsert).forEach(([n,v])=>(Array.isArray(v)?v.map(o=>o.id):Object.keys(v)).forEach(k=>SNAP[n].delete(k)));
    Object.entries(ch.delete).forEach(([n,ks])=>ks.forEach(k=>SNAP[n].set(k,'')));
    toast('Not saved: server unreachable. Retrying…');setTimeout(save,4000);
  }).finally(()=>inFlight--);
  return syncQ;
}
function onSynced(r){
  if(r.prev!==VER)VER=-1;else VER=r.version; // someone else saved too: refresh on the next poll
  S.seq=r.seq;
  const ren=Object.entries(r.renumbered||{});
  ren.forEach(([id,no])=>{const o=S.orders.find(x=>x.id===id);if(o){o.no=no;SNAP.orders.set(id,JSON.stringify(o))}});
  if(ren.length&&!mroot.innerHTML&&!isBusy())render();
}
// Pull other devices' changes; skipped while this device has unsaved edits
async function refresh(){
  if(pendingFlush||inFlight)return false;
  const v=await api('/api/version');if(v.version===VER)return false;
  const d=await api('/api/state');if(pendingFlush||inFlight)return false;
  applyState(d);migrate();return true;
}
// Demo orders for the last 3 days, made once when the database is new
function seedDemoOrders(){
  const s=S;
  const names=[['Ravi Patel','9825011111'],['Nidhi Shah','9898022222'],['Kunal Mehta','9909033333'],['Pooja Joshi','9727044444'],['Harsh Desai','9638055555'],['Meera Trivedi','9016066666']];
  const modes=['cash','cash','upi','upi','upi','card','zomato'];
  [[-2,8],[-1,11],[0,10]].forEach(([off,n])=>{
    const date=addDays(today(),off);
    ['o1','o2'].forEach((oid,oi)=>{
      const cnt=oi?Math.ceil(n/2):n;
      for(let i=0;i<cnt;i++){
        const c=names[(i+oi*2)%names.length];const mode=modes[(i*3+oi+off+7)%modes.length];
        const type=mode==='zomato'?'zomato':['takeaway','dine','delivery','takeaway'][i%4];
        const pz=s.menu.filter(m=>m.cat==='pizza')[(i*5+off+19)%16];
        const items=[mkLine(pz,i%2?'10':'7',i%3===0?['burst']:[],1)];
        if(i%2)items.push(mkLine(s.menu.find(m=>m.id===['b2','f2','s1','d1'][i%4]),null,[],1));
        const h=12+Math.floor(i*9/cnt);let ts=new Date(date+'T'+String(h).padStart(2,'0')+':'+String((i*17)%60).padStart(2,'0')+':00').getTime();if(ts>Date.now()-30*60e3)ts=Date.now()-(cnt-i+2)*9*60e3;
        const o=newOrder({outletId:oid,date,type,ts,customer:{name:c[0],phone:c[1]},items,source:i%4===1?'online':'pos'});
        o.pay={mode:i===5&&off===0&&oi===0?'due':mode,given:0,change:0};o.paid=o.pay.mode!=='due';
        let st='done';
        if(off===0&&oi===0){if(i===cnt-1)st='placed';else if(i>=cnt-3)st='preparing';else if(i===cnt-4)st='ready';else if(i===cnt-5){st='out';o.type='delivery';o.address='12, Shanti Nagar';o.rider=s.outlets[0].riders[0]}}
        if(st==='placed'){o.source='online';if(o.type==='zomato'){o.type='delivery';o.address='B-4, Green Park'}if(o.type==='delivery'&&!o.address)o.address='B-4, Green Park'}
        if(o.type==='delivery'&&!o.address)o.address='Near City Mall';if(o.type==='dine')o.table=String((i%8)+1);
        if(off===-1&&i===4)st='cancelled';
        o.status=st;o.times={placed:ts,preparing:ts+60e3};
        if(['ready','out','done'].includes(st))o.times.ready=ts+14*60e3;
        if(st==='out')o.times.out=Date.now()-6*60e3;
        if(st==='done'){o.times.done=ts+25*60e3;if(i%3)o.rating=[5,4,5,3,5][i%5]}
        if(off===0&&oi===0&&['preparing','placed','ready','out'].includes(st)){const N=Date.now();o.ts=st==='out'?N-26*60e3:st==='ready'?N-16*60e3:N-(cnt-i)*4*60e3;o.times.placed=o.ts;o.times.preparing=st==='placed'?undefined:o.ts+60e3;if(st==='ready')o.times.ready=N-60e3;if(st==='out'){o.times.ready=N-8*60e3;o.times.out=N-6*60e3}}
        commitOrder(o);
      }
    });
  });
  save();
}
function itemPrice(item,size){return item.cat==='pizza'?(+item.prices[size]||0):item.price}
// tops: picked extra veg toppings, a name twice = double topping; each costs the veg topping price
function price(item,size,addons,tops,ex){let p=itemPrice(item,size);(ex||[]).forEach(e=>{p+=exPrice(e,size)});(addons||[]).forEach(a=>{p+=+(S.addons[a]?.prices[size]||0)});if(tops&&tops.length)p+=tops.length*(+(S.addons.veg?.prices[size]||0));return p}
function mkLine(item,size,addons,qty,tops,ex){const l={itemId:item.id,cat:item.cat,name:item.name,size:item.cat==='pizza'?size:null,addons:addons||[],qty:qty||1,unit:price(item,size,addons,tops,ex),custom:false};if(tops&&tops.length)l.tops=tops.slice();if(ex&&ex.length)l.ex=ex.map(e=>({...e}));return l}
function newOrder(p){return Object.assign({id:uid('ord'),no:'',ts:Date.now(),date:today(),status:'preparing',source:'pos',type:'takeaway',table:'',address:'',pay:{mode:'cash',given:0,change:0},paid:true,times:{}},p)}
const sizeLabel=id=>(S.sizes.find(s=>s.id===id)||{label:id+'"'}).label;
const menuItem=id=>S.menu.find(m=>m.id===id);

/* ===== OFFERS ENGINE ===== */
function dayOK(o,dow){return !o.days||!o.days.length||o.days.includes(dow)}
function activeOffers(dow){return S.offers.filter(o=>o.active&&dayOK(o,dow))}
function computeBill(items,dateStr,extra){
  extra=extra||{};
  const dow=new Date((dateStr||today())+'T12:00:00').getDay();
  const act=activeOffers(dow);const L=items.map(l=>({l,base:l.unit*l.qty,flag:!!(l.combo||l.custom)}));
  const subtotal=L.reduce((s,x)=>s+x.base,0);const disc=[];
  act.filter(o=>o.type==='item').forEach(o=>{
    let amt=0;L.forEach(x=>{if(x.flag||x.l.itemId!==o.itemId)return;if(o.size!=='any'&&o.size!==x.l.size)return;
      const m=menuItem(o.itemId);if(!m)return;const pz=itemPrice(m,x.l.size);
      const cut=o.kind==='pct'?pz*o.value/100:Math.max(0,pz-o.value);amt+=cut*x.l.qty;x.flag=true});
    if(amt>0)disc.push({name:o.name,amt:Math.round(amt)});
  });
  const cands=[];let hint=null;
  act.filter(o=>o.type==='bogo').forEach(o=>{
    const units=[];L.forEach(x=>{if(x.flag||x.l.cat!=='pizza')return;if(o.size!=='any'&&o.size!==x.l.size)return;for(let i=0;i<x.l.qty;i++)units.push(x.l.unit)});
    units.sort((a,b)=>b-a);let amt=0;for(let i=1;i<units.length;i+=2)amt+=units[i];
    if(amt>0)cands.push({name:o.name,amt});
    else if(units.length===1)hint=hint||`Add one more ${o.size==='any'?'':sizeLabel(o.size)+' '}pizza and get it free (${o.name})`;
  });
  act.filter(o=>o.type==='day').forEach(o=>{
    const elig=L.filter(x=>!x.flag&&(o.scope==='all'||x.l.cat==='pizza')).reduce((s,x)=>s+x.base,0);
    if(subtotal>=(o.min||0)){if(elig>0)cands.push({name:o.name+' '+o.pct+'%',amt:Math.round(elig*o.pct/100)})}
    else if(subtotal>0)hint=hint||`Add ${rs(o.min-subtotal)} more to get ${o.pct}% off (${o.name})`;
  });
  if(cands.length){cands.sort((a,b)=>b.amt-a.amt);disc.push(cands[0])}
  let discount=disc.reduce((s,d)=>s+d.amt,0);
  let codeMsg=null,codeOk=false;
  const code=(extra.code||'').trim().toUpperCase();
  if(code){
    const cd=findCode(code,extra.phone);
    if(!cd||!cd.active)codeMsg='This code is not valid.';
    else if(codeBlock(cd,extra.phone))codeMsg=codeBlock(cd,extra.phone);
    else if(!dayOK(cd,dow))codeMsg=`${cd.code} works on ${daysText(cd.days)} only.`;
    else if(subtotal<(cd.min||0))codeMsg=`Add ${rs(cd.min-subtotal)} more to use ${cd.code}.`;
    else{const left=subtotal-discount;let a=cd.kind==='pct'?Math.round(left*cd.value/100):+cd.value;if(cd.kind==='pct'&&cd.cap)a=Math.min(a,cd.cap);a=Math.max(0,Math.min(a,left));
      if(a>0){disc.push({name:'Code '+cd.code,amt:a});discount+=a;codeOk=true;codeMsg=`${cd.code} applied · you save ${rs(a)}`}}
  }
  const coinsMax=Math.floor(Math.max(0,subtotal-discount)*0.2);let coinsUsed=0;
  if(extra.coins>0){coinsUsed=Math.min(Math.floor(extra.coins),coinsMax);if(coinsUsed>0){disc.push({name:`Cheese Coins (${coinsUsed})`,amt:coinsUsed});discount+=coinsUsed}}
  const comboSave=items.filter(l=>l.combo).reduce((s,l)=>s+Math.max(0,(l.worth||0)-l.unit)*l.qty,0);
  const net=Math.max(0,subtotal-discount);
  // GST (owner sets it per outlet): included in menu prices, or added on top of the bill
  const g=gstOf(S.outlets.find(x=>x.id===(extra.outletId||S.cur)));let tax=0,total=net,gst=null;
  if(g){tax=g.mode==='excl'?Math.round(net*g.rate)/100:Math.round((net-net/(1+g.rate/100))*100)/100;if(g.mode==='excl')total=Math.round(net+tax);gst={rate:g.rate,mode:g.mode,tax,net}}
  return {subtotal,discounts:disc,discount,net,gst,total,hint,saved:discount+comboSave,codeMsg,codeOk,coinsUsed,coinsMax,earn:Math.floor(total*COIN_RATE)};
}
/* GST applies only once the outlet has a GSTIN and a rate; mode 'incl' = prices include GST, 'excl' = added on top */
const gstOf=o=>o&&o.gstin&&+o.gstRate>0?{rate:+o.gstRate,mode:o.gstMode==='excl'?'excl':'incl'}:null;
const coinsOf=ph=>Math.floor(S.customers[ph]?.coins||0);
function dripPath(){let d='M0 0H1200V16',x=1200,i=0;while(x>0){const w=38+((i*37)%46),dep=18+((i*53)%26);d+=` C${x-w*.2} 16 ${x-w*.22} ${dep} ${x-w/2} ${dep} S${x-w*.8} 16 ${x-w} 16`;x-=w;i++}return d+' V0Z'}
// Each extra topping is drawn as its own pieces (onion rings, capsicum, corn...). Pieces the
// customer just added drop onto the pizza; prev says how many of each were already shown.
const TOP_SHAPES=[
  [/onion/i,(x,y,k)=>`<circle cx="${x}" cy="${y}" r="4.6" fill="none" stroke="#a24f9e" stroke-width="1.8"/><circle cx="${x}" cy="${y}" r="2.4" fill="none" stroke="#c98bc6" stroke-width="1"/>`],
  [/capsicum|bell|green pepper/i,(x,y,k)=>`<path d="M${x-5} ${y}a5 5 0 0 1 10 0" fill="none" stroke="#2f8f2f" stroke-width="2.4" stroke-linecap="round" transform="rotate(${k*53} ${x} ${y})"/>`],
  [/tomato/i,(x,y)=>`<circle cx="${x}" cy="${y}" r="4.8" fill="#e0452f"/><circle cx="${x}" cy="${y}" r="2.6" fill="#f2735f"/>`],
  [/corn/i,(x,y)=>`<circle cx="${x}" cy="${y}" r="2.2" fill="#f6c932"/><circle cx="${x+3.5}" cy="${y+1.5}" r="2" fill="#f2b632"/><circle cx="${x+1}" cy="${y+4}" r="2" fill="#f6c932"/>`],
  [/jalap/i,(x,y)=>`<circle cx="${x}" cy="${y}" r="4.2" fill="#3c8d2e"/><circle cx="${x}" cy="${y}" r="2.5" fill="#cfe8a0"/><circle cx="${x}" cy="${y}" r="1" fill="#f4e7a1"/>`],
  [/olive/i,(x,y)=>`<circle cx="${x}" cy="${y}" r="3.8" fill="none" stroke="#2b2622" stroke-width="2.2"/>`],
  [/paneer|tofu/i,(x,y,k)=>`<rect x="${x-3.5}" y="${y-3.5}" width="7" height="7" rx="1.6" fill="#fffaf0" stroke="#e6d3a8" stroke-width=".8" transform="rotate(${k*31} ${x} ${y})"/>`],
  [/mushroom/i,(x,y,k)=>`<g transform="rotate(${k*41} ${x} ${y})"><path d="M${x-5} ${y}a5 4 0 0 1 10 0z" fill="#c9a77c"/><rect x="${x-1.5}" y="${y}" width="3" height="4" fill="#e8d6b8"/></g>`],
  [/paprika|chil|red pepper/i,(x,y,k)=>`<rect x="${x-5}" y="${y-1.2}" width="10" height="2.6" rx="1.3" fill="#d42b20" transform="rotate(${k*67} ${x} ${y})"/>`],
  [/cheese/i,(x,y,k)=>`<ellipse cx="${x}" cy="${y}" rx="8" ry="5" fill="#fff4cc" opacity=".95" transform="rotate(${k*29} ${x} ${y})"/>`],
];
const hashStr=t=>[...t].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
function topPieces(ex,r,prev){
  const groups={};ex.forEach(e=>{const k=e.g+'|'+e.n;groups[k]=(groups[k]||0)+1});let out='',drop=0;
  Object.entries(groups).forEach(([k,c])=>{const name=k.split('|')[1],h=hashStr(name),n=c*7,was=Math.min(prev?.[k]??n,n);
    const shape=(TOP_SHAPES.find(([re])=>re.test(name))||[0,(x,y,i)=>`<rect x="${x-3}" y="${y-2}" width="6" height="4" rx="1.5" fill="${['#3f9b3a','#e0452f','#f4c542','#7a3a1a'][h%4]}" transform="rotate(${i*47} ${x} ${y})"/>`])[1];
    for(let i=0;i<n;i++){const a=(h%360)*Math.PI/180+i*2.399,rr=(r-15)*Math.sqrt(((h>>3)+i*37)%97/97+.03);

  const kinds=[['capsicum|veggi|bell','cap','#3f9b3a'],['tomato','tom','#e0452f'],['olive','oli','#2a2a2a'],['corn','corn','#f6c443'],['paneer|cottage','pan','#fff7e6'],['onion','oni','#9b3b7a'],['jalapeno','jal','#5aa832'],['paprika|red cap|chilli|peri|spicy|kadai|kathiyavadi','pap','#c8281e'],['yellow','ycap','#f2c230'],['mushroom','mush','#b48b63']];

  const parts=[];const n=Math.min(26,10+tops.length*4);

    else if(k[1]==='oli')parts.push(`<circle cx="${x|0}" cy="${y|0}" r="4.5" fill="none" stroke="${c}" stroke-width="3"/>`);
    else if(k[1]==='pan')parts.push(`<rect x="${x-5|0}" y="${y-5|0}" width="10" height="10" rx="2" transform="rotate(${rot} ${x|0} ${y|0})" fill="${c}" stroke="#e5c48f"/>`);
    else if(k[1]==='corn')parts.push(`<circle cx="${x|0}" cy="${y|0}" r="3" fill="${c}" stroke="#d49a1c" stroke-width=".8"/>`);
    else if(k[1]==='tom')parts.push(`<circle cx="${x|0}" cy="${y|0}" r="7" fill="${c}" opacity=".92"/><circle cx="${x+2|0}" cy="${y-1|0}" r="2.3" fill="#f6a089"/>`);
    else parts.push(`<ellipse cx="${x|0}" cy="${y|0}" rx="5" ry="3" transform="rotate(${rot} ${x|0} ${y|0})" fill="${c}"/>`);
  }
  const id='pa'+m.id.replace(/\W/g,'');
  return `<svg class="pzart" viewBox="0 0 200 200" aria-hidden="true"><defs><radialGradient id="${id}c" cx=".45" cy=".4"><stop offset=".8" stop-color="#eeb15e"/><stop offset="1" stop-color="#b9682a"/></radialGradient><radialGradient id="${id}h" cx=".42" cy=".38"><stop offset="0" stop-color="#fde7a2"/><stop offset=".7" stop-color="#f6cf6b"/><stop offset="1" stop-color="#eab04a"/></radialGradient></defs>
    <ellipse cx="100" cy="108" rx="92" ry="88" fill="rgba(0,0,0,.12)"/><circle cx="100" cy="100" r="92" fill="url(#${id}c)"/><circle cx="100" cy="100" r="79" fill="#cf4a2a"/><circle cx="100" cy="100" r="76" fill="url(#${id}h)"/>
    ${[...Array(9)].map(()=>`<circle cx="${100+(rnd()-.5)*110|0}" cy="${100+(rnd()-.5)*110|0}" r="${6+rnd()*9|0}" fill="#fff3c4" opacity=".45"/>`).join('')}

// The visit section's drawn map: streets, a canal and blocks around the shop, with our menu as the place
// labels and the pin on the shop. The whole card opens the shop in Google Maps. Built once.
let VISIT_MAP=null;
function visitMap(){
  if(VISIT_MAP)return VISIT_MAP;
  let seed=11;const rnd=()=>(seed=(seed*1103515245+12345)>>>0)/4294967296,f=n=>n.toFixed(1);
  const W=800,H=560,main=x=>352-x*.12+Math.sin(x/110)*14,canal=x=>178+Math.sin(x/150)*42+x*.05;
  const sides=[[120,-20,90,600],[300,-20,330,600],[520,-20,470,600],[660,120,760,600],[0,250,240,230],[560,470,800,430],[240,560,330,352]];
  const near=(x,y)=>Math.abs(y-main(x))<26||Math.abs(y-canal(x))<22||sides.some(([x1,y1,x2,y2])=>{const t=Math.max(0,Math.min(1,((x-x1)*(x2-x1)+(y-y1)*(y2-y1))/((x2-x1)**2+(y2-y1)**2)));return Math.hypot(x-(x1+t*(x2-x1)),y-(y1+t*(y2-y1)))<18});
  let blocks='';
  for(let y=14;y<H;y+=24)for(let x=10;x<W;x+=26){
    const bx=x+rnd()*8,by=y+rnd()*8,w=10+rnd()*12,h=8+rnd()*10;
    if(rnd()<.18||near(bx+w/2,by+h/2)||Math.hypot(bx-430,by-322)<46)continue;
    blocks+=`<rect x="${f(bx)}" y="${f(by)}" width="${f(w)}" height="${f(h)}" transform="rotate(${f((rnd()-.5)*24)} ${f(bx+w/2)} ${f(by+h/2)})"/>`;
  }
  const path=fn=>{let d='';for(let x=-10;x<=W+10;x+=10)d+=(d?'L':'M')+x+' '+f(fn(x));return d};
  return VISIT_MAP=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect width="${W}" height="${H}" fill="#FFF8EC"/>
    <path d="${path(canal)}" fill="none" stroke="#2BA3B5" stroke-width="10" stroke-linecap="round"/><path d="${path(canal)}" fill="none" stroke="#9ED8E0" stroke-width="3"/>
    <g fill="#FCE3A6" stroke="#B2533A" stroke-width="1.4">${blocks}</g>
    <g fill="none" stroke="#B2533A" stroke-linecap="round">${sides.map(([a,b,c,d])=>`<path d="M${a} ${b}L${c} ${d}" stroke-width="3"/>`).join('')}</g>
    <path d="${path(main)}" fill="none" stroke="#B2533A" stroke-width="9" stroke-linecap="round"/><path d="${path(main)}" fill="none" stroke="#F2B632" stroke-width="2.2" stroke-dasharray="10 9"/>
    <ellipse cx="430" cy="${f(main(430)+6)}" rx="46" ry="15" fill="none" stroke="#E2432A" stroke-width="3" opacity=".55"/>
  </svg>`;
}

function playLoop(){

  const p=PLAY.push,last=PLAY.last||mp,dx=mp.x-last.x,dy=mp.y-last.y;PLAY.last={x:mp.x,y:mp.y};
  if(PLAY.mc.body||PLAY.mc.mouse.button===0||Math.hypot(dx,dy)<6||mp.x<=0&&mp.y<=0)Body.setPosition(p,{x:-500,y:-500});
  else{Body.setPosition(p,{x:mp.x,y:mp.y});Body.setVelocity(p,{x:Math.max(-24,Math.min(24,dx)),y:Math.max(-24,Math.min(24,dy))})}

  const x=PLAY.ctx,d=PLAY.d;x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,PLAY.w,PLAY.h);

function placePublic({paid,retry}={}){
  const err=document.getElementById('pf-err');
  if(!pubForm.name.trim())return err.textContent='Enter your name.';
  if(pubForm.phone.length!==10)return err.textContent='Enter a 10-digit mobile number.';
  if(pubForm.type==='delivery'&&!pubForm.address.trim())return err.textContent='Enter the delivery address.';
  if(!payModes(cur()).includes(pubForm.pay)&&!paid)return err.textContent='This payment option is turned off. Choose another one.';
  const coins=coinsOf(pubForm.phone);const b=computeBill(U.cart,null,{code:pubForm.code,coins:pubForm.useCoins?coins:0,phone:pubForm.phone});const mm=me();const wUse=mm&&pubForm.useWallet?Math.min(walletOf(mm.phone),b.total):0;const due=b.total-wUse;
  if(!paid&&due>0&&pubForm.pay==='upi'&&upiInApp()&&(!pubForm.upiFallback||retry)){
    // Pay first inside the app; the order is only placed once the UPI app reports success
    if(U.paying)return;U.paying=true;err.textContent='';
    const ref='CP'+Date.now().toString(36).toUpperCase();
    return UPIPAY.pay({url:upiLink(cur(),due,ref)}).then(r=>{
      const f=upiResult(r&&r.response);U.paying=false;
      if(f.status==='success')return placePublic({paid:{utr:f.utr,ref,txn:f.txn,app:true}});
      if(f.status==='failure'){err.textContent='Payment did not go through, so no order was placed. Try again or choose '+(pubForm.type==='delivery'?'cash on delivery.':'pay at counter.');return}
      // Pending, cancelled or the app said nothing (some apps return nothing even after paying):
      // let the customer give the UTR if money left their account; staff check it
      pubForm.upiFallback=true;openPubCart();
    }).catch(e=>{U.paying=false;err.textContent=e&&e.code==='NO_APP'?'No UPI app found on this phone. Install GPay, PhonePe or Paytm, or choose cash.':'Could not open a UPI app. Try again or choose cash.'})}
  if(due>0&&pubForm.pay==='upi'&&!paid&&(pubForm.utr||'').length!==12)return err.textContent='Pay with UPI first, then enter the 12-digit UPI reference number (UTR) from your payment app.';
  const o=commitOrder(newOrder({outletId:S.cur,type:pubForm.type,address:pubForm.type==='delivery'?pubForm.address:'',customer:{name:pubForm.name.trim(),phone:pubForm.phone},items:U.cart.map(l=>({...l})),source:'online',status:'placed',geo:pubForm.type==='delivery'&&pubForm.geo?pubForm.geo:undefined,
    scheduled:pubForm.when!=='asap'?pubForm.when:'',note:(pubForm.note||'').trim(),extra:{code:b.codeOk?pubForm.code:'',coins:b.coinsUsed},
    walletUsed:wUse,pay:{mode:due===0?'wallet':pubForm.pay==='upi'?'upi':'cash',given:0,change:0,...(due>0&&pubForm.pay==='upi'?paid?{utr:paid.utr||'',ref:paid.ref,txn:paid.txn||'',check:'ok',app:true}:{utr:pubForm.utr,check:'pending'}:{})},paid:due===0||!!paid,...(paid?{paidAt:Date.now(),paidBy:'UPI app'}:{})}));
  if(wUse)walletAdd(o.customer.phone,-wUse,'Paid for '+o.no);if(mm){o.scratch={coins:5+Math.floor(Math.random()*26),done:false};if(pubForm.address&&!mm.addr)mm.addr=pubForm.address}
  pubForm.useWallet=false;pubForm.note='';pubForm.geo=null;pubForm.utr='';pubForm.upiFallback=false;confetti();U.cart=[];pubForm.code='';pubForm.useCoins=false;pubForm.when='asap';save();render();U.trackId=o.id;openTrack();cpushOrder(o.id);
}

/* ===== TRACKING ===== */
function trackInfo(o){
  const t=o.times||{};const now=Date.now();const del=o.type==='delivery';
  let head,eta=null,prog=0;
  const prepStart=t.preparing||t.placed||o.ts;
  if(o.status==='placed'){head='Waiting for the outlet to accept';eta=waitOf(o)+(del?RIDE_MIN:0)}
  else if(o.status==='preparing'){head='Your pizza is in the oven';eta=Math.max(2,waitOf(o)-Math.floor((now-prepStart)/60000))+(del?RIDE_MIN:0)}
  else if(o.status==='ready'){head=del?'Packed · rider is picking it up':o.type==='dine'?'Ready · serving to your table':'Ready at the counter';eta=del?RIDE_MIN:0}
  else if(o.status==='out'){const f=Math.min(.95,(now-(t.out||now))/(RIDE_MIN*60000));prog=Math.max(.05,f);head='On the way to you';eta=Math.max(1,Math.ceil(RIDE_MIN*(1-f)))}
  else if(o.status==='done'){head=doneLabel(o.type)+'. Enjoy your pizza!';prog=1}
  else head='Order cancelled by the outlet';
  return {head,eta,prog};
}

}

    ${scratchBlock(o)}

function playTone(o){
  const c=alertCfg(o),vol=Math.max(0,Math.min(100,+c.vol||0))/100;if(!vol)return;
  if(c.tone==='custom'&&o.alertSound){try{if(ringAudio)ringAudio.pause();ringAudio=new Audio(o.alertSound);ringAudio.volume=vol;ringAudio.play().catch(()=>{})}catch(_){}return}
  const a=audioCtx();if(!a)return;const t0=a.currentTime+.02;
  const note=(f,t,d,type='sine',g=.35,f2)=>{const os=a.createOscillator(),gn=a.createGain();os.type=type;os.frequency.setValueAtTime(f,t0+t);if(f2)os.frequency.linearRampToValueAtTime(f2,t0+t+d);
    gn.gain.setValueAtTime(0,t0+t);gn.gain.linearRampToValueAtTime(g*vol,t0+t+.02);gn.gain.exponentialRampToValueAtTime(.001,t0+t+d);os.connect(gn);gn.connect(a.destination);os.start(t0+t);os.stop(t0+t+d+.05)};
  ({chime:()=>[523,659,784,1047].forEach((f,i)=>note(f,i*.16,.5,'triangle')),
    bell:()=>{[0,.7].forEach(t=>{note(880,t,1.1,'sine',.4);note(1320,t,.8,'sine',.15);note(660,t+.35,1,'sine',.35)})},
    ring:()=>{for(let i=0;i<2;i++)for(let k=0;k<10;k++)note(k%2?480:440,i*.8+k*.05,.06,'square',.12)},

function recalcOrder(o){
  const before=(o.coinsEarned||0)-(o.coinsUsed||0);
  const b=computeBill(o.items,o.date,{...(o.extra||{}),phone:o.customer.phone,outletId:o.outletId});if(b.gst)o.gst=b.gst;else delete o.gst;
  Object.assign(o,{subtotal:b.subtotal,discounts:b.discounts,total:b.total,coinsUsed:b.coinsUsed,coinsEarned:(o.customer.phone||'').length===10?b.earn:0});
  const c=S.customers[o.customer.phone];if(c)c.coins=Math.max(0,(c.coins||0)+o.coinsEarned-o.coinsUsed-before);
}
// Take payment for an order: at billing, or later at the counter
function settleOrder(o,mode,given){
  const ph=o.customer.phone;const c=S.customers[ph];
  if(o.pay?.mode==='due'&&c&&mode!=='due')c.due=Math.max(0,(c.due||0)-o.total); // was on the baki account
  const g=mode==='cash'?(+given||o.total):0;
  o.pay={mode,given:g,change:mode==='cash'?Math.max(0,g-o.total):0};
  o.paid=mode!=='due'&&mode!=='pending';
  if(mode==='due'&&ph)ensureCust(ph,o.customer.name).due=(S.customers[ph].due||0)+o.total;
  if(mode==='wallet'){o.walletUsed=o.total;walletAdd(ph,-o.total,'Paid for '+o.no+' at counter')}
  if(o.paid){o.paidAt=Date.now();o.paidBy=staff()?.name||''}
}
function posGo(kind){
  const P=U.pos;const su=staff();
  const run=P.addTo&&S.orders.find(o=>o.id===P.addTo);
  if(!P.cart.length&&!(run&&kind!=='kot'))return;
  if(P.phone&&P.phone.length!==10){toast('Mobile number should be 10 digits');return}
  if(!run){
    if(needPhone()&&P.phone.length!==10){toast('Enter the customer mobile number');document.getElementById('pos-ph')?.focus();return}
    if(P.type==='zomato'&&!P.zid.trim()){toast('Enter the Zomato order ID');document.getElementById('pos-zid')?.focus();return}
    if(P.type==='delivery'&&!P.address.trim()){toast('Add the delivery address');return}
    if(P.type==='dine'&&!P.table){toast('Pick a table');return}
  }
  const bill=kind!=='kot';const mode=P.type==='zomato'?'zomato':P.pay;
  if(bill&&mode==='due'&&P.phone.length!==10&&!(run&&run.customer.phone)){toast('Add the mobile number to keep a baki amount');return}
  if(bill&&mode==='cash'&&+P.given){
    const pre=run?computeBill([...run.items,...P.cart],run.date,{...(run.extra||{}),...(P.code?{code:P.code}:{}),phone:run.customer.phone}).total:computeBill(P.cart,null,{code:P.code,coins:P.useCoins?coinsOf(P.phone):0,phone:P.phone}).total;
    if(+P.given<pre){toast('Customer gave less than '+rs(pre));return}
  }
  let o,round=1;
  if(run){
    o=run;
    if(P.cart.length){round=Math.max(1,...o.items.map(l=>l.round||1))+1;P.cart.forEach(l=>o.items.push({...l,round}));
      if(['ready','done'].includes(o.status)){o.status='preparing';o.times.preparing=Date.now();delete o.times.ready;delete o.times.done}}
    if(P.code)o.extra={...(o.extra||{}),code:P.code};
    if(P.phone.length===10&&!o.customer.phone)o.customer={name:P.name.trim(),phone:P.phone};
    recalcOrder(o);
    if(P.code&&!(o.discounts||[]).some(d=>d.name==='Code '+P.code.toUpperCase()))o.extra.code='';
  }else{
    const b=computeBill(P.cart,null,{code:P.code,coins:P.useCoins?coinsOf(P.phone):0,phone:P.phone});
    o=commitOrder(newOrder({outletId:S.cur,type:P.type,table:P.type==='dine'?P.table:'',address:P.type==='delivery'?P.address:'',customer:{name:P.name.trim(),phone:P.phone},items:P.cart.map(l=>({...l})),note:(P.note||'').trim(),
      zomatoId:P.type==='zomato'?P.zid.trim():'',wait:P.wait||PREP_MIN,by:su?.name||'',byRole:su?.role||'',
      extra:{code:b.codeOk?P.code:'',coins:b.coinsUsed},pay:{mode:'pending',given:0,change:0},paid:false}));
    if(P.type==='dine'&&cur().holds?.[P.table]){delete cur().holds[P.table]}
  }
  if(bill){
    settleOrder(o,mode,+P.given||0);
  }
  save();Object.assign(U.pos,JSON.parse(JSON.stringify(POS_BLANK)));render();
  if(kind==='kot'){const txt=kotText(o,run?round:null);printText(txt);toast((run?'New items for '+o.no:o.no)+' sent to kitchen')}
  else{openDone(o);if(kind==='billprint')printText(billText(o))}
}

function pad(a,b,w=32){a=String(a);b=String(b);const sp=w-a.length-b.length;return sp>0?a+' '.repeat(sp)+b:a.slice(0,w-b.length-1)+' '+b}
function center(s,w=32){s=String(s);return ' '.repeat(Math.max(0,Math.floor((w-s.length)/2)))+s}
function billText(o){
  const out=outletOf(o);const L=[];const hr='-'.repeat(32);
  L.push(center(out.legal||'CHEESY PIZZA'),center('Really Cheesy...!'),center(out.name),center('Ph: '+fmtPhone(out.phone)),...(out.gstin?[center('GSTIN: '+out.gstin)]:[]),...(out.fssai?[center('FSSAI: '+out.fssai)]:[]),center('PURE VEG'),hr);
  L.push(pad('Bill: '+o.no,TYPES[o.type]),pad(fmtDate(o.date),fmtTime(o.ts)));
  if(o.customer.name||o.customer.phone)L.push('Cust: '+(o.customer.name||'')+' '+(o.customer.phone||''));
  if(o.table)L.push('Table: '+o.table);if(o.address)L.push('Addr: '+o.address.slice(0,26));if(o.zomatoId)L.push('Zomato ID: '+o.zomatoId);
  L.push(hr,pad('Item','Amt'),hr);
  o.items.forEach(l=>{L.push(pad(l.qty+' x '+l.name.slice(0,20),String(l.unit*l.qty)));const a=addonText(l);if(a)L.push('   '+a.slice(0,29))});
  L.push(hr,pad('Item total','Rs '+o.subtotal));(o.discounts||[]).forEach(d=>L.push(pad(d.name.slice(0,22),'-'+d.amt)));
  if(o.gst){const h=(o.gst.tax/2).toFixed(2);L.push(pad(`SGST ${o.gst.rate/2}%`+(o.gst.mode==='incl'?' (incl)':''),h),pad(`CGST ${o.gst.rate/2}%`+(o.gst.mode==='incl'?' (incl)':''),h));const ro=o.gst.mode==='excl'&&o.gst.net!=null?Math.round((o.total-o.gst.net-2*h)*100)/100:0;if(ro)L.push(pad('Round off',(ro>0?'+':'')+ro.toFixed(2)))}
  L.push(pad('TOTAL','Rs '+o.total),o.paid?pad('Paid by',PAY[o.pay.mode]):pad('Payment','BAKI '+(o.pay.mode==='due'?'(on account)':'(not paid)')));if(o.walletUsed&&o.pay.mode!=='wallet')L.push(pad('From wallet','Rs '+o.walletUsed));if(o.coinsEarned)L.push(pad('Cheese Coins earned','+'+o.coinsEarned));
  if(o.pay.mode==='cash'&&o.pay.given)L.push(pad('Given','Rs '+o.pay.given),pad('Return','Rs '+o.pay.change));
  if(o.status==='cancelled')L.push(hr,center('*** CANCELLED ***'));

function wrapTxt(t,w){const out=[];let line='';String(t).split(' ').forEach(x=>{if((line+' '+x).trim().length>w){if(line)out.push(line);line=x}else line=(line+' '+x).trim()});if(line)out.push(line);return out}

function salesFor(date,scope){
  const list=S.orders.filter(o=>o.date===date&&o.status!=='cancelled'&&(scope==='all'||o.outletId===S.cur));
  const by={cash:0,upi:0,card:0,bank:0,wallet:0,zomato:0,due:0,pending:0};list.forEach(o=>{const w=o.walletUsed||0;by.wallet+=w;by[o.pay.mode]=(by[o.pay.mode]||0)+o.total-w});
  const tot=list.reduce((s,o)=>s+o.total,0);const disc=list.reduce((s,o)=>s+((o.subtotal||o.total)-o.total),0);
  const types={};list.forEach(o=>types[o.type]=(types[o.type]||0)+o.total);
  const items={};list.forEach(o=>o.items.forEach(l=>{items[l.name]=(items[l.name]||0)+l.qty}));
  const offers={};list.forEach(o=>(o.discounts||[]).forEach(d=>offers[d.name]=(offers[d.name]||0)+d.amt));
  const canc=S.orders.filter(o=>o.date===date&&o.status==='cancelled'&&(scope==='all'||o.outletId===S.cur)).length;
  const rated=list.filter(o=>o.rating);const rating=rated.length?rated.reduce((a,o)=>a+o.rating,0)/rated.length:0;
  const pt=list.filter(o=>o.times&&o.times.ready&&o.times.preparing&&o.times.ready>o.times.preparing).map(o=>(o.times.ready-o.times.preparing)/60000);const prep=pt.length?pt.reduce((a,b)=>a+b,0)/pt.length:0;
  const hours={};list.forEach(o=>{const h=new Date(o.ts).getHours();hours[h]=(hours[h]||0)+o.total});
  return {list,by,tot,types,items,canc,disc,offers,rating,ratedN:rated.length,prep,hours};
}

// Shrink a chosen photo in the browser so uploads stay small (max 1200px, JPEG)
function shrinkImage(file){return new Promise((ok,bad)=>{
  if(!/^image\//.test(file.type))return bad(new Error('Choose a photo (JPG, PNG or WebP)'));
  const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.85))};
  im.onerror=()=>{URL.revokeObjectURL(url);bad(new Error('Could not read this photo'))};im.src=url})}

// Menu order is kept in each item's `ord`, so moving items survives a reload
function numberMenu(){S.menu.forEach((m,i)=>m.ord=i)}
function sortMenu(){const idx=new Map(S.menu.map((m,i)=>[m.id,i]));S.menu.sort((a,b)=>(a.ord??idx.get(a.id))-(b.ord??idx.get(b.id)))}
function moveItem(id,dir){
  const i=S.menu.findIndex(m=>m.id===id);const cat=S.menu[i].cat;let j=i+dir;
  while(j>=0&&j<S.menu.length&&S.menu[j].cat!==cat)j+=dir;
  if(j<0||j>=S.menu.length)return;
  [S.menu[i],S.menu[j]]=[S.menu[j],S.menu[i]];numberMenu();save();
}

const mroot=document.getElementById('modalRoot');let mh={};
function showModal(html,handlers={}){
  mh=handlers;const prev=document.activeElement&&mroot.contains(document.activeElement)?document.activeElement.id:null;
  const sc=mroot.querySelector('.modal')?.scrollTop||0;
  const fresh=!mroot.innerHTML;
  mroot.innerHTML=`<div class="scrim${fresh?' pop':''}" data-act="scrim"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const md=mroot.querySelector('.modal');md.scrollTop=sc;md.tabIndex=-1;
  const mt=md.querySelector('.mh h3');if(mt){mt.id='mtitle';md.setAttribute('aria-labelledby','mtitle')}
  if(fresh&&!prev)md.focus({preventScroll:true});
  afterRender();
  if(prev){const el=document.getElementById(prev);if(el&&mroot.contains(el)){el.focus();if(el.setSelectionRange&&el.type!=='number'&&el.tagName!=='SELECT')try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}
}

/* What the UPI app hands back: "txnId=..&responseCode=00&Status=SUCCESS&ApprovalRefNo=123456789012" */
function upiResult(txt){const f={};String(txt||'').split('&').forEach(kv=>{const i=kv.indexOf('=');if(i>0)f[kv.slice(0,i).trim().toLowerCase()]=(()=>{try{return decodeURIComponent(kv.slice(i+1).trim())}catch(e){return kv.slice(i+1).trim()}})()});
  const st=(f.status||'').toLowerCase();return {status:st==='success'?'success':st==='failure'||st==='failed'?'failure':st==='submitted'||st==='pending'?'pending':'',utr:(f.approvalrefno||f.approvalref||'').replace(/\D/g,'').slice(0,12),txn:f.txnid||''}}

/* Poster PNG of a branch's UPI QR: name on top, QR, UPI ID below. Shared on phones, downloaded on the web. */
async function qrPoster(o){
  const src=document.querySelector(`#oqr-${o.id} canvas`);if(!src)return toast('QR is still loading');
  const W=600,H=820,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#0f2e36';x.textAlign='center';
  x.font='bold 40px system-ui,sans-serif';x.fillText('Cheesy Pizza',W/2,80);
  x.font='28px system-ui,sans-serif';x.fillText(o.name,W/2,125);
  x.imageSmoothingEnabled=false;x.drawImage(src,90,170,420,420);
  x.font='bold 26px system-ui,sans-serif';x.fillText('Scan & pay with any UPI app',W/2,650);
  x.font='26px system-ui,sans-serif';x.fillText(o.upi,W/2,700);
  x.font='20px system-ui,sans-serif';x.fillStyle='#5b7178';x.fillText('GPay · PhonePe · Paytm · BHIM',W/2,750);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));const name=`cheesy-pizza-upi-${(o.code||o.id).toLowerCase()}.png`;
  const file=new File([blob],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Cheesy Pizza UPI QR · '+o.name});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('QR saved')}
let tt;function toast(t){clearTimeout(tt);let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;tt=setTimeout(()=>el.remove(),1800)}

const PUSH=APP_ROLE==='admin'&&/CheesyPush/.test(navigator.userAgent)&&window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.PushNotifications;
const PKEY='cheesy_push_token';let pushPin=null;
const pushTok=()=>{try{return localStorage.getItem(PKEY)}catch(_){return null}};
async function pushSetup(){
  if(!PUSH)return;try{if(!(await api('/api/push/status')).enabled)return}catch(_){return}
  try{
    let p=await PUSH.checkPermissions();if(p.receive!=='granted'&&p.receive!=='denied')p=await PUSH.requestPermissions();
    if(p.receive!=='granted'){toast('Allow notifications to hear new orders while the app is closed');return}
    await PUSH.createChannel({id:'orders',name:'New orders',description:'Rings when a customer places an online order',importance:5,visibility:1,sound:'order_ring',vibration:true,lights:true,lightColor:'#1A93A8'});
    await PUSH.register();
  }catch(e){console.error(e)}
}
if(PUSH){
  PUSH.addListener('registration',async t=>{const old=pushTok();try{
    if(pushPin){await api('/api/push/register',{token:t.value,staffId:S.staffId,pin:pushPin,outletId:S.cur});pushPin=null}
    else if(!old||!(await api('/api/push/refresh',{old,token:t.value,outletId:S.cur})).ok)return;
    localStorage.setItem(PKEY,t.value)}catch(e){console.error(e)}});
  // Tapping the alert opens the app; the order is waiting with Accept and Reject
  PUSH.addListener('pushNotificationActionPerformed',()=>{refresh().then(()=>{checkNewOnline();if(!mroot.innerHTML&&!isBusy())render()}).catch(()=>{})});
}

/* ===== Riders share live location while they have orders out with them ===== */
const RT={on:false,id:null,web:null,last:0,sent:0,err:'',denied:false};
const myTrips=()=>{const su=staff();const nm=(su&&su.name||'').trim().toLowerCase();return nm?liveOrders().filter(o=>o.status==='out'&&o.rider&&String(o.rider.name).trim().toLowerCase()===nm):[]};
const rtDraw=()=>{if(S.mode==='pos'&&U.pos.tab==='trips'&&!mroot.innerHTML)render()};
function riderSend(lat,lng,acc,speed){const now=Date.now();RT.last=now;RT.err='';if(now-RT.sent<8000)return;RT.sent=now;
  const ids=myTrips().map(o=>o.id);if(!ids.length)return;
  api('/api/rider/loc',{orders:ids,lat,lng,acc:Math.round(acc||0),speed:Number.isFinite(speed)?speed:null,name:(staff()||{}).name||''}).catch(()=>{})}
function riderFail(denied){riderStop();RT.denied=denied;RT.err=denied?'Location permission is off for this app.':'Could not get your location. Check that location is turned on.';rtDraw()}
async function riderStart(){
  if(RT.on)return;RT.on=true;RT.err='';
  try{
    if(BGEO)RT.id=await BGEO.addWatcher({backgroundTitle:'Cheesy Pizza delivery',backgroundMessage:'Sharing your location with customers until your deliveries are done.',requestPermissions:true,stale:false,distanceFilter:20},
      (loc,err)=>{if(err){riderFail(err.code==='NOT_AUTHORIZED');return}if(loc)riderSend(loc.latitude,loc.longitude,loc.accuracy,loc.speed)});
    else if(navigator.geolocation)RT.web=navigator.geolocation.watchPosition(p=>riderSend(p.coords.latitude,p.coords.longitude,p.coords.accuracy,p.coords.speed),e=>riderFail(e.code===1),{enableHighAccuracy:true,maximumAge:5000});
    else{RT.on=false;RT.err='This device cannot share location.'}
  }catch(e){riderFail(false)}
  rtDraw();
}
function riderStop(){if(RT.id&&BGEO)BGEO.removeWatcher({id:RT.id}).catch(()=>{});if(RT.web!=null&&navigator.geolocation)navigator.geolocation.clearWatch(RT.web);RT.on=false;RT.id=null;RT.web=null}
// Starts sharing when an order goes out with this rider, stops when the last one is delivered
function riderSync(){if(S.mode!=='pos'||!staff()){if(RT.on)riderStop();return}
  const n=myTrips().length;if(n&&!RT.on&&!RT.err)riderStart();else if(!n&&RT.on){riderStop();rtDraw()}}
setInterval(()=>{try{riderSync()}catch(_){}},5000);
const ago=t=>{const s=Math.max(0,Math.round((Date.now()-t)/1000));return s<60?'just now':Math.round(s/60)+' min ago'};
function vTrips(){
  const su=staff();const mine=myTrips();const others=liveOrders().filter(o=>o.status==='out'&&!mine.includes(o));
  const card=o=>{const dest=o.geo?o.geo.lat+','+o.geo.lng:(o.address||'');return `<div class="card trip"><div class="row"><b class="num">${o.no}</b><span class="grow">${esc(o.customer.name)}</span><b class="num">${rs(o.total)}</b>${payTag(o)}</div>

  const box=RT.on?`<b>📍 Sharing your live location</b><div class="small muted">Customers see you on their map${RT.last?' · updated '+ago(RT.last):''}. It stops by itself when your deliveries are done.</div>`
    :mine.length?`<b>Location sharing is off</b><div class="small muted">${esc(RT.err||'Turn it on so customers can see you coming.')}</div><div class="row" style="gap:8px">${RT.denied&&BGEO?'<button class="btn" data-act="trip-settings">Open settings</button>':''}<button class="btn pri" data-act="trip-share">Share live location</button></div>`
    :'<b>No deliveries right now</b><div class="small muted">When the counter sends an order out with your name, it shows here and your live location is shared until you mark it delivered.</div>';
  return `<div class="ph1"><h2>My deliveries</h2><span class="muted small">Orders out with ${esc(su.name)}</span></div>
  <div class="card livebox">${box}</div>${mine.map(card).join('')}
  ${others.length?`<div class="grp-h">Out with other riders</div>${others.map(o=>`<div class="small">${o.no} · ${esc((o.rider&&o.rider.name)||'')} · ${esc(o.address||'')}</div>`).join('')}`:''}`;
}

/* ===== Customer tracking: the rider on a live map ===== */
const LIVE={id:null,map:null,el:null,rider:null,loc:null,timer:null,lib:null};
function loadLeaflet(){return LIVE.lib||(LIVE.lib=new Promise((ok,bad)=>{
  const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(c);
  const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';sc.onload=ok;sc.onerror=()=>{LIVE.lib=null;bad(new Error('map'))};document.head.appendChild(sc)}))}
function liveTrack(o){if(LIVE.id!==o.id){liveStop();LIVE.id=o.id}
  if(!LIVE.timer){livePoll();LIVE.timer=setInterval(()=>{if(U.trackId!==LIVE.id||!mroot.innerHTML){liveStop();return}livePoll()},10000)}
  liveMount()}
async function livePoll(){const id=LIVE.id;try{const l=await api('/api/track/'+encodeURIComponent(id));if(id!==LIVE.id||!l||l.lat==null)return;
  const first=!LIVE.loc;LIVE.loc=l;if(first&&U.trackId===id&&mroot.innerHTML)openTrack();else liveMount()}catch(_){}}
async function liveMount(){
  if(!LIVE.loc||!document.getElementById('liveSlot'))return;
  try{await loadLeaflet()}catch(_){const sl=document.getElementById('liveSlot');if(sl)sl.textContent='The map could not load. Check your internet.';return}
  const slot=document.getElementById('liveSlot');const o=S.orders.find(x=>x.id===LIVE.id);if(!slot||!o)return;
  if(!LIVE.el){LIVE.el=document.createElement('div');LIVE.el.className='livemap-in'}
  if(LIVE.el.parentNode!==slot)slot.appendChild(LIVE.el);
  const L=window.L;const r=[LIVE.loc.lat,LIVE.loc.lng];
  if(!LIVE.map){LIVE.map=L.map(LIVE.el,{zoomControl:false});
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(LIVE.map);
    LIVE.rider=L.marker(r,{icon:L.divIcon({className:'lm',html:'🛵',iconSize:[36,36]})}).addTo(LIVE.map);
    if(o.geo){L.marker([o.geo.lat,o.geo.lng],{icon:L.divIcon({className:'lm',html:'🏠',iconSize:[36,36]})}).addTo(LIVE.map);LIVE.map.fitBounds(L.latLngBounds([r,[o.geo.lat,o.geo.lng]]).pad(.35))}
    else LIVE.map.setView(r,15);
  }else{LIVE.rider.setLatLng(r);LIVE.map.invalidateSize();if(!o.geo)LIVE.map.panTo(r)}
  const cap=document.getElementById('liveCap');if(cap)cap.textContent=liveText(o);
}
function liveStop(){clearInterval(LIVE.timer);LIVE.timer=null;if(LIVE.map)LIVE.map.remove();LIVE.map=null;LIVE.el=null;LIVE.rider=null;LIVE.loc=null;LIVE.id=null}
function km(a,b){const R=6371,r=x=>x*Math.PI/180;const h=Math.sin(r(b.lat-a.lat)/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(r(b.lng-a.lng)/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const liveEta=o=>o.status==='out'&&LIVE.id===o.id&&LIVE.loc&&o.geo?Math.max(1,Math.round(km(LIVE.loc,o.geo)/20*60*1.3)):null;
function liveText(o){const l=LIVE.loc;if(!l)return '';const who=l.name||'Your rider';
  if(o.geo){const d=km(l,o.geo);return `${who} is ${d<1?Math.round(d*1000)+' m':d.toFixed(1)+' km'} away · about ${liveEta(o)} min · updated ${ago(l.ts)}`}
  return `${who}'s live location · updated ${ago(l.ts)}`}

const ROLES={owner:'Owner',manager:'Manager',cashier:'Cashier',kitchen:'Kitchen',rider:'Rider'};
const ROLE_TABS={owner:TABS.map(t=>t[0]),manager:TABS.map(t=>t[0]).filter(k=>k!=='staff'&&k!=='review'),cashier:['new','counter','orders','cust'],kitchen:['kitchen','counter'],rider:['trips']};
function ensureCust(ph,name){const c=S.customers[ph]||(S.customers[ph]={phone:ph,name:name||'',due:0,coins:0});
  c.wallet=c.wallet||0;c.tx=c.tx||[];c.myCodes=c.myCodes||[];c.ref=c.ref||('CP'+ph.slice(-5));if(name&&!c.name)c.name=name;return c}
function migrate(){
  Object.keys(S.customers).forEach(ph=>ensureCust(ph));
  if(!S.users.some(u=>u.id===S.staffId))S.staffId=null;
  if(S.me&&!S.customers[S.me])S.me=null;
  if(!S.outlets.some(o=>o.id===S.cur))S.cur=S.outlets[0]&&S.outlets[0].id;
  save();
}
const me=()=>S.me&&S.customers[S.me]&&S.customers[S.me].pin?S.customers[S.me]:null;
const staff=()=>S.users.find(u=>u.id===S.staffId)||null;
const walletOf=ph=>Math.floor(S.customers[ph]?.wallet||0);
function walletAdd(ph,amt,note){const c=ensureCust(ph);c.wallet=Math.max(0,Math.round((c.wallet||0)+amt));c.tx.unshift({ts:Date.now(),kind:'wallet',amt:Math.round(amt),note})}
function coinAdd(ph,amt,note){const c=ensureCust(ph);c.coins=Math.max(0,Math.round((c.coins||0)+amt));c.tx.unshift({ts:Date.now(),kind:'coins',amt:Math.round(amt),note})}
function findCode(code,ph){
  const c=ph&&S.customers[ph];const pc=c&&(c.myCodes||[]).find(x=>x.code===code);
  if(pc)return {...pc,type:'code',days:[],active:!pc.used,personal:true};
  return S.offers.find(o=>o.type==='code'&&String(o.code||'').toUpperCase()===code);
}
function codeBlock(cd,ph){
  if(cd.until&&today()>cd.until)return 'This code has expired.';
  const mine=ph&&ph.length===10?S.orders.filter(o=>o.customer.phone===ph&&o.status!=='cancelled'):[];
  if(cd.firstOnly){if(!ph||ph.length!==10)return 'Add your mobile number to use this first-order code.';if(mine.length)return 'This code is only for your first order.'}
  if(cd.once&&mine.some(o=>(o.extra?.code||'').toUpperCase()===cd.code))return 'You have already used this code.';
  return null;
}
function refundOrder(o){
  const amt=(o.walletUsed||0)+(o.source==='online'&&o.paid&&o.pay.mode==='upi'?o.total-(o.walletUsed||0):0);
  if(amt>0&&o.customer.phone&&!o.refunded){walletAdd(o.customer.phone,amt,'Refund for '+o.no);o.refunded=amt;toast(rs(amt)+' refunded to wallet')}
}

function wheelSVG(){
  const cx=110,r=104;let g='';
  SEGS.forEach((s,i)=>{const a0=(i*45-112.5)*Math.PI/180,a1=((i+1)*45-112.5)*Math.PI/180;
    const x0=cx+r*Math.cos(a0),y0=cx+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cx+r*Math.sin(a1);const am=(i*45-90);
    g+=`<path d="M${cx} ${cx}L${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${s.c}"/>`;
    g+=`<text transform="rotate(${am+90} ${cx} ${cx})" x="${cx}" y="${cx-62}" text-anchor="middle" font-size="12" font-weight="800" fill="${s.c==='#f2b632'?'#3a2800':'#fff'}" font-family="Baloo Bhai 2,sans-serif">${s.t}</text>`});
  return `<svg class="wheel" id="wheel" viewBox="0 0 220 220" style="transform:rotate(${U.spin.deg}deg)" role="img" aria-label="Prize wheel"><circle cx="110" cy="110" r="109" fill="#082a31"/>${g}<circle cx="110" cy="110" r="22" fill="#fff"/><text x="110" y="116" text-anchor="middle" font-size="16" font-weight="800" fill="#1a93a8" font-family="Baloo Bhai 2,sans-serif">C</text></svg>`;
}
function doSpin(){

  const idx=Math.floor(Math.random()*SEGS.length);
  U.spin.busy=true;U.spin.deg=U.spin.deg-(U.spin.deg%360)+360*6+(360-idx*45)%360;

  const P=[...Array(140)].map(()=>({x:W/2+(Math.random()-.5)*120,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:4+Math.random()*6,c:cols[Math.random()*6|0],r:Math.random()*6}));

  }
  return `<main class="acc">
    <div class="row"><button class="btn sm" data-act="acc-back">← Back to menu</button></div>
    <section class="acc-hero"><div class="av" style="width:64px;height:64px;font-size:30px;position:relative;z-index:1">${esc(c.name[0]||'?')}</div>
      <div class="grow" style="position:relative;z-index:1"><h2>Hi, ${esc(c.name.split(' ')[0])}!</h2><p>Member since ${new Date(c.joined||Date.now()).toLocaleDateString('en-IN',{month:'long',year:'numeric'})} · ${badgesFor(c.phone).filter(b=>b.on).length} badges</p></div>
      <div class="kpis"><div class="kpi"><b class="num">${rs(c.wallet||0)}</b><span>Wallet</span></div><div class="kpi"><b class="num">${Math.floor(c.coins||0)}</b><span>Coins</span></div><div class="kpi"><b class="num">${ok.length}</b><span>Orders</span></div><div class="kpi"><b class="num">${rs(ok.reduce((s,o)=>s+(o.subtotal-o.total),0))}</b><span>Saved</span></div></div></section>
    ${bcode?`<div class="bday">Happy birthday, ${esc(c.name.split(' ')[0])}! Use code <span class="codechip">${bcode}</span> for 25% off this week.</div>`:''}
    <div class="tabs">${tabs.map(([k,n])=>`<button data-act="acc-tab" data-v="${k}" aria-pressed="${tab===k}">${n}</button>`).join('')}</div>

}
function openTopup(amt){
  const c=me();const bonus=amt>=1000?Math.round(amt*.05):0;
  showModal(`<div class="mh"><h3>Add ${rs(amt)} to wallet</h3><button class="x" data-act="close" aria-label="Close">×</button></div>
  <div class="mb"><div class="qr"><div data-qr="upi://pay?pa=${encodeURIComponent(cur().upi)}&pn=${encodeURIComponent('Cheesy Pizza Wallet')}&am=${amt}&cu=INR"></div><b class="num">${rs(amt)} to ${esc(cur().upi)}</b></div>
  ${bonus?`<div class="savings num">You get ${rs(bonus)} bonus · wallet gets ${rs(amt+bonus)}</div>`:''}

  <button class="btn pri lg block" data-act="top-ok" data-v="${amt}">I have paid</button></div>`);
}

/* ----- scratch card ----- */
function initScratch(){
  document.querySelectorAll('canvas[data-scratch]').forEach(cv=>{
    if(cv.dataset.ready)return;cv.dataset.ready=1;const ctx=cv.getContext('2d');const W=cv.width,H=cv.height;
    const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#b9c6c9');g.addColorStop(.5,'#e3ecee');g.addColorStop(1,'#9fb0b4');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#46626a';ctx.font='700 20px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('Scratch here to win',W/2,H/2+7);
    let down=false,n=0;const scr=e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,18,0,7);ctx.fill();if(++n===45)revealScratch(cv.dataset.scratch)};
    cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);scr(e)});cv.addEventListener('pointermove',e=>{if(down)scr(e)});cv.addEventListener('pointerup',()=>down=false);
  });
}
function revealScratch(id){const o=S.orders.find(x=>x.id===id);if(!o||!o.scratch||o.scratch.done)return;o.scratch.done=true;coinAdd(o.customer.phone,o.scratch.coins,'Scratch card '+o.no);save();confetti();toast(o.scratch.coins+' Cheese Coins added!');setTimeout(()=>{if(U.trackId===id)openTrack()},700)}
function scratchBlock(o){
  if(!o.scratch)return '';
  if(o.scratch.done)return `<div class="savings num" style="text-align:center">You won ${o.scratch.coins} Cheese Coins from your scratch card</div>`;
  return `<div style="text-align:center;display:flex;flex-direction:column;gap:6px"><b>You got a scratch card!</b><div class="scratch"><div class="prize"><div class="coin">C</div><span class="num" style="font-size:20px">${o.scratch.coins} Cheese Coins</span></div><canvas width="300" height="120" data-scratch="${o.id}" aria-label="Scratch card"></canvas></div><button class="btn sm" style="align-self:center" data-act="scratch-reveal" data-id="${o.id}">Reveal</button></div>`;
}

/* ----- staff login + staff screen ----- */
const L={uid:null,buf:'',err:''};
function renderLogin(){
  return `<div class="login"><div class="card ${L.err?'shake':''}"><h2 style="font-size:28px">Outlet login</h2><div class="small muted">Choose your name, then enter your 4-digit PIN.</div>
    <div class="users">${S.users.map(u=>`<button data-act="lg-user" data-v="${u.id}" aria-pressed="${L.uid===u.id}"><span class="av">${esc(u.name[0])}</span>${esc(u.name)}<small>${ROLES[u.role]}</small></button>`).join('')}</div>
    <div class="dots" aria-label="PIN entered">${[0,1,2,3].map(i=>`<i class="${L.buf.length>i?'on':''}"></i>`).join('')}</div>
    ${L.err?`<div class="msg-bad" style="text-align:center">${esc(L.err)}</div>`:''}
    <div class="keypad">${['1','2','3','4','5','6','7','8','9','C','0','←'].map(k=>`<button data-act="lg-key" data-v="${k}" aria-label="${k==='C'?'Clear':k==='←'?'Delete':k}">${k}</button>`).join('')}</div>
    <div class="demo">Demo PINs · Owner 1234 · Cashier 1111 · Kitchen 2222. Owners can change staff and PINs in the Staff screen.</div></div></div>`;
}
function lgKey(k){
  if(!L.uid){L.err='Choose your name first.';render();return}
  if(L.busy)return;if(k==='C')L.buf='';else if(k==='←')L.buf=L.buf.slice(0,-1);else if(L.buf.length<4)L.buf+=k;L.err='';
  if(L.buf.length===4&&!L.busy){const u=S.users.find(x=>x.id===L.uid);L.busy=true;
    api('/api/auth/staff',{id:L.uid,pin:L.buf}).then(r=>{if(r.ok&&u){S.staffId=u.id;pushLogin(L.buf);L.uid=null;saveLocal();U.pos.tab=ROLE_TABS[u.role][0];toast('Welcome, '+u.name)}else L.err='Wrong PIN. Try again.'},()=>{L.err='Could not reach the server.'}).finally(()=>{L.buf='';L.busy=false;render()})}
  render();
}
function vStaff(){
  const meU=staff();
  return `<div class="ph1"><h2>Staff & logins</h2><span class="muted small">Owners see everything. Cashiers: orders, counter, customers. Kitchen: kitchen and counter. Riders: their deliveries, sharing live location; give them the same name as in the outlet's rider list.</span></div>
  <div class="card tw"><table class="stk"><thead><tr><th>Name</th><th>Role</th><th>New PIN</th><th></th></tr></thead><tbody>
  ${S.users.map(u=>`<tr><td><input class="inp" data-us="${u.id}" data-f="name" value="${esc(u.name)}" aria-label="Name" style="min-width:140px"></td>
    <td><select class="inp" data-us="${u.id}" data-f="role" aria-label="Role" ${u.id===meU.id?'disabled':''}>${Object.entries(ROLES).map(([k,n])=>`<option value="${k}" ${u.role===k?'selected':''}>${n}</option>`).join('')}</select></td>
    <td><input class="inp num" data-us="${u.id}" data-f="pin" type="password" inputmode="numeric" maxlength="4" placeholder="4 digits" aria-label="New PIN" style="max-width:120px"></td>
    <td>${u.id===meU.id?'<span class="chip ready">You</span>':`<button class="btn sm bad" data-act="del-user" data-id="${u.id}">Remove</button>`}</td></tr>`).join('')}
  </tbody></table></div>
  <button class="btn pri" style="margin-top:12px" data-act="add-user">+ Add staff</button>
  <p class="small muted">A new PIN is saved when you leave the box. New staff start with PIN 0000.</p>`;
}

/* ----- extra events ----- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;
  
  switch(act){
    case 'auth':openAuth(el.dataset.v,el.dataset.next);break;
    case 'au-mode':U.au.m=el.dataset.v;U.au.err='';render();break;
    case 'drawer':setDrawer(!U.drawer);break;
    case 'hdr-cart':if(U.cart.length)openPubCart();else{U.pubView='menu';closeModal();render();document.getElementById('menu')?.scrollIntoView({behavior:RM()?'auto':'smooth'});toast('Your cart is empty. Pick something cheesy!')}break;
    case 'pub-gocat':U.pubCat=el.dataset.v;U.pubQ='';U.pubF={};U.pubView='menu';closeModal();render();document.getElementById('menu')?.scrollIntoView({behavior:RM()?'auto':'smooth'});break;
    case 'au-go':authGo();break;
    case 'au-code':if(U.au&&!U.au.busy)auSend();break;
    case 'pn':{const v=el.dataset.v;closeModal();
      if(v==='home'){U.pubView='home';render();window.scrollTo(0,0)}
      else if(v==='menu'||v==='offers'){U.pubView='menu';render();document.getElementById(v)?.scrollIntoView({behavior:'smooth'});if(v==='menu'&&!document.getElementById(v))window.scrollTo(0,0)}
      else if(v==='story'){U.pubView='home';render();document.getElementById('story')?.scrollIntoView({behavior:RM()?'auto':'smooth'})}
      else if(v==='track'){openTrackFind()}
      else if(v==='orders'||v==='wallet'){if(me()){U.pubView='account';U.accTab=v;render();window.scrollTo(0,0)}else openAuth('in',v)}
      else if(v==='account'){U.pubView='account';U.accTab='rewards';render();window.scrollTo(0,0)}
      else openAuth(v==='signup'?'up':'in');break}
    case 'pf-chip':{const t=el.dataset.v;pubForm.note=(pubForm.note?pubForm.note.replace(/[ ,.]*$/,'')+', ':'')+t;openPubCart();break}
    case 'pos-chip':{const t=el.dataset.v;U.pos.note=(U.pos.note?U.pos.note.replace(/[ ,.]*$/,'')+', ':'')+t;render();break}
    case 'account':U.pubView='account';U.accTab=U.accTab||'orders';closeModal();render();window.scrollTo(0,0);break;
    case 'acc-back':U.pubView='menu';render();window.scrollTo(0,0);break;
    case 'acc-tab':U.accTab=el.dataset.v;U.spin.result=null;render();break;
    case 'signout':askConfirm('Sign out?','You will need your mobile number and PIN to sign in again.','Sign out',()=>{S.me=null;save();U.pubView='menu';Object.assign(pubForm,{name:'',phone:'',address:'',useWallet:false});toast('Signed out');render()});break;
    case 'pr-save':{const c=me();c.name=document.getElementById('pr-name').value.trim()||c.name;c.bday=document.getElementById('pr-bday').value;c.addr=document.getElementById('pr-addr').value.trim();save();toast('Profile saved');render();break}
    case 'pr-pin':{const c=me();const o=document.getElementById('pr-old').value,n=document.getElementById('pr-new').value;if(!/^\d{4}$/.test(n)){toast('New PIN must be 4 digits');break}
      api('/api/auth/customer',{phone:c.phone,pin:o}).then(r=>{if(!r.ok){toast('Current PIN is wrong');return}setPin(c,n);save();toast('PIN updated');render()},()=>toast('Could not reach the server'));break}
    case 'topamt':U.topup=+el.dataset.v;render();break;
    case 'topup':{const v=Math.round(+document.getElementById('top-amt').value||0);if(v<50){toast('Minimum ₹50');break}U.topup=v;openTopup(v);break}
    case 'top-ok':{const v=+el.dataset.v;const c=me();walletAdd(c.phone,v,'Added money via UPI');if(v>=1000)walletAdd(c.phone,Math.round(v*.05),'Top-up bonus 5%');save();closeModal();confetti();toast(rs(v)+' added to wallet');render();break}
    case 'spin':doSpin();break;
    case 'copyref':{const t=el.dataset.t;try{navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Copy blocked — code: '+me().ref))}catch(_){toast('Code: '+me().ref)}break}
    case 'scratch-reveal':revealScratch(el.dataset.id);break;
    case 'lock':askConfirm('Log out?',APP_ROLE==='admin'?'This phone will stop ringing for new orders until someone logs in again.':'You will need your PIN to log in again.','Log out',()=>{pushLogout();riderStop();S.staffId=null;save();render()});break;
    case 'lg-user':L.uid=el.dataset.v;L.buf='';L.err='';render();break;
    case 'lg-key':lgKey(el.dataset.v);break;
    case 'add-user':{const u={id:uid('u'),name:'New staff',role:'cashier'};setPin(u,'0000');S.users.push(u)}save();render();break;
    case 'del-user':S.users=S.users.filter(u=>u.id!==el.dataset.id);save();render();break;
    case 'topup-pos':{const ph=el.dataset.ph;const v=Math.round(+document.getElementById('tw-amt').value||0);if(v<=0){toast('Enter an amount');break}walletAdd(ph,v,'Cash top-up at '+cur().name);save();toast(rs(v)+' added to wallet');render();break}
    case 'reset-pin':{const c=S.customers[el.dataset.ph];delete c.pin;delete c._newPin;if(S.me===c.phone)S.me=null;save();toast('PIN reset. Customer can sign up again with the same number.');render();break}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset.us)return;const u=S.users.find(x=>x.id===t.dataset.us);if(!u)return;
  if(t.dataset.f==='pin'){if(/^\d{4}$/.test(t.value)){setPin(u,t.value);t.value='';toast('PIN updated for '+u.name)}else toast('PIN must be 4 digits')}
  else u[t.dataset.f]=t.value;
  save();if(t.dataset.f!=='name')render();
});
document.addEventListener('input',e=>{const id=e.target.id||'';if(!id.startsWith('au-')||!U.au||mroot.contains(e.target))return;const k=id.slice(3);const dig=['phone','pin','pin2','otp'].includes(k);U.au[k]=dig?e.target.value.replace(/\D/g,''):e.target.value;
  if(dig)e.target.value=U.au[k];
  if(k==='pin'||k==='pin2'){const v=U.au[k];e.target.parentNode.querySelectorAll('i').forEach((b,i)=>{b.className=(i<v.length?'on':'')+(i===v.length?' cur':'')})}
  if(k==='phone'&&U.au.phone.length===10&&!U.au.pin)document.getElementById('au-pin')?.focus();
  if(k==='pin'&&U.au.pin.length===4){if(U.au.m==='in'&&U.au.phone.length===10)authGo();else document.getElementById('au-pin2')?.focus()}});
document.addEventListener('change',e=>{if(e.target.id==='au-bday'&&U.au)U.au.bday=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id||'').startsWith('au-')&&U.au){e.preventDefault();if(e.target.id==='au-email'&&OTP_ON&&!U.au.sent)auSend();else authGo()}});
document.addEventListener('keydown',e=>{if(S.mode==='pos'&&!staff()&&!mroot.innerHTML&&/^[0-9]$/.test(e.key))lgKey(e.key);else if(S.mode==='pos'&&!staff()&&e.key==='Backspace')lgKey('←')});

// Touch on the offers strip pauses it until the finger lifts, then a moment longer
let tickT;
document.addEventListener('touchstart',e=>{const t=e.target.closest('.ticker');if(t){clearTimeout(tickT);U.tickHold=true;t.classList.add('hold')}},{passive:true});
document.addEventListener('touchend',e=>{const t=document.querySelector('.ticker.hold');if(t){clearTimeout(tickT);tickT=setTimeout(()=>{U.tickHold=false;document.querySelectorAll('.ticker.hold').forEach(x=>x.classList.remove('hold'))},2500)}},{passive:true});
// After the invoice goes out, the thank-you button becomes the main one
document.addEventListener('click',e=>{const a=e.target.closest('[data-wa1]');if(!a)return;const b=a.parentNode.querySelector('[data-wa2]');a.classList.remove('pri');a.textContent='✓ Invoice sent';if(b)b.classList.add('pri')});
(async function boot(){
  let loc={};try{loc=JSON.parse(localStorage.getItem(LKEY))||{}}catch(_){}
  let d;try{d=await api('/api/state')}catch(_){
    introDone();app.innerHTML='<div class="card" style="max-width:480px;margin:60px auto;padding:20px"><h2>Can\'t reach the Cheesy Pizza server</h2><p class="muted">Start it with <code>npm start</code>, then open <b>http://localhost:3000</b>.</p></div>';return}
  S={cur:'o1',mode:'public',me:null,staffId:null,...loc};applyState(d);
  if(d.demoPending)try{if((await api('/api/demo/claim',{})).ok)seedDemoOrders()}catch(_){}
  migrate();
  if(location.hash==='#pos'||location.hash==='#public')S.mode=location.hash.slice(1);
  render();startPolling();introDone();
  if(S.staffId&&pushTok())pushSetup(); // keeps this phone's alert sign-up current
  cpushSetup();
  setTimeout(autoPerms,2500);
})();
</script>
