<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cheesy Pizza POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;600;700;800&family=Hind+Vadodara:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#eef6f7; --surface:#ffffff; --surface2:#e3f0f2; --ink:#0f2e36; --muted:#56727a; --line:#d3e4e7;
  --teal:#1a93a8; --teal-deep:#0f6f80; --teal-ink:#ffffff; --teal-soft:#d6eef2; --cheese:#f2b632; --cheese-soft:#fdf1d3; --cheese-ink:#5a3d00;
  --ok:#1f8a4c; --ok-soft:#dcf2e4; --warn:#b76a00; --warn-soft:#fdeccd; --bad:#d23f35; --bad-soft:#fbe0dd; --plum:#6b4fd0; --plum-soft:#e9e4fb;
  --map:#e8f1ee; --road:#ffffff; --shadow:0 1px 2px rgba(15,46,54,.06),0 8px 24px rgba(15,46,54,.08); --shadow-lg:0 18px 50px rgba(15,46,54,.18);
  --r:16px; --display:"Baloo Bhai 2","Trebuchet MS",system-ui,sans-serif; --body:"Hind Vadodara","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0a171b;--surface:#11242a;--surface2:#173038;--ink:#e2f0f2;--muted:#8fb0b7;--line:#234048;
  --teal:#3cbad0;--teal-deep:#1f8ea2;--teal-ink:#06262d;--teal-soft:#153e48;--cheese:#f5c24f;--cheese-soft:#3b2f12;--cheese-ink:#f9dd9b;
  --ok:#52c985;--ok-soft:#153a27;--warn:#f0a940;--warn-soft:#3d2d11;--bad:#f07a70;--bad-soft:#44201d;--plum:#a592f5;--plum-soft:#2a2350;
  --map:#15292d;--road:#23424a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);--shadow-lg:0 18px 50px rgba(0,0,0,.5);}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0a171b;--surface:#11242a;--surface2:#173038;--ink:#e2f0f2;--muted:#8fb0b7;--line:#234048;
  --teal:#3cbad0;--teal-deep:#1f8ea2;--teal-ink:#06262d;--teal-soft:#153e48;--cheese:#f5c24f;--cheese-soft:#3b2f12;--cheese-ink:#f9dd9b;
  --ok:#52c985;--ok-soft:#153a27;--warn:#f0a940;--warn-soft:#3d2d11;--bad:#f07a70;--bad-soft:#44201d;--plum:#a592f5;--plum-soft:#2a2350;
  --map:#15292d;--road:#23424a;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);--shadow-lg:0 18px 50px rgba(0,0,0,.5);}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
s{color:var(--muted);font-weight:500}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.pin{width:34px;height:34px;flex:none}
.brand b{font-family:var(--display);font-weight:800;font-size:21px;color:var(--teal);letter-spacing:.02em;line-height:1}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink)}
select.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;max-width:220px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .1s}
.btn:hover{border-color:var(--teal)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.chz{background:var(--cheese);border-color:var(--cheese);color:#3a2800}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.bad{color:var(--bad);border-color:var(--bad-soft)}
.btn.bad.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.lg{padding:12px 20px;font-size:16px;border-radius:12px}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.xg{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}.xg.off{opacity:.6}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;width:100%}
.inp:focus{border-color:var(--teal);outline:none}
textarea.inp{resize:vertical}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.placed{background:var(--plum-soft);color:var(--plum)}
.chip.preparing{background:var(--warn-soft);color:var(--warn)}
.chip.ready{background:var(--ok-soft);color:var(--ok)}
.chip.out{background:var(--teal-soft);color:var(--teal)}
.chip.done{background:var(--surface2);color:var(--muted)}
.chip.cancelled{background:var(--bad-soft);color:var(--bad)}
.chip.t{background:var(--teal-soft);color:var(--teal)}
.chip.c{background:var(--cheese-soft);color:var(--cheese-ink)}
.chip.r{background:var(--bad-soft);color:var(--bad)}
.veg{width:14px;height:14px;border:1.5px solid var(--ok);border-radius:3px;display:inline-grid;place-items:center;flex:none}
.veg::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.jain{font-size:10px;font-weight:700;color:var(--ok);border:1px solid var(--ok);border-radius:4px;padding:0 4px;line-height:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.grp-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.ticker{background:var(--ink);color:var(--bg);overflow:hidden;white-space:nowrap;font-weight:600;font-size:13px}
.ticker .tk{display:inline-flex;gap:36px;padding:8px 0;animation:tick 40s linear infinite;padding-left:100%}
.ticker .tk span b{color:var(--cheese)}
.ticker{cursor:default;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.ticker:hover .tk,.ticker.hold .tk{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-100%)}}
.pub{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
.hero{position:relative;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:center;padding:36px 32px;margin-top:18px;border-radius:28px;overflow:hidden;
  background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--teal) 22%,transparent) 1.2px,transparent 1.4px) 0 0/18px 18px,linear-gradient(135deg,var(--teal-soft),var(--surface) 70%);border:1px solid var(--line)}
.hero h1{font-size:clamp(38px,6.4vw,66px);font-weight:800;letter-spacing:-.015em}
.hero h1 .sw{position:relative;color:var(--teal);white-space:nowrap}
.hero h1 .sw svg{position:absolute;left:0;right:0;bottom:-.08em;width:100%;height:.28em}
.hero p{max-width:50ch;color:var(--muted);margin:14px 0 0;font-size:16px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:var(--display);font-size:24px;font-weight:800;line-height:1}
.facts span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.hero-art{position:relative;justify-self:center;width:min(400px,84vw);aspect-ratio:1;max-width:100%}
.hero-art .p1{position:absolute;left:0;top:0;border-radius:50%;object-fit:cover;width:92%;height:92%;box-shadow:var(--shadow-lg);border:8px solid var(--surface)}
.hero-art .p2{position:absolute;right:0;bottom:0;width:40%;height:40%;border-radius:50%;object-fit:cover;border:6px solid var(--surface);box-shadow:var(--shadow-lg)}
.sticker{position:absolute;left:-4%;bottom:14%;background:var(--cheese);color:#3a2800;border-radius:16px;padding:8px 14px;transform:rotate(-5deg);box-shadow:var(--shadow);max-width:60%}
.sticker b{font-family:var(--display);font-size:22px;font-weight:800;display:block;line-height:1}
.sticker small{font-size:12px;font-weight:600}
.outlet-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;margin-block:16px 8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 4px var(--ok-soft)}
.dot.off{background:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)}
.sec-h{display:flex;align-items:baseline;gap:12px;margin:30px 0 14px;flex-wrap:wrap}
.sec-h h2{font-size:30px;font-weight:800}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,320px);gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.hscroll>*{scroll-snap-align:start}
.coupon{position:relative;display:grid;grid-template-columns:96px 1fr;border-radius:18px;background:var(--surface);border:1px solid var(--line);overflow:hidden;min-height:118px}
.coupon .stub{display:grid;place-items:center;text-align:center;color:#fff;font-family:var(--display);font-weight:800;font-size:28px;line-height:.95;padding:8px;border-right:2px dashed rgba(255,255,255,.55)}
.coupon .stub small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em}
.coupon.k-day .stub{background:var(--teal)} .coupon.k-bogo .stub{background:var(--bad)} .coupon.k-item .stub{background:var(--cheese);color:#3a2800;border-color:rgba(0,0,0,.2)} .coupon.k-combo .stub{background:var(--plum)}
.coupon .ct{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.coupon .ct b{font-family:var(--display);font-size:18px;line-height:1.15}
.coupon .ct span{font-size:13px;color:var(--muted)}
.coupon .when{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.coupon.off{opacity:.55}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);background:var(--bg);z-index:5;padding-block:10px}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:600;white-space:nowrap}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.item{display:flex;flex-direction:column;overflow:hidden;transition:transform .18s,box-shadow .18s}
.item:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.item .ph{aspect-ratio:4/3;background:var(--surface2);position:relative;overflow:hidden}
.item .ph img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.item:hover .ph img{transform:scale(1.04)}
.pz{position:absolute;inset:14% 24%;border-radius:50%;background:radial-gradient(circle at 35% 40%,#e0452f 0 5%,transparent 6%),radial-gradient(circle at 62% 58%,#3f9b3a 0 5%,transparent 6%),radial-gradient(circle at 58% 30%,#f4c542 0 4%,transparent 5%),radial-gradient(circle at 38% 68%,#f4c542 0 4%,transparent 5%),radial-gradient(circle at 70% 38%,#7a3a1a 0 3%,transparent 4%),radial-gradient(circle,#f6d27a 0 68%,#d8913e 70% 100%);box-shadow:0 10px 24px rgba(0,0,0,.2)}
.pz.side{inset:24% 20%;border-radius:40% 40% 18px 18px;background:linear-gradient(160deg,#e8a24c,#c9722d)}
.pz.dessert{inset:24% 30%;border-radius:50% 50% 20px 20px;background:radial-gradient(circle at 50% 30%,#5a2b12 0 30%,#3a1a08 32% 100%)}
.pz.dip{inset:30% 32%;border-radius:10px 10px 40% 40%;background:linear-gradient(#f7d77a,#e9b44a)}
.ribbon{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap}
.ribbon span{background:var(--bad);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 8px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ribbon span.o{background:var(--cheese);color:#3a2800}
.item .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.item h3{font-size:19px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .desc{font-size:13px;color:var(--muted);flex:1}
.item .ft{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:4px}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.sizes span{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:1px 7px;font-weight:600}
.sizes span b{font-family:var(--display);font-size:15px}
.price{font-family:var(--display);font-weight:800;font-size:19px}
.combos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:16px}
.combo-card{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px;align-items:center}
.stack{display:flex}
.stack img,.stack .pzs{width:54px;height:54px;border-radius:50%;object-fit:cover;border:3px solid var(--surface);margin-left:-18px;box-shadow:var(--shadow);background:linear-gradient(160deg,#e8a24c,#c9722d);position:relative}
.stack>:first-child{margin-left:0}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.cartbar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.notice{background:var(--cheese-soft);color:var(--cheese-ink);border-radius:12px;padding:10px 14px;font-size:13px}
.savings{background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px}
.hint{background:var(--plum-soft);color:var(--plum);border-radius:12px;padding:8px 12px;font-weight:600;font-size:13px}

.track{display:flex;flex-direction:column;gap:14px}
.track-top{background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff;border-radius:18px;padding:16px 18px;display:flex;gap:12px;align-items:center}
.track-top h4{font-size:22px;font-weight:800}
.track-top .eta{margin-left:auto;text-align:center;background:rgba(255,255,255,.16);border-radius:14px;padding:6px 12px}
.track-top .eta b{display:block;font-family:var(--display);font-size:28px;line-height:1}
.map{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--map)}
.map svg{display:block;width:100%;height:auto}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding-bottom:14px;position:relative;color:var(--muted)}
.tl li::before{content:"";position:absolute;left:11px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-style:normal;font-size:12px;position:relative;z-index:1}
.tl li.on{color:var(--ink)}
.tl li.on i{background:var(--ok);border-color:var(--ok);color:#fff}
.tl li.on::before{background:var(--ok)}
.tl li.now i{box-shadow:0 0 0 5px var(--ok-soft);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px transparent}}
.tl li b{font-weight:700}
.rider{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface2)}
.rider .av{width:44px;height:44px;border-radius:50%;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px}

.pos{display:grid;grid-template-columns:210px 1fr;max-width:1400px;margin:0 auto;min-height:calc(100vh - 60px)}
.side{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.side button{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted)}
.side button svg{width:18px;height:18px;flex:none}
.side button[aria-current="page"]{background:var(--teal-soft);color:var(--teal)}
.side .cnt,.mobnav .cnt{margin-left:auto;background:var(--warn);color:#fff;border-radius:999px;font-size:11px;padding:0 7px}
.main{padding:16px;min-width:0;padding-bottom:96px}
.ph1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph1 h2{font-size:28px;font-weight:800;margin-right:auto}
.neworder{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.neworder>*{min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:80px;position:relative}
.tile:hover{border-color:var(--teal)}
.tile b{font-weight:600;font-size:14px;line-height:1.25;padding-right:10px}
.tile .num{color:var(--muted);font-size:12px;margin-top:auto}
.tile .tg{position:absolute;right:8px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.tile:disabled{opacity:.4}
.ticket{position:sticky;top:76px;display:flex;flex-direction:column;max-height:calc(100vh - 96px)}
.ticket .hd{padding:14px;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}
.ticket .lines{overflow:auto;padding:6px 14px;flex:1;min-height:80px}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .nm{font-weight:600}
.line .ad{font-size:12px;color:var(--muted);grid-column:1}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--surface2);width:28px;height:28px;font-weight:700}
.qty span{min-width:28px;text-align:center}
.lp{border:1px dashed transparent;background:transparent;font-weight:700;padding:2px 4px;border-radius:6px}
.lp:hover{border-color:var(--line)}
.lp-in{width:84px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;text-align:right;background:var(--surface)}
.lp-in:focus{border-color:var(--teal);outline:none}
.ticket .ft{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.bl{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.bl.disc{color:var(--ok);font-weight:600}
.tot{display:flex;justify-content:space-between;font-family:var(--display);font-size:24px;font-weight:800}
.custbox{background:var(--teal-soft);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.custbox.due{background:var(--bad-soft)}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.types button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 2px;font-size:13px;font-weight:600}
.types button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.kds{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.kt{border-radius:14px;border:2px solid var(--warn);background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:8px;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer;transition:transform .12s}
.kt:active{transform:scale(.98)}
.kt.placed{border-color:var(--plum);border-style:dashed;cursor:default}
.kt.late{border-color:var(--bad)}
.kt .no{font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.kt ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.kt li{font-size:15px;font-weight:600}
.kt li small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.kt li .q{display:inline-block;min-width:26px;background:var(--ink);color:var(--bg);border-radius:6px;text-align:center;margin-right:6px}
.kcol-h{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.kcol-h h3{font-size:19px}
.counter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.lane-h{display:flex;align-items:center;gap:8px}
.lane-h h3{font-size:19px;flex:1}
.lane-h .n{font-family:var(--display);font-weight:800;font-size:20px;background:var(--surface2);border-radius:10px;padding:0 10px}
.ctk{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.ctk .no{font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.ctk.ready{border-left:5px solid var(--ok)}
.ctk.prep{border-left:5px solid var(--warn)}
.ctk.out{border-left:5px solid var(--teal)}
.board{position:fixed;inset:0;z-index:70;background:#082a31;color:#fff;display:grid;grid-template-rows:auto 1fr;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.board h2{font-size:clamp(26px,4vw,48px)}
.board .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:18px;min-height:0}
.board .col{background:rgba(255,255,255,.06);border-radius:24px;padding:20px;overflow:auto}
.board .col h3{font-size:clamp(22px,3vw,36px);margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}
.board .nums{display:flex;flex-wrap:wrap;gap:14px}
.board .nums span{font-family:var(--display);font-weight:800;font-size:clamp(34px,5vw,64px);line-height:1;padding:10px 18px;border-radius:16px;background:rgba(255,255,255,.08)}
.board .col.rd h3{color:#7ee2a2}
.board .col.rd .nums span{background:#1f8a4c;animation:glow 2s infinite}
@keyframes glow{50%{background:#27a45c}}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.cx td{opacity:.55}
tr.cx td.st{opacity:1}
td.r,th.r{text-align:right}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.stat{padding:14px}
.stat .k{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.stat .v{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.1;margin-top:4px}
.stat .d{font-size:12px}
.stat.hero{grid-column:span 2;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat.hero .k{color:inherit;opacity:.7}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding:10px 4px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bar i{display:block;width:100%;max-width:46px;background:var(--teal);border-radius:6px 6px 2px 2px;min-height:2px}
.bar.cur i{background:var(--cheese)}
.bar span{font-size:11px;color:var(--muted);white-space:nowrap}
.bar b{font-size:11px;font-weight:600}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2)}
.split i{display:block;height:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.switch{position:relative;width:42px;height:24px;flex:none;display:inline-block}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--teal);outline-offset:2px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600;cursor:pointer;position:relative}
.days label:has(input:checked){background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.days input{position:absolute;opacity:0;pointer-events:none}
.sizechips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sizechips .chip{font-size:13px;padding:4px 6px 4px 12px;background:var(--surface2);color:var(--ink)}
.sizechips .chip button{border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:0 4px}
.desc-in{min-height:38px;font-size:13px}

.scrim{position:fixed;inset:0;background:rgba(6,20,24,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:20px;width:min(540px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow-lg)}
.modal .mh{padding:16px 18px 10px;display:flex;align-items:flex-start;gap:12px;position:sticky;top:0;background:var(--surface);z-index:2}
.modal .mh h3{font-size:23px;font-weight:800;flex:1}
.modal .mb{padding:4px 18px 18px;display:flex;flex-direction:column;gap:14px}
.x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.opt input{accent-color:var(--teal);width:18px;height:18px}
.opt .p{margin-left:auto;font-weight:600}
.paymodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.paymodes button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 6px;font-weight:700}
.paymodes button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--surface2);border-radius:14px;padding:14px}
.calc .big{font-family:var(--display);font-size:30px;font-weight:800;line-height:1}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-weight:600}
.qr{display:grid;place-items:center;gap:8px;word-break:break-all;text-align:center;background:#fff;color:#0f2e36;border-radius:14px;padding:16px}
.qr img,.qr canvas{width:180px!important;height:180px!important}
.receipt{background:#fffef8;color:#1a1a1a;font-family:"Courier New",ui-monospace,monospace;font-size:13px;line-height:1.35;padding:16px 14px;border-radius:6px;box-shadow:inset 0 0 0 1px #e8e2c8;white-space:pre;overflow-x:auto;width:100%;max-width:340px;margin:0 auto}
.bignum{font-family:var(--display);font-size:54px;font-weight:800;color:var(--teal);line-height:1;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:80;box-shadow:var(--shadow)}

.mobnav{display:none}
/* ===== v3 public look ===== */
.hero3{position:relative;margin-top:18px;border-radius:32px;overflow:hidden;background:radial-gradient(120% 90% at 85% 40%,#1c8fa3 0,#0d4f5c 45%,#082a31 100%);color:#fff;display:grid;grid-template-columns:1.05fr 1fr;gap:24px;align-items:center;padding:64px 40px 48px}
.hero3 .drip{position:absolute;left:0;top:0;width:100%;height:46px}
.h-copy{position:relative;z-index:1}
.hero3 h1{font-size:clamp(40px,6.6vw,74px);font-weight:800;color:#fff;letter-spacing:-.015em}
.hero3 h1 .sw{color:#ffd166;position:relative;white-space:nowrap;display:inline-block}
.hero3 h1 .sw svg{position:absolute;left:0;bottom:-.02em;width:100%;height:.3em;overflow:visible}
.hero3 p{color:rgba(255,255,255,.82);max-width:48ch;font-size:16px;margin:16px 0 0}
.eyebrow{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#52c985;box-shadow:0 0 0 3px rgba(82,201,133,.3)}
.hero3 .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.btn.ghost:hover{border-color:#fff}
.hero3 .facts b{color:#fff}.hero3 .facts span{color:rgba(255,255,255,.65)}
.plate{position:relative;width:min(420px,76vw);aspect-ratio:1;margin:0 auto;max-width:100%}
.plate::before{content:"";position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(255,209,102,.38),transparent 65%)}
.plate img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 10px rgba(255,255,255,.07),0 0 0 24px rgba(255,255,255,.035);animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{position:absolute;z-index:2;background:#fff;color:#0f2e36;border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;gap:6px;align-items:center;animation:bob 3.2s ease-in-out infinite alternate;white-space:nowrap}
.fl i{width:9px;height:9px;border-radius:50%;display:inline-block}
.fl.f1{left:-8%;top:10%}.fl.f2{right:-6%;top:44%;animation-delay:-1.1s}.fl.f3{left:-2%;bottom:10%;animation-delay:-2.2s}
@keyframes bob{to{transform:translateY(-10px)}}
.plate .sticker{left:auto;right:-4%;bottom:-2%;transform:rotate(6deg);z-index:2}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.how>div{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.how b{grid-row:span 2;width:42px;height:42px;border-radius:12px;background:var(--cheese);color:#3a2800;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:800}
.how h3{font-size:18px}.how p{margin:0;font-size:13px;color:var(--muted)}
.gu{font-family:var(--body);color:var(--teal);font-weight:600;font-size:17px}
.coins-band{margin-top:26px;border-radius:22px;padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:linear-gradient(120deg,var(--cheese-soft),var(--surface) 80%);border:1px solid var(--line)}
.coins-band h3{font-size:22px}
.coin{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe7a3,#f2b632 55%,#c98a12);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;color:#5a3d00;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 6px 14px rgba(201,138,18,.35);flex:none}
.coin.sm{width:24px;height:24px;font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .inp{max-width:240px;border-radius:999px;padding:7px 14px}
.filters button{border:1px dashed var(--muted);background:transparent;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{border-style:solid;border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.foot{margin-top:44px;background:#082a31;color:#d8eef1;border-radius:28px;padding:28px 24px;display:grid;grid-template-columns:1fr 2fr;gap:24px}
.foot h3{color:#fff;font-size:26px}.foot .ol{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.foot .ol>div{background:rgba(255,255,255,.06);border-radius:14px;padding:12px}
.foot .ol b{color:#fff}.foot small,.foot p{color:rgba(216,238,241,.75)}
.codechip{align-self:flex-start;font-family:ui-monospace,"Courier New",monospace;font-weight:700;font-size:13px;border:1.5px dashed var(--ink);border-radius:6px;padding:0 8px;letter-spacing:.06em}
.coupon.k-code .stub{background:#0b3a43}
.viz{width:min(220px,62vw);height:auto;display:block;margin:0 auto}
@media (max-width:600px){.modal .vizwrap .viz{width:min(190px,50vw)}}
.pub .item .ph{cursor:zoom-in}
.zoom{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:0 auto;border-radius:50%;overflow:visible;touch-action:none;cursor:zoom-in;user-select:none;-webkit-user-select:none}
.zoom>img,.zoom>svg{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;box-shadow:var(--shadow-lg);pointer-events:none;-webkit-user-drag:none}
.zoom>.pz{position:absolute}
.zoom .lens{position:absolute;display:none;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 2px var(--teal);background:var(--surface);pointer-events:none;z-index:3}
.zoom .lens>*{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;border-radius:50%;box-shadow:none}
.modal .vizwrap{position:sticky;top:58px;z-index:1;background:var(--surface);padding-bottom:4px}
.viz .tp{transform-box:fill-box;transform-origin:center}
.viz .tp.new{animation:topDrop .55s cubic-bezier(.3,1.4,.5,1) both}
.viz.bump{animation:vizBump .6s .25s ease}
@keyframes topDrop{from{opacity:0;transform:translateY(-70px) scale(1.8) rotate(-40deg)}70%{opacity:1}to{opacity:1;transform:none}}
@keyframes vizBump{40%{transform:scale(1.04)}}
.viz circle{transition:r .35s ease}
.vizcap{text-align:center;font-weight:600;font-size:13px;color:var(--muted);margin-top:-6px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.tables button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 0;font-weight:700;font-size:13px}
.tables button.busy{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-soft)}
.tables button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pbar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}.pbar i{display:block;height:100%;background:var(--warn)}
.kt.late .pbar i{background:var(--bad)}
.rate{background:var(--cheese-soft);color:var(--cheese-ink);border-radius:14px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.stars{display:flex;gap:2px}.stars button{border:0;background:transparent;font-size:32px;color:var(--cheese);line-height:1;padding:2px 4px}
.stars:hover button{color:var(--cheese)}.stars button:hover~button{color:var(--line)}
.msg-ok{color:var(--ok);font-weight:600;font-size:13px}.msg-bad{color:var(--bad);font-weight:600;font-size:13px}
.codes{display:flex;gap:6px;flex-wrap:wrap}
.codes button{border:1.5px dashed var(--teal);background:var(--teal-soft);color:var(--teal);border-radius:8px;padding:2px 10px;font-family:ui-monospace,"Courier New",monospace;font-weight:700;font-size:12px}
/* ===== v4 accounts, wallet, fun ===== */
.acct{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:3px 12px 3px 3px;font-weight:700}
.av{width:30px;height:30px;border-radius:50%;background:var(--cheese);color:#3a2800;display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.acc{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:flex;flex-direction:column;gap:16px}
.acc-hero{border-radius:28px;padding:24px;color:#fff;background:radial-gradient(120% 120% at 90% 0,#1c8fa3,#0d4f5c 50%,#082a31);display:flex;gap:16px;flex-wrap:wrap;align-items:center;position:relative;overflow:hidden}
.acc-hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(242,182,50,.35),transparent 70%)}
.acc-hero h2{font-size:clamp(26px,4vw,36px);color:#fff}
.acc-hero p{margin:4px 0 0;color:rgba(255,255,255,.75);font-size:14px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.kpi{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:10px 14px;min-width:104px}
.kpi b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.kpi span{font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{padding:16px;display:flex;flex-direction:column;gap:12px}
.wgrid{display:grid;grid-template-columns:minmax(0,360px) 1fr;gap:16px;align-items:start}
.wcard{aspect-ratio:1.6;width:100%;border-radius:22px;padding:20px;color:#fff;background:linear-gradient(135deg,#0b3a43,#1a93a8 60%,#f2b632 150%);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.wcard::after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.09)}
.wcard .bal{font-family:var(--display);font-size:40px;font-weight:800;line-height:1}
.wcard .chipi{width:42px;height:30px;border-radius:7px;background:linear-gradient(135deg,#ffe7a3,#c98a12)}
.wcard small{opacity:.75;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.amts{display:flex;gap:8px;flex-wrap:wrap}
.amts button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:700}
.amts button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.tx{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}.tx .pos{color:var(--ok);font-weight:700}.tx .neg{color:var(--bad);font-weight:700}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.wheel-wrap{position:relative;width:min(270px,78vw);margin:4px auto 0}
.wheel-wrap .wheel{transition:transform 4.2s cubic-bezier(.15,.7,.2,1);width:100%;display:block}
.wheel-wrap .ptr{position:absolute;left:50%;top:-8px;transform:translateX(-50%);border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--bad);z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:10px}
.badge{text-align:center;padding:12px 8px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.badge .bi{width:52px;height:52px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;background:radial-gradient(circle at 35% 30%,#ffe7a3,#f2b632 60%,#c98a12);color:#5a3d00;box-shadow:0 6px 14px rgba(201,138,18,.3)}
.badge.lock{opacity:.5}.badge.lock .bi{background:var(--surface2);color:var(--muted);box-shadow:none}

<script>
// Letters of the name rise one by one; the intro stays about 4 s (3 to 5), then fades out
// once the app has loaded (introDone), or after 8 s at most. A tap skips it.
(function(){
  const el=document.getElementById('intro'),h=el.querySelector('h1'),t0=Date.now();let gone=false;
  [...'CHEESY PIZZA'].forEach((c,i)=>{const s=document.createElement('span');if(c===' ')s.className='sp';else s.textContent=c;s.style.animationDelay=(.9+i*.06)+'s';h.appendChild(s)});
  const hide=()=>{if(gone)return;gone=true;el.classList.add('out');setTimeout(()=>el.remove(),600)};
  window.introDone=()=>setTimeout(hide,Math.max(0,4000-(Date.now()-t0)));
  el.addEventListener('click',()=>{if(Date.now()-t0>800)hide()});
  setTimeout(hide,8000);
})();
</script>

<script>
// Built-in photos are named (img/margherita.jpg); uploaded ones are stored as a path (api/images/…)
const IMG=n=>/[\/:]/.test(n)?n:'img/'+n+'.jpg';
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* Lookup lists and settings come from the database (see applyConfig) */
let CATS=[],GU={},TYPES={},PAY={},PAYCOL={},COOK=[],ORDER_CHIPS=[],SEGS=[];
let PREP_MIN=15,RIDE_MIN=20,COIN_RATE=0.05,OPEN_H=12,CLOSE_H=22;
function applyConfig(c){
  CATS=c.categories.map(x=>[x.id,x.label]);GU=Object.fromEntries(c.categories.map(x=>[x.id,x.labelGu||'']));
  TYPES=Object.fromEntries(c.orderTypes.map(x=>[x.id,x.label]));
  PAY=Object.fromEntries(c.payModes.map(x=>[x.id,x.label]));PAYCOL=Object.fromEntries(c.payModes.map(x=>[x.id,x.color]));
  COOK=c.cookNotes||[];ORDER_CHIPS=c.orderChips||[];SEGS=c.wheel||[];
  PREP_MIN=c.prepMin??15;RIDE_MIN=c.rideMin??20;COIN_RATE=c.coinRate??0.05;OPEN_H=c.openHour??12;CLOSE_H=c.closeHour??22;
  // Older databases don't have these yet
  if(!PAY.bank){PAY.bank='Bank / Cheque';PAYCOL.bank='#56727a'}
  PAY.pending='Not paid yet';PAYCOL.pending='#d23f35';
  WAITS=c.waitTimes||[15,20,30,40];
}
let WAITS=[15,20,30,40];
const COUNTER_MODES=['cash','upi','card','bank'];
// Extra choices for non-pizza items (owners can change them per item on the Menu screen)
const ITEM_OPTS={pockets:['Spicy','No spicy','Less paneer','Less onion','Less capsicum'],bread:['Spicy','No spicy','Less onion','Extra crispy']};
const itemOpts=m=>m.options||ITEM_OPTS[m.cat]||[];
// Extra menus (Extra veg topping, Toppings, ...) the owner sets up on the Menu screen.
// A line's picks are in l.ex as [{g: menu id, n: item name}], a name twice = double.
const extraMenus=m=>(S.extras||[]).filter(g=>g.active!==false&&(!Array.isArray(g.pizzas)||g.pizzas.includes(m.id)));
function exPrice(e,size){const g=(S.extras||[]).find(x=>x.id===e.g);if(!g)return 0;const it=g.items.find(i=>i.name===e.n)||(e.c?g.items.find(i=>+i.prices?.[size]):null);return +(it?.prices?.[size]||0)}
const exText=ex=>topsText((ex||[]).map(e=>e.n));
const SIZE_COLS=['#1a93a8','#0f2e36','#6b4fd0','#b76a00','#d23f35'];
const sizeColor=id=>{const i=S.sizes.findIndex(s=>s.id===id);return (S.sizes[i]||{}).color||SIZE_COLS[Math.max(0,i)%SIZE_COLS.length]};
const topsText=t=>{const c={};(t||[]).forEach(x=>c[x]=(c[x]||0)+1);return Object.entries(c).map(([n,q])=>n+(q>1?' ×'+q:''))};
const hr12=h=>((h+11)%12)+1;
const hoursText=()=>hr12(OPEN_H)+'–'+hr12(CLOSE_H);
const noteText=l=>[...(l.notes||[]),l.note].filter(Boolean).join(' · ');

/* ===== DATA: saved in the server's database ===== */
// Shared data lives on the server. This device only remembers its outlet,
// site mode and who is signed in.
// Where friends download the app, sent with referral codes. Switch to the Play Store page once it is live:

async function api(url,body){

  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'HTTP '+r.status);return j;

const entries=n=>{const c=S[n]||(MAPS[n]?{}:[]);return MAPS[n]?Object.entries(c):c.map(o=>[o.id,o])};
function snapshot(){SNAP={};SYNCED.forEach(n=>{SNAP[n]=new Map(entries(n).map(([k,o])=>[k,JSON.stringify(o)]))})}
function applyState(d){

function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(Object.fromEntries(LOCAL_KEYS.map(k=>[k,S[k]]))))}catch(e){}}
// A new PIN is sent to the server once, which stores only its hash
function setPin(o,pin){o.pin=true;o._newPin=pin}
function save(){saveLocal();if(!pendingFlush)pendingFlush=setTimeout(flush,0)}
// Send only the records that changed since the last save
function diff(){
  const up={},del={};let any=false;
  SYNCED.forEach(n=>{
    const seen=new Set(),ch=[];
    entries(n).forEach(([k,o])=>{seen.add(k);const j=JSON.stringify(o);if(SNAP[n].get(k)!==j){ch.push([k,JSON.parse(j)]);if(o._newPin)delete o._newPin;SNAP[n].set(k,JSON.stringify(o))}});
    const gone=[...SNAP[n].keys()].filter(k=>!seen.has(k));gone.forEach(k=>SNAP[n].delete(k));
    if(ch.length){up[n]=MAPS[n]?Object.fromEntries(ch):ch.map(x=>x[1]);any=true}
    if(gone.length){del[n]=gone;any=true}
  });
  return any?{upsert:up,delete:del}:null;
}
function flush(){
  pendingFlush=null;const ch=diff();if(!ch)return syncQ;inFlight++;
  syncQ=syncQ.then(()=>api('/api/sync',ch)).then(onSynced,e=>{
    // Mark the records as unsaved so the next save sends them again
    console.error(e);Object.entries(ch.upsert).forEach(([n,v])=>(Array.isArray(v)?v.map(o=>o.id):Object.keys(v)).forEach(k=>SNAP[n].delete(k)));
    Object.entries(ch.delete).forEach(([n,ks])=>ks.forEach(k=>SNAP[n].set(k,'')));
    toast('Not saved: server unreachable. Retrying…');setTimeout(save,4000);
  }).finally(()=>inFlight--);
  return syncQ;
}
function onSynced(r){
  if(r.prev!==VER)VER=-1;else VER=r.version; // someone else saved too: refresh on the next poll
  S.seq=r.seq;
  const ren=Object.entries(r.renumbered||{});
  ren.forEach(([id,no])=>{const o=S.orders.find(x=>x.id===id);if(o){o.no=no;SNAP.orders.set(id,JSON.stringify(o))}});
  if(ren.length&&!mroot.innerHTML&&!isBusy())render();
}
// Pull other devices' changes; skipped while this device has unsaved edits
async function refresh(){
  if(pendingFlush||inFlight)return false;
  const v=await api('/api/version');if(v.version===VER)return false;
  const d=await api('/api/state');if(pendingFlush||inFlight)return false;
  applyState(d);migrate();return true;
}

        if(st==='placed'){o.source='online';if(o.type==='zomato'){o.type='delivery';o.address='B-4, Green Park'}if(o.type==='delivery'&&!o.address)o.address='B-4, Green Park'}

function dayOK(o,dow){return !o.days||!o.days.length||o.days.includes(dow)}
function activeOffers(dow){return S.offers.filter(o=>o.active&&dayOK(o,dow))}
function computeBill(items,dateStr,extra){
  extra=extra||{};
  const dow=new Date((dateStr||today())+'T12:00:00').getDay();
  const act=activeOffers(dow);const L=items.map(l=>({l,base:l.unit*l.qty,flag:!!(l.combo||l.custom)}));
  const subtotal=L.reduce((s,x)=>s+x.base,0);const disc=[];
  act.filter(o=>o.type==='item').forEach(o=>{
    let amt=0;L.forEach(x=>{if(x.flag||x.l.itemId!==o.itemId)return;if(o.size!=='any'&&o.size!==x.l.size)return;
      const m=menuItem(o.itemId);if(!m)return;const pz=itemPrice(m,x.l.size);
      const cut=o.kind==='pct'?pz*o.value/100:Math.max(0,pz-o.value);amt+=cut*x.l.qty;x.flag=true});
    if(amt>0)disc.push({name:o.name,amt:Math.round(amt)});
  });
  const cands=[];let hint=null;
  act.filter(o=>o.type==='bogo').forEach(o=>{
    const units=[];L.forEach(x=>{if(x.flag||x.l.cat!=='pizza')return;if(o.size!=='any'&&o.size!==x.l.size)return;for(let i=0;i<x.l.qty;i++)units.push(x.l.unit)});
    units.sort((a,b)=>b-a);let amt=0;for(let i=1;i<units.length;i+=2)amt+=units[i];
    if(amt>0)cands.push({name:o.name,amt});
    else if(units.length===1)hint=hint||`Add one more ${o.size==='any'?'':sizeLabel(o.size)+' '}pizza and get it free (${o.name})`;
  });
  act.filter(o=>o.type==='day').forEach(o=>{
    const elig=L.filter(x=>!x.flag&&(o.scope==='all'||x.l.cat==='pizza')).reduce((s,x)=>s+x.base,0);
    if(subtotal>=(o.min||0)){if(elig>0)cands.push({name:o.name+' '+o.pct+'%',amt:Math.round(elig*o.pct/100)})}
    else if(subtotal>0)hint=hint||`Add ${rs(o.min-subtotal)} more to get ${o.pct}% off (${o.name})`;
  });
  if(cands.length){cands.sort((a,b)=>b.amt-a.amt);disc.push(cands[0])}
  let discount=disc.reduce((s,d)=>s+d.amt,0);
  let codeMsg=null,codeOk=false;

  if(code){
    const cd=findCode(code,extra.phone);
    if(!cd||!cd.active)codeMsg='This code is not valid.';
    else if(codeBlock(cd,extra.phone))codeMsg=codeBlock(cd,extra.phone);
    else if(!dayOK(cd,dow))codeMsg=`${cd.code} works on ${daysText(cd.days)} only.`;
    else if(subtotal<(cd.min||0))codeMsg=`Add ${rs(cd.min-subtotal)} more to use ${cd.code}.`;
    else{const left=subtotal-discount;let a=cd.kind==='pct'?Math.round(left*cd.value/100):+cd.value;if(cd.kind==='pct'&&cd.cap)a=Math.min(a,cd.cap);a=Math.max(0,Math.min(a,left));
      if(a>0){disc.push({name:'Code '+cd.code,amt:a});discount+=a;codeOk=true;codeMsg=`${cd.code} applied · you save ${rs(a)}`}}
  }
  const coinsMax=Math.floor(Math.max(0,subtotal-discount)*0.2);let coinsUsed=0;
  if(extra.coins>0){coinsUsed=Math.min(Math.floor(extra.coins),coinsMax);if(coinsUsed>0){disc.push({name:`Cheese Coins (${coinsUsed})`,amt:coinsUsed});discount+=coinsUsed}}
  const comboSave=items.filter(l=>l.combo).reduce((s,l)=>s+Math.max(0,(l.worth||0)-l.unit)*l.qty,0);
  const total=Math.max(0,subtotal-discount);
  return {subtotal,discounts:disc,discount,total,hint,saved:discount+comboSave,codeMsg,codeOk,coinsUsed,coinsMax,earn:Math.floor(total*COIN_RATE)};
}

const hashStr=t=>[...t].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
function topPieces(ex,r,prev){
  const groups={};ex.forEach(e=>{const k=e.g+'|'+e.n;groups[k]=(groups[k]||0)+1});let out='',drop=0;
  Object.entries(groups).forEach(([k,c])=>{const name=k.split('|')[1],h=hashStr(name),n=c*7,was=Math.min(prev?.[k]??n,n);
    const shape=(TOP_SHAPES.find(([re])=>re.test(name))||[0,(x,y,i)=>`<rect x="${x-3}" y="${y-2}" width="6" height="4" rx="1.5" fill="${['#3f9b3a','#e0452f','#f4c542','#7a3a1a'][h%4]}" transform="rotate(${i*47} ${x} ${y})"/>`])[1];
    for(let i=0;i<n;i++){const a=(h%360)*Math.PI/180+i*2.399,rr=(r-15)*Math.sqrt(((h>>3)+i*37)%97/97+.03);
      const x=+(100+rr*Math.cos(a)).toFixed(1),y=+(100+rr*Math.sin(a)).toFixed(1),isNew=i>=was;
      out+=`<g class="tp${isNew?' new':''}"${isNew?` style="animation-delay:${(drop++*.045).toFixed(2)}s"`:''}>${shape(x,y,i+h)}</g>`}});
  return {out,drop};
}

function commitOrder(o){
  const out=S.outlets.find(x=>x.id===o.outletId);
  const k=o.outletId+'|'+o.date;S.seq[k]=(S.seq[k]||0)+1;
  o.no=out.code+'-'+String(S.seq[k]).padStart(3,'0');
  const b=computeBill(o.items,o.date,{...(o.extra||{}),phone:o.customer.phone});o.subtotal=b.subtotal;o.discounts=b.discounts;o.total=b.total;o.coinsUsed=b.coinsUsed;o.coinsEarned=(o.customer.phone||'').length===10?b.earn:0;
  o.times=o.times||{};o.times.placed=o.times.placed||o.ts;if(o.status==='preparing')o.times.preparing=o.times.preparing||o.ts;

// Customer pages: fade in when a page opens, and cards rise in as they scroll into view.
// A re-render of the same page (a poll, a filter) shows everything at once, without replaying.
let revealObs=null;
function animatePub(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!('IntersectionObserver' in window))return;
  if(!U.enter)return;
  app.classList.remove('enter');void app.offsetWidth;app.classList.add('enter');
  revealObs?.disconnect();
  revealObs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');revealObs.unobserve(e.target)}}),{rootMargin:'0px 0px -6% 0px'});
  const els=app.querySelectorAll('.pub .item,.pub .coupon,.pub .combo-card,.pub .how>div,.pub .sec-h,.pub .outlet-bar,.pub .foot,.hm-col,.hm-box,.hm-bev,.hm-banner,.hm-cats,.hm-nomayo,.hm-addr,.hm-feat,.hm-flow,.hm-pz,.hm-steps');
  // What is on screen already stays visible (the page fades in); only what is further down rises in
  let i=0;els.forEach(el=>{if(el.getBoundingClientRect().top<innerHeight)return;el.style.setProperty('--d',(i++%4)*70+'ms');el.classList.add('rv');revealObs.observe(el)});
}
// A drawn pizza for items without a photo: toppings come from the item's description
function pizzaArt(m){
  const t=(m.name+' '+m.desc).toLowerCase();let seed=[...m.id+m.name].reduce((a,c)=>a*31+c.charCodeAt(0)>>>0,7);
  const rnd=()=>(seed=(seed*1103515245+12345)>>>0)/4294967296;
  const kinds=[['capsicum|veggi|bell','cap','#3f9b3a'],['tomato','tom','#e0452f'],['olive','oli','#2a2a2a'],['corn','corn','#f6c443'],['paneer|cottage','pan','#fff7e6'],['onion','oni','#9b3b7a'],['jalapeno','jal','#5aa832'],['paprika|red cap|chilli|peri|spicy|kadai|kathiyavadi','pap','#c8281e'],['yellow','ycap','#f2c230'],['mushroom','mush','#b48b63']];
  let tops=kinds.filter(([re])=>new RegExp(re).test(t));if(!tops.length)tops=[['','basil','#2f7d32']];
  const parts=[];const n=Math.min(26,10+tops.length*4);
  for(let i=0;i<n;i++){const k=tops[i%tops.length];const a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*62,x=100+Math.cos(a)*r,y=100+Math.sin(a)*r,rot=rnd()*180|0;
    const c=k[2];
    if(k[1]==='cap'||k[1]==='ycap'||k[1]==='pap')parts.push(`<path d="M-8 0q8-9 16 0" transform="translate(${x|0} ${y|0}) rotate(${rot})" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`);
    else if(k[1]==='oni')parts.push(`<path d="M-7 2a7 7 0 0 1 14 0" transform="translate(${x|0} ${y|0}) rotate(${rot})" fill="none" stroke="${c}" stroke-width="2.4" opacity=".8"/>`);
    else if(k[1]==='oli')parts.push(`<circle cx="${x|0}" cy="${y|0}" r="4.5" fill="none" stroke="${c}" stroke-width="3"/>`);
    else if(k[1]==='pan')parts.push(`<rect x="${x-5|0}" y="${y-5|0}" width="10" height="10" rx="2" transform="rotate(${rot} ${x|0} ${y|0})" fill="${c}" stroke="#e5c48f"/>`);
    else if(k[1]==='corn')parts.push(`<circle cx="${x|0}" cy="${y|0}" r="3" fill="${c}" stroke="#d49a1c" stroke-width=".8"/>`);
    else if(k[1]==='tom')parts.push(`<circle cx="${x|0}" cy="${y|0}" r="7" fill="${c}" opacity=".92"/><circle cx="${x+2|0}" cy="${y-1|0}" r="2.3" fill="#f6a089"/>`);
    else parts.push(`<ellipse cx="${x|0}" cy="${y|0}" rx="5" ry="3" transform="rotate(${rot} ${x|0} ${y|0})" fill="${c}"/>`);
  }
  const id='pa'+m.id.replace(/\W/g,'');
  return `<svg class="pzart" viewBox="0 0 200 200" aria-hidden="true"><defs><radialGradient id="${id}c" cx=".45" cy=".4"><stop offset=".8" stop-color="#eeb15e"/><stop offset="1" stop-color="#b9682a"/></radialGradient><radialGradient id="${id}h" cx=".42" cy=".38"><stop offset="0" stop-color="#fde7a2"/><stop offset=".7" stop-color="#f6cf6b"/><stop offset="1" stop-color="#eab04a"/></radialGradient></defs>
    <ellipse cx="100" cy="108" rx="92" ry="88" fill="rgba(0,0,0,.12)"/><circle cx="100" cy="100" r="92" fill="url(#${id}c)"/><circle cx="100" cy="100" r="79" fill="#cf4a2a"/><circle cx="100" cy="100" r="76" fill="url(#${id}h)"/>
    ${[...Array(9)].map(()=>`<circle cx="${100+(rnd()-.5)*110|0}" cy="${100+(rnd()-.5)*110|0}" r="${6+rnd()*9|0}" fill="#fff3c4" opacity=".45"/>`).join('')}
    ${parts.join('')}<g stroke="rgba(120,60,20,.18)" stroke-width="1.4">${[0,45,90,135].map(a=>`<line x1="100" y1="24" x2="100" y2="176" transform="rotate(${a} 100 100)"/>`).join('')}</g></svg>`;
}

function zoomMove(el,e){
  let lens=el.querySelector('.lens');const b=el.getBoundingClientRect(),Z=2.2,L=Math.min(150,b.width*.5);
  if(!lens){lens=document.createElement('div');lens.className='lens';const c=el.firstElementChild.cloneNode(true);c.removeAttribute('loading');lens.appendChild(c);el.appendChild(lens)}
  const x=Math.max(0,Math.min(b.width,e.clientX-b.left)),y=Math.max(0,Math.min(b.height,e.clientY-b.top)),up=e.pointerType==='touch'?L*.75:0;
  Object.assign(lens.style,{width:L+'px',height:L+'px',left:(x-L/2)+'px',top:(y-L/2-up)+'px',display:'block'});
  Object.assign(lens.firstElementChild.style,{width:b.width+'px',height:b.height+'px',transform:`translate(${L/2-x*Z}px,${L/2-y*Z}px) scale(${Z})`});
}
document.addEventListener('pointerdown',e=>{const z=e.target.closest('[data-zoom]');if(!z)return;z.setPointerCapture?.(e.pointerId);z.dataset.on='1';zoomMove(z,e)});
document.addEventListener('pointermove',e=>{const z=e.target.closest('[data-zoom]');if(z&&(z.dataset.on||e.pointerType==='mouse'))zoomMove(z,e)});
['pointerup','pointercancel','pointerleave'].forEach(t=>document.addEventListener(t,e=>{const z=e.target.closest?.('[data-zoom]');if(!z)return;if(t==='pointerup'&&e.pointerType==='mouse')return;delete z.dataset.on;const l=z.querySelector('.lens');if(l)l.style.display='none'},true));

  if(!sizes.some(s=>s.id===st.size))st.size=sizes[0].id;
  // Lines saved before extra menus used the veg / cheese add-ons: move them into the menus

/* ===== TRACKING ===== */
function trackInfo(o){
  const t=o.times||{};const now=Date.now();const del=o.type==='delivery';
  let head,eta=null,prog=0;
  const prepStart=t.preparing||t.placed||o.ts;
  if(o.status==='placed'){head='Waiting for the outlet to accept';eta=waitOf(o)+(del?RIDE_MIN:0)}
  else if(o.status==='preparing'){head='Your pizza is in the oven';eta=Math.max(2,waitOf(o)-Math.floor((now-prepStart)/60000))+(del?RIDE_MIN:0)}
  else if(o.status==='ready'){head=del?'Packed · rider is picking it up':o.type==='dine'?'Ready · serving to your table':'Ready at the counter';eta=del?RIDE_MIN:0}
  else if(o.status==='out'){const f=Math.min(.95,(now-(t.out||now))/(RIDE_MIN*60000));prog=Math.max(.05,f);head='On the way to you';eta=Math.max(1,Math.ceil(RIDE_MIN*(1-f)))}
  else if(o.status==='done'){head=doneLabel(o.type)+'. Enjoy your pizza!';prog=1}
  else head='Order cancelled by the outlet';
  return {head,eta,prog};
}

function pad(a,b,w=32){a=String(a);b=String(b);const sp=w-a.length-b.length;return sp>0?a+' '.repeat(sp)+b:a.slice(0,w-b.length-1)+' '+b}
function center(s,w=32){s=String(s);return ' '.repeat(Math.max(0,Math.floor((w-s.length)/2)))+s}
function billText(o){
  const out=outletOf(o);const L=[];const hr='-'.repeat(32);
  L.push(center('CHEESY PIZZA'),center('Really Cheesy...!'),center(out.name),center('Ph: '+fmtPhone(out.phone)),center('PURE VEG'),hr);
  L.push(pad('Bill: '+o.no,TYPES[o.type]),pad(fmtDate(o.date),fmtTime(o.ts)));
  if(o.customer.name||o.customer.phone)L.push('Cust: '+(o.customer.name||'')+' '+(o.customer.phone||''));
  if(o.table)L.push('Table: '+o.table);if(o.address)L.push('Addr: '+o.address.slice(0,26));if(o.zomatoId)L.push('Zomato ID: '+o.zomatoId);
  L.push(hr,pad('Item','Amt'),hr);
  o.items.forEach(l=>{L.push(pad(l.qty+' x '+l.name.slice(0,20),String(l.unit*l.qty)));const a=addonText(l);if(a)L.push('   '+a.slice(0,29))});
  L.push(hr,pad('Item total','Rs '+o.subtotal));(o.discounts||[]).forEach(d=>L.push(pad(d.name.slice(0,22),'-'+d.amt)));
  L.push(pad('TOTAL','Rs '+o.total),o.paid?pad('Paid by',PAY[o.pay.mode]):pad('Payment','BAKI '+(o.pay.mode==='due'?'(on account)':'(not paid)')));if(o.walletUsed&&o.pay.mode!=='wallet')L.push(pad('From wallet','Rs '+o.walletUsed));if(o.coinsEarned)L.push(pad('Cheese Coins earned','+'+o.coinsEarned));
  if(o.pay.mode==='cash'&&o.pay.given)L.push(pad('Given','Rs '+o.pay.given),pad('Return','Rs '+o.pay.change));
  if(o.status==='cancelled')L.push(hr,center('*** CANCELLED ***'));
  L.push(hr,center('Thank you! Visit again'),center('No Mayonnaise Products'));
  return L.join('\n');
}
function wrapTxt(t,w){const out=[];let line='';String(t).split(' ').forEach(x=>{if((line+' '+x).trim().length>w){if(line)out.push(line);line=x}else line=(line+' '+x).trim()});if(line)out.push(line);return out}
// round: print only the items added in that round (more items for a running table)
function kotText(o,round){
  const L=[];const hr='='.repeat(32);
  L.push(center(round>1?'KOT · ADDED ITEMS ('+round+')':'KOT'),hr,pad('Order '+o.no,TYPES[o.type]),pad(fmtTime(round>1?Date.now():o.ts),o.table?'Table '+o.table:''));
  if(o.zomatoId)L.push('Zomato ID: '+o.zomatoId);if(o.customer.name)L.push('Cust: '+o.customer.name.slice(0,26));if(!round||round===1)L.push('Wait: '+waitOf(o)+' min');L.push(hr);
  o.items.filter(l=>!round||(l.round||1)===round).forEach(l=>{L.push(l.qty+' x '+l.name);if(l.combo)(l.picks||[]).forEach(p=>L.push('    - '+p));if(l.size)L.push('    Size: '+sizeLabel(l.size));l.addons.forEach(a=>L.push('    + '+(S.addons[a]?.name||a)));topsText(l.tops).forEach(t=>L.push('    + '+t));exText(l.ex).forEach(t=>L.push('    + '+t));if(noteText(l))wrapTxt(noteText(l),26).forEach((t,i)=>L.push((i?'       ':'    >> ')+t))});if(o.note){L.push('-'.repeat(32));wrapTxt('NOTE: '+o.note,32).forEach(t=>L.push(t))}
  L.push(hr);return L.join('\n');
}

function salesFor(date,scope){
  const list=S.orders.filter(o=>o.date===date&&o.status!=='cancelled'&&(scope==='all'||o.outletId===S.cur));
  const by={cash:0,upi:0,card:0,bank:0,wallet:0,zomato:0,due:0,pending:0};list.forEach(o=>{const w=o.walletUsed||0;by.wallet+=w;by[o.pay.mode]=(by[o.pay.mode]||0)+o.total-w});
  const tot=list.reduce((s,o)=>s+o.total,0);const disc=list.reduce((s,o)=>s+((o.subtotal||o.total)-o.total),0);
  const types={};list.forEach(o=>types[o.type]=(types[o.type]||0)+o.total);
  const items={};list.forEach(o=>o.items.forEach(l=>{items[l.name]=(items[l.name]||0)+l.qty}));
  const offers={};list.forEach(o=>(o.discounts||[]).forEach(d=>offers[d.name]=(offers[d.name]||0)+d.amt));

// Shrink a chosen photo in the browser so uploads stay small (max 1200px, JPEG)
function shrinkImage(file){return new Promise((ok,bad)=>{
  if(!/^image\//.test(file.type))return bad(new Error('Choose a photo (JPG, PNG or WebP)'));
  const url=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const k=Math.min(1,1200/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.85))};
  im.onerror=()=>{URL.revokeObjectURL(url);bad(new Error('Could not read this photo'))};im.src=url})}

// Menu order is kept in each item's `ord`, so moving items survives a reload
function numberMenu(){S.menu.forEach((m,i)=>m.ord=i)}
function sortMenu(){const idx=new Map(S.menu.map((m,i)=>[m.id,i]));S.menu.sort((a,b)=>(a.ord??idx.get(a.id))-(b.ord??idx.get(b.id)))}
function moveItem(id,dir){
  const i=S.menu.findIndex(m=>m.id===id);const cat=S.menu[i].cat;let j=i+dir;
  while(j>=0&&j<S.menu.length&&S.menu[j].cat!==cat)j+=dir;
  if(j<0||j>=S.menu.length)return;
  [S.menu[i],S.menu[j]]=[S.menu[j],S.menu[i]];numberMenu();save();
}

const ROLES={owner:'Owner',manager:'Manager',cashier:'Cashier',kitchen:'Kitchen'};
const ROLE_TABS={owner:TABS.map(t=>t[0]),manager:TABS.map(t=>t[0]).filter(k=>k!=='staff'),cashier:['new','counter','orders','cust'],kitchen:['kitchen','counter']};
function ensureCust(ph,name){const c=S.customers[ph]||(S.customers[ph]={phone:ph,name:name||'',due:0,coins:0});
  c.wallet=c.wallet||0;c.tx=c.tx||[];c.myCodes=c.myCodes||[];c.ref=c.ref||('CP'+ph.slice(-5));if(name&&!c.name)c.name=name;return c}
function migrate(){
  Object.keys(S.customers).forEach(ph=>ensureCust(ph));
  if(!S.users.some(u=>u.id===S.staffId))S.staffId=null;
  if(S.me&&!S.customers[S.me])S.me=null;
  if(!S.outlets.some(o=>o.id===S.cur))S.cur=S.outlets[0]&&S.outlets[0].id;
  save();
}
const me=()=>S.me&&S.customers[S.me]&&S.customers[S.me].pin?S.customers[S.me]:null;
const staff=()=>S.users.find(u=>u.id===S.staffId)||null;
const walletOf=ph=>Math.floor(S.customers[ph]?.wallet||0);
function walletAdd(ph,amt,note){const c=ensureCust(ph);c.wallet=Math.max(0,Math.round((c.wallet||0)+amt));c.tx.unshift({ts:Date.now(),kind:'wallet',amt:Math.round(amt),note})}
function coinAdd(ph,amt,note){const c=ensureCust(ph);c.coins=Math.max(0,Math.round((c.coins||0)+amt));c.tx.unshift({ts:Date.now(),kind:'coins',amt:Math.round(amt),note})}
function findCode(code,ph){
  const c=ph&&S.customers[ph];const pc=c&&(c.myCodes||[]).find(x=>x.code===code);
  if(pc)return {...pc,type:'code',days:[],active:!pc.used,personal:true};
  return S.offers.find(o=>o.type==='code'&&String(o.code||'').toUpperCase()===code);
}
function codeBlock(cd,ph){
  if(cd.until&&today()>cd.until)return 'This code has expired.';
  const mine=ph&&ph.length===10?S.orders.filter(o=>o.customer.phone===ph&&o.status!=='cancelled'):[];
  if(cd.firstOnly){if(!ph||ph.length!==10)return 'Add your mobile number to use this first-order code.';if(mine.length)return 'This code is only for your first order.'}
  if(cd.once&&mine.some(o=>(o.extra?.code||'').toUpperCase()===cd.code))return 'You have already used this code.';
  return null;
}
function refundOrder(o){
  const amt=(o.walletUsed||0)+(o.source==='online'&&o.paid&&o.pay.mode==='upi'?o.total-(o.walletUsed||0):0);
  if(amt>0&&o.customer.phone&&!o.refunded){walletAdd(o.customer.phone,amt,'Refund for '+o.no);o.refunded=amt;toast(rs(amt)+' refunded to wallet')}
}
const BADGES=[
 ['FB','First Bite','First order placed',os=>os.length>=1],
 ['CL','Cheese Lover','5 orders',os=>os.length>=5],
 ['SM','Spice Master','3 spicy items',os=>os.reduce((s,o)=>s+o.items.filter(l=>menuItem(l.itemId)?.spicy).reduce((a,l)=>a+l.qty,0),0)>=3],
 ['CK','Combo King','Ordered a combo',os=>os.some(o=>o.items.some(l=>l.combo))],
 ['EB','Early Bird','Ordered before 1 pm',os=>os.some(o=>new Date(o.ts).getHours()<13)],
 ['NO','Night Owl','Ordered after 9 pm',os=>os.some(o=>new Date(o.ts).getHours()>=21)],
 ['CR','Critic','Rated an order',os=>os.some(o=>o.rating)],
 ['SS','Smart Saver','Used a coupon code',os=>os.some(o=>o.extra&&o.extra.code)],
];
function wheelSVG(){
  const cx=110,r=104;let g='';
  SEGS.forEach((s,i)=>{const a0=(i*45-112.5)*Math.PI/180,a1=((i+1)*45-112.5)*Math.PI/180;
    const x0=cx+r*Math.cos(a0),y0=cx+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cx+r*Math.sin(a1);const am=(i*45-90);
    g+=`<path d="M${cx} ${cx}L${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${s.c}"/>`;
    g+=`<text transform="rotate(${am+90} ${cx} ${cx})" x="${cx}" y="${cx-62}" text-anchor="middle" font-size="12" font-weight="800" fill="${s.c==='#f2b632'?'#3a2800':'#fff'}" font-family="Baloo Bhai 2,sans-serif">${s.t}</text>`});
  return `<svg class="wheel" id="wheel" viewBox="0 0 220 220" style="transform:rotate(${U.spin.deg}deg)" role="img" aria-label="Prize wheel"><circle cx="110" cy="110" r="109" fill="#082a31"/>${g}<circle cx="110" cy="110" r="22" fill="#fff"/><text x="110" y="116" text-anchor="middle" font-size="16" font-weight="800" fill="#1a93a8" font-family="Baloo Bhai 2,sans-serif">C</text></svg>`;
}
function doSpin(){
  const c=me();if(!c||U.spin.busy)return;if(c.spinDate===today()){toast('You have already spun today. Come back tomorrow!');return}
  const idx=Math.floor(Math.random()*SEGS.length);
  U.spin.busy=true;U.spin.deg=U.spin.deg-(U.spin.deg%360)+360*6+(360-idx*45)%360;
  const w=document.getElementById('wheel');if(w)w.style.transform=`rotate(${U.spin.deg}deg)`;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{
    const s=SEGS[idx];c.spinDate=today();let msg;
    if(s.k==='coins'){coinAdd(c.phone,s.v,'Spin & win');msg=`You won ${s.v} Cheese Coins!`}
    else if(s.k==='none'){msg='So close! Try again tomorrow.'}
    else{const code='SPIN'+Math.random().toString(36).slice(2,6).toUpperCase();
      c.myCodes.unshift({code,name:s.t==='Free dip'?'Free Cheesy Dip':'Spin reward',kind:s.k,value:s.v,min:s.min||0,cap:s.k==='pct'?100:0,until:addDays(today(),7)});
      msg=`You won ${s.t}! Your code ${code} is saved under My coupons.`}
    U.spin.busy=false;U.spin.result=msg;save();if(s.k!=='none')confetti();render();

/* ----- scratch card ----- */
function initScratch(){
  document.querySelectorAll('canvas[data-scratch]').forEach(cv=>{
    if(cv.dataset.ready)return;cv.dataset.ready=1;const ctx=cv.getContext('2d');const W=cv.width,H=cv.height;
    const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#b9c6c9');g.addColorStop(.5,'#e3ecee');g.addColorStop(1,'#9fb0b4');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#46626a';ctx.font='700 20px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('Scratch here to win',W/2,H/2+7);
    let down=false,n=0;const scr=e=>{const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,18,0,7);ctx.fill();if(++n===45)revealScratch(cv.dataset.scratch)};
    cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);scr(e)});cv.addEventListener('pointermove',e=>{if(down)scr(e)});cv.addEventListener('pointerup',()=>down=false);
  });
}
function revealScratch(id){const o=S.orders.find(x=>x.id===id);if(!o||!o.scratch||o.scratch.done)return;o.scratch.done=true;coinAdd(o.customer.phone,o.scratch.coins,'Scratch card '+o.no);save();confetti();toast(o.scratch.coins+' Cheese Coins added!');setTimeout(()=>{if(U.trackId===id)openTrack()},700)}
function scratchBlock(o){
  if(!o.scratch)return '';
  if(o.scratch.done)return `<div class="savings num" style="text-align:center">You won ${o.scratch.coins} Cheese Coins from your scratch card</div>`;
  return `<div style="text-align:center;display:flex;flex-direction:column;gap:6px"><b>You got a scratch card!</b><div class="scratch"><div class="prize"><div class="coin">C</div><span class="num" style="font-size:20px">${o.scratch.coins} Cheese Coins</span></div><canvas width="300" height="120" data-scratch="${o.id}" aria-label="Scratch card"></canvas></div><button class="btn sm" style="align-self:center" data-act="scratch-reveal" data-id="${o.id}">Reveal</button></div>`;

  return `<div class="login"><div class="card ${L.err?'shake':''}"><h2 style="font-size:28px">Outlet login</h2><div class="small muted">Choose your name, then enter your 4-digit PIN.</div>
    <div class="users">${S.users.map(u=>`<button data-act="lg-user" data-v="${u.id}" aria-pressed="${L.uid===u.id}"><span class="av">${esc(u.name[0])}</span>${esc(u.name)}<small>${ROLES[u.role]}</small></button>`).join('')}</div>
    <div class="dots" aria-label="PIN entered">${[0,1,2,3].map(i=>`<i class="${L.buf.length>i?'on':''}"></i>`).join('')}</div>
    ${L.err?`<div class="msg-bad" style="text-align:center">${esc(L.err)}</div>`:''}
    <div class="keypad">${['1','2','3','4','5','6','7','8','9','C','0','←'].map(k=>`<button data-act="lg-key" data-v="${k}" aria-label="${k==='C'?'Clear':k==='←'?'Delete':k}">${k}</button>`).join('')}</div>
    <div class="demo">Demo PINs · Owner 1234 · Cashier 1111 · Kitchen 2222. Owners can change staff and PINs in the Staff screen.</div></div></div>`;
}
function lgKey(k){
  if(!L.uid){L.err='Choose your name first.';render();return}
  if(L.busy)return;if(k==='C')L.buf='';else if(k==='←')L.buf=L.buf.slice(0,-1);else if(L.buf.length<4)L.buf+=k;L.err='';
  if(L.buf.length===4&&!L.busy){const u=S.users.find(x=>x.id===L.uid);L.busy=true;
    api('/api/auth/staff',{id:L.uid,pin:L.buf}).then(r=>{if(r.ok&&u){S.staffId=u.id;L.uid=null;saveLocal();U.pos.tab=ROLE_TABS[u.role][0];toast('Welcome, '+u.name)}else L.err='Wrong PIN. Try again.'},()=>{L.err='Could not reach the server.'}).finally(()=>{L.buf='';L.busy=false;render()})}
  render();
}
function vStaff(){
  const meU=staff();
  return `<div class="ph1"><h2>Staff & logins</h2><span class="muted small">Owners see everything. Cashiers: orders, counter, customers. Kitchen: kitchen and counter.</span></div>
  <div class="card tw"><table><thead><tr><th>Name</th><th>Role</th><th>New PIN</th><th></th></tr></thead><tbody>
  ${S.users.map(u=>`<tr><td><input class="inp" data-us="${u.id}" data-f="name" value="${esc(u.name)}" aria-label="Name" style="min-width:140px"></td>
    <td><select class="inp" data-us="${u.id}" data-f="role" aria-label="Role" ${u.id===meU.id?'disabled':''}>${Object.entries(ROLES).map(([k,n])=>`<option value="${k}" ${u.role===k?'selected':''}>${n}</option>`).join('')}</select></td>
    <td><input class="inp num" data-us="${u.id}" data-f="pin" type="password" inputmode="numeric" maxlength="4" placeholder="4 digits" aria-label="New PIN" style="max-width:120px"></td>
    <td>${u.id===meU.id?'<span class="chip ready">You</span>':`<button class="btn sm bad" data-act="del-user" data-id="${u.id}">Remove</button>`}</td></tr>`).join('')}
  </tbody></table></div>
  <button class="btn pri" style="margin-top:12px" data-act="add-user">+ Add staff</button>
  <p class="small muted">A new PIN is saved when you leave the box. New staff start with PIN 0000.</p>`;
}

/* ----- extra events ----- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act;
  
  switch(act){
    case 'auth':openAuth(el.dataset.v,el.dataset.next);break;
    case 'au-mode':U.au.m=el.dataset.v;U.au.err='';render();break;
    case 'au-go':authGo();break;
    case 'pn':{const v=el.dataset.v;closeModal();
      if(v==='home'){U.pubView='home';render();window.scrollTo(0,0)}
      else if(v==='menu'||v==='offers'){U.pubView='menu';render();document.getElementById(v)?.scrollIntoView({behavior:'smooth'});if(v==='menu'&&!document.getElementById(v))window.scrollTo(0,0)}
      else if(v==='track'){openTrackFind()}
      else if(v==='orders'||v==='wallet'){if(me()){U.pubView='account';U.accTab=v;render();window.scrollTo(0,0)}else openAuth('in',v)}
      else if(v==='account'){U.pubView='account';U.accTab='rewards';render();window.scrollTo(0,0)}
      else openAuth(v==='signup'?'up':'in');break}
    case 'pf-chip':{const t=el.dataset.v;pubForm.note=(pubForm.note?pubForm.note.replace(/[ ,.]*$/,'')+', ':'')+t;openPubCart();break}
    case 'pos-chip':{const t=el.dataset.v;U.pos.note=(U.pos.note?U.pos.note.replace(/[ ,.]*$/,'')+', ':'')+t;render();break}
    case 'account':U.pubView='account';U.accTab=U.accTab||'orders';closeModal();render();window.scrollTo(0,0);break;
    case 'acc-back':U.pubView='menu';render();window.scrollTo(0,0);break;
    case 'acc-tab':U.accTab=el.dataset.v;U.spin.result=null;render();break;
    case 'signout':S.me=null;save();U.pubView='menu';Object.assign(pubForm,{name:'',phone:'',address:'',useWallet:false});toast('Signed out');render();break;
    case 'pr-save':{const c=me();c.name=document.getElementById('pr-name').value.trim()||c.name;c.bday=document.getElementById('pr-bday').value;c.addr=document.getElementById('pr-addr').value.trim();save();toast('Profile saved');render();break}
    case 'pr-pin':{const c=me();const o=document.getElementById('pr-old').value,n=document.getElementById('pr-new').value;if(!/^\d{4}$/.test(n)){toast('New PIN must be 4 digits');break}
      api('/api/auth/customer',{phone:c.phone,pin:o}).then(r=>{if(!r.ok){toast('Current PIN is wrong');return}setPin(c,n);save();toast('PIN updated');render()},()=>toast('Could not reach the server'));break}
    case 'topamt':U.topup=+el.dataset.v;render();break;
    case 'topup':{const v=Math.round(+document.getElementById('top-amt').value||0);if(v<50){toast('Minimum ₹50');break}U.topup=v;openTopup(v);break}
    case 'top-ok':{const v=+el.dataset.v;const c=me();walletAdd(c.phone,v,'Added money via UPI');if(v>=1000)walletAdd(c.phone,Math.round(v*.05),'Top-up bonus 5%');save();closeModal();confetti();toast(rs(v)+' added to wallet');render();break}
    case 'spin':doSpin();break;
    case 'copyref':{const t=el.dataset.t;try{navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>toast('Copy blocked — code: '+me().ref))}catch(_){toast('Code: '+me().ref)}break}
    case 'scratch-reveal':revealScratch(el.dataset.id);break;
    case 'lock':S.staffId=null;save();render();break;
    case 'lg-user':L.uid=el.dataset.v;L.buf='';L.err='';render();break;
    case 'lg-key':lgKey(el.dataset.v);break;
    case 'add-user':{const u={id:uid('u'),name:'New staff',role:'cashier'};setPin(u,'0000');S.users.push(u)}save();render();break;
    case 'del-user':S.users=S.users.filter(u=>u.id!==el.dataset.id);save();render();break;
    case 'topup-pos':{const ph=el.dataset.ph;const v=Math.round(+document.getElementById('tw-amt').value||0);if(v<=0){toast('Enter an amount');break}walletAdd(ph,v,'Cash top-up at '+cur().name);save();toast(rs(v)+' added to wallet');render();break}
    case 'reset-pin':{const c=S.customers[el.dataset.ph];delete c.pin;delete c._newPin;if(S.me===c.phone)S.me=null;save();toast('PIN reset. Customer can sign up again with the same number.');render();break}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset.us)return;const u=S.users.find(x=>x.id===t.dataset.us);if(!u)return;
  if(t.dataset.f==='pin'){if(/^\d{4}$/.test(t.value)){setPin(u,t.value);t.value='';toast('PIN updated for '+u.name)}else toast('PIN must be 4 digits')}
  else u[t.dataset.f]=t.value;
  save();if(t.dataset.f!=='name')render();
});
document.addEventListener('input',e=>{const id=e.target.id||'';if(!id.startsWith('au-')||!U.au||mroot.contains(e.target))return;const k=id.slice(3);U.au[k]=k==='phone'||k==='pin'||k==='pin2'?e.target.value.replace(/\D/g,''):e.target.value;
  if(k==='phone'||k==='pin'||k==='pin2')e.target.value=U.au[k];
  if(k==='pin'||k==='pin2'){const v=U.au[k];e.target.parentNode.querySelectorAll('i').forEach((b,i)=>{b.className=(i<v.length?'on':'')+(i===v.length?' cur':'')})}
  if(k==='phone'&&U.au.phone.length===10&&!U.au.pin)document.getElementById('au-pin')?.focus();
  if(k==='pin'&&U.au.pin.length===4){if(U.au.m==='in'&&U.au.phone.length===10)authGo();else document.getElementById('au-pin2')?.focus()}});
document.addEventListener('change',e=>{if(e.target.id==='au-bday'&&U.au)U.au.bday=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id||'').startsWith('au-')&&U.au){e.preventDefault();authGo()}});
document.addEventListener('keydown',e=>{if(S.mode==='pos'&&!staff()&&!mroot.innerHTML&&/^[0-9]$/.test(e.key))lgKey(e.key);else if(S.mode==='pos'&&!staff()&&e.key==='Backspace')lgKey('←')});

// Touch on the offers strip pauses it until the finger lifts, then a moment longer
let tickT;
document.addEventListener('touchstart',e=>{const t=e.target.closest('.ticker');if(t){clearTimeout(tickT);U.tickHold=true;t.classList.add('hold')}},{passive:true});
document.addEventListener('touchend',e=>{const t=document.querySelector('.ticker.hold');if(t){clearTimeout(tickT);tickT=setTimeout(()=>{U.tickHold=false;document.querySelectorAll('.ticker.hold').forEach(x=>x.classList.remove('hold'))},2500)}},{passive:true});
(async function boot(){
  let loc={};try{loc=JSON.parse(localStorage.getItem(LKEY))||{}}catch(_){}
  let d;try{d=await api('/api/state')}catch(_){
    introDone();app.innerHTML='<div class="card" style="max-width:480px;margin:60px auto;padding:20px"><h2>Can\'t reach the Cheesy Pizza server</h2><p class="muted">Start it with <code>npm start</code>, then open <b>http://localhost:3000</b>.</p></div>';return}
  S={cur:'o1',mode:'public',me:null,staffId:null,...loc};applyState(d);
  if(d.demoPending)try{if((await api('/api/demo/claim',{})).ok)seedDemoOrders()}catch(_){}
  migrate();
  if(location.hash==='#pos'||location.hash==='#public')S.mode=location.hash.slice(1);
  render();startPolling();introDone();
})();
</script>

</body></html>
